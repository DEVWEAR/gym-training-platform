<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV Exercises</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07080a;color:#fff}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 90% 0,#64101088,transparent 28%),linear-gradient(135deg,#060708,#111318);z-index:-1}.wrap{max-width:1200px;margin:auto;padding:20px}.nav,.top,.meta{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:2px}.red{color:#ff3838}.muted{color:#969aa4;line-height:1.5}.btn,.chip{background:#111318;border:1px solid #ffffff18;color:#fff;padding:11px 14px;border-radius:999px;cursor:pointer}.btn.active,.chip.active{border-color:#ff3838;background:#351313}.hero{padding:42px 0 18px}.hero h1{font-size:clamp(40px,7vw,74px);margin:8px 0}.layout{display:grid;grid-template-columns:220px 1fr;gap:14px}.panel{background:#101216;border:1px solid #ffffff12;border-radius:22px;padding:16px}.cats{display:grid;gap:8px}.cat{width:100%;text-align:left;background:#0b0d10;border:1px solid #ffffff12;color:#fff;padding:14px;border-radius:14px;cursor:pointer}.cat.active{border-color:#ff3838;background:#311111}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:190px;background:#090a0d;border:1px solid #ffffff18;color:#fff;padding:13px;border-radius:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.exercise{background:#0b0d10;border:1px solid #ffffff12;border-radius:18px;padding:16px;cursor:pointer}.exercise:hover{border-color:#ffffff35}.visual{height:170px;border-radius:14px;background:linear-gradient(145deg,#181b20,#0b0d10);display:grid;place-items:center;border:1px solid #ffffff0d;margin-bottom:13px;text-align:center;padding:15px}.model{font-size:52px}.exercise h3{margin:6px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;background:#ffffff09;padding:6px 9px;border-radius:999px}.detail{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.detail.show{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#111318;border:1px solid #ffffff20;border-radius:24px;padding:22px}.demo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pose{min-height:210px;border-radius:16px;background:#090a0d;border:1px solid #ffffff12;display:grid;place-items:center;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:#090a0d;padding:12px;border-radius:13px;text-align:center}.close{float:right;width:40px;height:40px;border:0;border-radius:50%;background:#ffffff0d;color:#fff;font-size:20px}.arabic{text-align:right}.arabic .cat{text-align:right}.arabic .close{float:left}@media(max-width:760px){.layout{grid-template-columns:1fr}.cats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero{padding-top:28px}}</style></head><body><main class="wrap"><nav class="nav"><div class="brand"><span class="red">DEV</span> TRAINING</div><div><button class="btn" onclick="location.href='index.html'" id="home"></button> <button class="btn" id="lang" onclick="toggleLang()"></button></div></nav><section class="hero"><small class="red" id="eyebrow"></small><h1 id="title"></h1><p class="muted" id="intro"></p></section><div class="layout"><aside class="panel"><div class="cats" id="cats"></div></aside><section class="panel"><div class="toolbar"><input class="search" id="search" oninput="render()"><button class="chip active" data-eq="all" onclick="eqPick(this,'all')">ALL</button><button class="chip" data-eq="dumbbell" onclick="eqPick(this,'dumbbell')">DUMBBELL</button><button class="chip" data-eq="barbell" onclick="eqPick(this,'barbell')">BARBELL</button><button class="chip" data-eq="cable" onclick="eqPick(this,'cable')">CABLE</button><button class="chip" data-eq="machine" onclick="eqPick(this,'machine')">MACHINE</button></div><div class="grid" id="grid"></div></section></div></main><div class="detail" id="detail"><div class="sheet"><button class="close" onclick="closeDetail()">×</button><div id="detailBody"></div></div></div><script src="exercise-library.js"></script><script>let lang=localStorage.getItem('gymLanguage')||'en',cat='chest',eq='all';const $=x=>document.getElementById(x),ar=()=>lang==='ar';const equipment={dumbbell:['Dumbbell','دمبل'],barbell:['Barbell','بار'],cable:['Cable','كيبل'],machine:['Machine','جهاز'],bodyweight:['Bodyweight','وزن الجسم']};function t(a,b){return ar()?b:a}function apply(){document.documentElement.lang=lang;document.documentElement.dir=ar()?'rtl':'ltr';document.body.classList.toggle('arabic',ar());$('lang').textContent=ar()?'English':'العربية';$('home').textContent=t('← Home','الرئيسية ←');$('eyebrow').textContent=t('EXERCISE LIBRARY','مكتبة التمارين');$('title').textContent=t('TRAIN WITH PRECISION.','تمرّن بدقة.');$('intro').textContent=t('Choose a muscle and equipment. Every exercise has a consistent visual demonstration, prescription and target area.','اختر العضلة والمعدة. كل تمرين يحتوي على شرح بصري ثابت، الجرعات التدريبية والمنطقة المستهدفة.');$('search').placeholder=t('Search exercises...','ابحث عن تمرين...');renderCats();render()}function renderCats(){$('cats').innerHTML=Object.entries(DEV_EXERCISE_CATEGORIES).map(([k,v])=>`<button class="cat ${k===cat?'active':''}" onclick="cat='${k}';renderCats();render()"><b>${ar()?v.ar:v.en}</b><br><small class="muted">${DEV_EXERCISES.filter(x=>x.cat===k).length} ${t('exercises','تمارين')}</small></button>`).join('')}function eqPick(el,v){eq=v;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}function render(){let q=$('search').value.toLowerCase();let xs=DEV_EXERCISES.filter(x=>x.cat===cat&&(eq==='all'||x.eq===eq)&&(!q||(x.en+' '+x.ar).toLowerCase().includes(q)));$('grid').innerHTML=xs.length?xs.map(x=>`<article class="exercise" onclick="openDetail('${x.id}')"><div class="visual"><div><div class="model">🏋️</div><small class="muted">${t('DEV MODEL • START / END','مودل DEV • البداية / النهاية')}</small></div></div><div class="top"><div><small class="red">${x.sub.toUpperCase()}</small><h3>${ar()?x.ar:x.en}</h3></div></div><div class="tags"><span class="tag">${ar()?equipment[x.eq][1]:equipment[x.eq][0]}</span><span class="tag">${x.sets} × ${x.reps}</span><span class="tag">RIR ${x.rir}</span></div></article>`).join(''):`<p class="muted">${t('No exercises match this filter.','لا توجد تمارين مطابقة لهذا الاختيار.')}</p>`}function openDetail(id){let x=DEV_EXERCISES.find(e=>e.id===id);$('detailBody').innerHTML=`<small class="red">${x.sub.toUpperCase()}</small><h2>${ar()?x.ar:x.en}</h2><p class="muted">${t('Use controlled form and progress only when technique stays clean.','استخدم أداءً متحكماً وزد الحمل فقط عندما يبقى الأداء صحيحاً.')}</p><div class="demo"><div class="pose"><div><div class="model">🏋️</div><b>${t('START','البداية')}</b><p class="muted">${t('Consistent DEV model','مودل DEV الثابت')}</p></div></div><div class="pose"><div><div class="model">🏋️</div><b>${t('END','النهاية')}</b><p class="muted">${t('Consistent DEV model','مودل DEV الثابت')}</p></div></div></div><div class="stats"><div class="stat"><small class="muted">${t('SETS','المجموعات')}</small><br><b>${x.sets}</b></div><div class="stat"><small class="muted">${t('REPS','العدات')}</small><br><b>${x.reps}</b></div><div class="stat"><small class="muted">${t('REST','الراحة')}</small><br><b>${x.rest}</b></div><div class="stat"><small class="muted">RIR</small><br><b>${x.rir}</b></div></div><p><b>${t('Equipment:','المعدة:')}</b> ${ar()?equipment[x.eq][1]:equipment[x.eq][0]}</p><button class="btn">▶ ${t('VIDEO • COMING NEXT','الفيديو • قريباً')}</button>`;$('detail').classList.add('show')}function closeDetail(){$('detail').classList.remove('show')}function toggleLang(){lang=ar()?'en':'ar';localStorage.setItem('gymLanguage',lang);apply()}apply();</script></body></html>
