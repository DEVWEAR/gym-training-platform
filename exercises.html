<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV Exercises</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07080a;color:#fff}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 90% 0,#64101088,transparent 28%),linear-gradient(135deg,#060708,#111318);z-index:-1}.wrap{max-width:1300px;margin:auto;padding:20px}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:2px}.red{color:#ff3838}.muted{color:#969aa4;line-height:1.5}.btn,.chip{background:#111318;border:1px solid #ffffff18;color:#fff;padding:11px 14px;border-radius:999px;cursor:pointer}.btn.active,.chip.active{border-color:#ff3838;background:#351313}.hero{padding:35px 0 16px}.hero h1{font-size:clamp(38px,6vw,68px);margin:8px 0}.layout{display:grid;grid-template-columns:220px 1fr;gap:14px}.panel{background:#101216;border:1px solid #ffffff12;border-radius:22px;padding:16px}.cats{display:grid;gap:8px}.cat{width:100%;text-align:left;background:#0b0d10;border:1px solid #ffffff12;color:#fff;padding:14px;border-radius:14px;cursor:pointer}.cat.active{border-color:#ff3838;background:#311111}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:190px;background:#090a0d;border:1px solid #ffffff18;color:#fff;padding:13px;border-radius:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.section{margin:4px 0 28px;scroll-margin-top:15px}.sectionHead{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #ffffff12;padding:10px 2px;margin-bottom:12px}.sectionHead h2{margin:0}.sectionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.add{width:100%;margin-top:12px;background:#ffffff0a;border:1px solid #ffffff18;color:#fff;padding:10px;border-radius:11px;font-weight:800;cursor:pointer}.add.on{background:#17351f;border-color:#52e889;color:#75f19a}.planNotice{background:#15120b;border:1px solid #f0ad2c55;border-radius:14px;padding:13px;margin-bottom:14px}.exercise{position:relative;background:#0b0d10;border:1px solid #ffffff12;border-radius:18px;padding:13px;cursor:pointer}.exercise:hover{border-color:#ffffff35}.fav{position:absolute;right:22px;top:22px;z-index:2;background:#090a0dcc;border:1px solid #ffffff22;color:#fff;border-radius:50%;width:36px;height:36px;font-size:18px}.fav.on{color:#ff3838;border-color:#ff3838}.visual{height:185px;border-radius:14px;background:linear-gradient(145deg,#181b20,#0b0d10);display:grid;place-items:center;border:1px solid #ffffff0d;margin-bottom:13px;overflow:hidden}.model{width:92px;height:155px;position:relative}.head{width:30px;height:30px;border-radius:50%;background:#c79a78;position:absolute;left:31px;top:3px}.shirt{width:62px;height:70px;background:#15171b;border:2px solid #343840;border-radius:18px 18px 10px 10px;position:absolute;left:15px;top:31px}.arm{width:14px;height:70px;background:#c79a78;border-radius:10px;position:absolute;top:38px}.arm.l{left:4px;transform:rotate(8deg)}.arm.r{right:4px;transform:rotate(-8deg)}.shorts{width:58px;height:34px;background:#090a0c;border:2px solid #343840;position:absolute;left:17px;top:96px;border-radius:5px 5px 12px 12px}.leg{width:16px;height:45px;background:#c79a78;border-radius:9px;position:absolute;top:126px}.leg.l{left:23px}.leg.r{right:23px}.target{position:absolute;background:#ff3030;box-shadow:0 0 16px #ff3030aa;opacity:.9}.target.chest{width:42px;height:19px;left:25px;top:48px;border-radius:50%}.target.back{width:44px;height:35px;left:24px;top:47px;border-radius:14px}.target.shoulders{width:68px;height:12px;left:12px;top:42px;border-radius:50%}.target.arms{width:80px;height:12px;left:6px;top:63px;border-radius:50%}.target.legs{width:50px;height:37px;left:21px;top:117px;border-radius:12px}.target.core{width:30px;height:34px;left:31px;top:68px;border-radius:10px}.exercise h3{margin:6px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;background:#ffffff09;padding:6px 9px;border-radius:999px}.detail{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.detail.show{display:flex}.sheet{width:min(850px,100%);max-height:94vh;overflow:auto;background:#111318;border:1px solid #ffffff20;border-radius:24px;padding:22px}.demo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pose{min-height:250px;border-radius:16px;background:#090a0d;border:1px solid #ffffff12;display:grid;place-items:center;text-align:center;padding:15px}.pose.end .model{transform:translateY(-8px) scale(1.04)}.pose .model{transform:scale(1.12);margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:#090a0d;padding:12px;border-radius:13px;text-align:center}.cuebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.cue{background:#090a0d;border:1px solid #ffffff12;border-radius:14px;padding:14px}.cue b{display:block;margin-bottom:7px}.close{float:right;width:40px;height:40px;border:0;border-radius:50%;background:#ffffff0d;color:#fff;font-size:20px}.logger{margin-top:15px;border-top:1px solid #ffffff12;padding-top:15px}.setrow{display:grid;grid-template-columns:70px 1fr 1fr 55px;gap:8px;align-items:center;margin:7px 0}.setrow input{width:100%;background:#090a0d;border:1px solid #ffffff18;color:#fff;padding:10px;border-radius:10px}.check{accent-color:#ed2c2c;width:20px;height:20px}.save{width:100%;margin-top:12px;background:#ed2c2c;border:0;color:#fff;padding:14px;border-radius:13px;font-weight:800;cursor:pointer}.arabic{text-align:right}.arabic .cat{text-align:right}.arabic .close{float:left}.arabic .fav{right:auto;left:22px}@media(max-width:900px){.grid,.sectionGrid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.sectionGrid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.cats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.stats,.cuebox{grid-template-columns:1fr 1fr}.setrow{grid-template-columns:55px 1fr 1fr 40px}}</style></head><body><main class="wrap"><nav class="nav"><div class="brand"><span class="red">DEV</span> TRAINING</div><div><button class="btn" onclick="location.href='index.html'" id="home"></button> <button class="btn" id="lang" onclick="toggleLang()"></button></div></nav><section class="hero"><small class="red" id="eyebrow"></small><h1 id="title"></h1><p class="muted" id="intro"></p></section><div class="layout"><aside class="panel"><div class="cats" id="cats"></div></aside><section class="panel"><div class="toolbar"><input class="search" id="search" oninput="render()"><button class="chip active" onclick="eqPick(this,'all')">ALL</button><button class="chip" onclick="eqPick(this,'dumbbell')">DUMBBELL</button><button class="chip" onclick="eqPick(this,'barbell')">BARBELL</button><button class="chip" onclick="eqPick(this,'cable')">CABLE</button><button class="chip" onclick="eqPick(this,'machine')">MACHINE</button><button class="chip" id="favFilter" onclick="toggleFavFilter()">♡</button></div><div class="grid" id="grid"></div></section></div></main><div class="detail" id="detail"><div class="sheet"><button class="close" onclick="closeDetail()">×</button><div id="detailBody"></div></div></div><script src="exercise-library.js"></script><script src="plan-engine.js"></script><script>let params=new URLSearchParams(location.search),planMode=params.get('plan')==='1',planDay=params.get('day')||'',allowedCats=(params.get('cats')||'').split(',').filter(Boolean),lang=localStorage.getItem('gymLanguage')||'en',cat=allowedCats[0]||'chest',eq='all',favOnly=false,favs=JSON.parse(localStorage.getItem('devFavExercises')||'[]');const $=x=>document.getElementById(x),ar=()=>lang==='ar';let picked=JSON.parse(localStorage.getItem('devPlanExercises')||'{}');const equipment={dumbbell:['Dumbbell','دمبل'],barbell:['Barbell','بار'],cable:['Cable','كيبل'],machine:['Machine','جهاز'],bodyweight:['Bodyweight','وزن الجسم']};const cues={chest:['Keep shoulders back and chest stable.','ثبّت لوح الكتف للخلف وحافظ على الصدر ثابتاً.'],back:['Pull with the elbows and control the return.','اسحب بالكوع وتحكم بالرجوع بدون اندفاع.'],shoulders:['Keep the torso stable; do not swing the weight.','ثبّت الجذع ولا تستخدم الزخم لرفع الوزن.'],arms:['Keep the upper arm controlled and use full range.','ثبّت أعلى الذراع واستخدم مدى حركة مريح وكامل.'],legs:['Brace your core and keep knee tracking controlled.','ثبّت الكور وحافظ على مسار الركبة بشكل متحكم.'],core:['Brace before every rep and avoid rushing.','شد الكور قبل كل عدة ولا تستعجل الحركة.']};function t(a,b){return ar()?b:a}function model(c){return `<div class="model"><div class="head"></div><div class="shirt"></div><div class="arm l"></div><div class="arm r"></div><div class="shorts"></div><div class="leg l"></div><div class="leg r"></div><i class="target ${c}"></i></div>`}function apply(){document.documentElement.lang=lang;document.documentElement.dir=ar()?'rtl':'ltr';document.body.classList.toggle('arabic',ar());$('lang').textContent=ar()?'English':'العربية';$('home').textContent=t('← Home','الرئيسية ←');$('eyebrow').textContent=t('SMART EXERCISE LIBRARY','مكتبة التمارين الذكية');$('title').textContent=t('TRAIN WITH PRECISION.','تمرّن بدقة.');$('intro').textContent=planMode?t('Choose your own exercises. Sections stay on this page so you can mix the areas you want.','اختر تمارينك بنفسك. كل أجزاء العضلة موجودة في نفس الصفحة وتقدر تختار العدد والتوزيع اللي يناسبك.'):t('Find the right movement, see its target area, save favorites and log every working set.','اختر الحركة المناسبة، اعرف المنطقة المستهدفة، احفظ مفضلاتك وسجّل كل مجموعة تدريبية.');$('search').placeholder=t('Search exercises...','ابحث عن تمرين...');renderCats();render()}function renderCats(){$('cats').innerHTML=Object.entries(DEV_EXERCISE_CATEGORIES).filter(([k])=>!planMode||!allowedCats.length||allowedCats.includes(k)).map(([k,v])=>`<button class="cat ${k===cat?'active':''}" onclick="cat='${k}';renderCats();render()"><b>${ar()?v.ar:v.en}</b><br><small class="muted">${DEV_EXERCISES.filter(x=>x.cat===k).length} ${t('exercises','تمارين')}</small></button>`).join('')}function eqPick(el,v){eq=v;document.querySelectorAll('.toolbar .chip').forEach(x=>{if(x.id!=='favFilter')x.classList.remove('active')});el.classList.add('active');render()}function toggleFavFilter(){favOnly=!favOnly;$('favFilter').classList.toggle('active',favOnly);render()}function toggleFav(e,id){e.stopPropagation();favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('devFavExercises',JSON.stringify(favs));render()}function subName(catName,sub){let names={chest:{upper:['Upper Chest','الصدر العلوي'],mid:['Mid / General Chest','الصدر الأوسط / العام'],lower:['Lower Chest','الصدر السفلي']},back:{lats:['Lats','اللاتس'],upper:['Upper / Mid Back','أعلى / منتصف الظهر'],lower:['Lower Back','أسفل الظهر']},shoulders:{front:['Front Delts','الكتف الأمامي'],side:['Side Delts','الكتف الجانبي'],rear:['Rear Delts','الكتف الخلفي']},legs:{quads:['Quads','الفخذ الأمامي'],hamstrings:['Hamstrings','الفخذ الخلفي'],glutes:['Glutes','المؤخرة'],calves:['Calves','السمانة']},arms:{'biceps-short':['Biceps — Short Head','البايسبس — الرأس القصير'],'biceps-long':['Biceps — Long Head','البايسبس — الرأس الطويل'],brachialis:['Brachialis','البراكيالس'],'triceps-lateral':['Triceps — Lateral Head','الترايسبس — الرأس الجانبي'],'triceps-long':['Triceps — Long Head','الترايسبس — الرأس الطويل'],triceps:['Triceps — Compound','الترايسبس — مركب']},legs:{quads:['Quads','الفخذ الأمامي'],hamstrings:['Hamstrings','الفخذ الخلفي'],glutes:['Glutes','المؤخرة'],adductors:['Adductors','العضلات الداخلية'],calves:['Calves','السمانة']},core:{abs:['Abs','البطن'],obliques:['Obliques','الجوانب'],'lower-abs':['Lower Abs','أسفل البطن'],stability:['Core Stability','ثبات الكور']}};let v=(names[catName]||{})[sub];return v?(ar()?v[1]:v[0]):sub.replaceAll('-',' ')}
function togglePlanExercise(e,id){e.stopPropagation();let key=planDay||cat;picked[key]=picked[key]||[];let i=picked[key].indexOf(id);if(i>=0)picked[key].splice(i,1);else picked[key].push(id);localStorage.setItem('devPlanExercises',JSON.stringify(picked));render()}
function card(x){let chosen=(picked[planDay||cat]||[]).includes(x.id);return `<article class="exercise" onclick="openDetail('${x.id}')"><button class="fav ${favs.includes(x.id)?'on':''}" onclick="toggleFav(event,'${x.id}')">${favs.includes(x.id)?'♥':'♡'}</button><div class="visual">${model(x.cat)}</div><small class="red">${subName(x.cat,x.sub).toUpperCase()}</small><h3>${ar()?x.ar:x.en}</h3><div class="tags"><span class="tag">${ar()?equipment[x.eq][1]:equipment[x.eq][0]}</span><span class="tag">${x.sets} × ${x.reps}</span></div>${planMode?`<button class="add ${chosen?'on':''}" onclick="togglePlanExercise(event,'${x.id}')">${chosen?t('✓ ADDED','✓ تمت الإضافة'):t('+ ADD TO THIS DAY','+ أضف لهذا اليوم')}</button>`:''}</article>`}
function render(){let q=$('search').value.toLowerCase();let xs=DEV_EXERCISES.filter(x=>x.cat===cat&&(eq==='all'||x.eq===eq)&&(!favOnly||favs.includes(x.id))&&(!q||(x.en+' '+x.ar).toLowerCase().includes(q)));if(!xs.length){$('grid').innerHTML=`<p class="muted">${t('No exercises match this filter.','لا توجد تمارين مطابقة لهذا الاختيار.')}</p>`;return}if(planMode){let groups=[...new Set(xs.map(x=>x.sub))];$('grid').innerHTML=`<div style="grid-column:1/-1" class="planNotice"><b>${t('You choose the mix.','أنت تختار التوزيع.')}</b><br><span class="muted">${t('For example, choose two upper-chest exercises and three lower-chest exercises if that is how you want to build your chest day.','مثلاً تقدر تختار تمرينين صدر علوي وثلاثة صدر سفلي إذا هذا التوزيع اللي تبيه ليوم الصدر.')}</span></div>`+groups.map(g=>`<section class="section" style="grid-column:1/-1"><div class="sectionHead"><h2>${subName(cat,g)}</h2><small class="muted">${xs.filter(x=>x.sub===g).length} ${t('exercises','تمارين')}</small></div><div class="sectionGrid">${xs.filter(x=>x.sub===g).map(card).join('')}</div></section>`).join('')}else $('grid').innerHTML=xs.map(card).join('')}
function openDetail(id){let x=DEV_EXERCISES.find(e=>e.id===id),plan=JSON.parse(localStorage.getItem('gymPlan')||'{}'),p=DEV_PLAN_ENGINE.prescribe(x,plan.goal||'Muscle',plan.level||'Advanced'),last=JSON.parse(localStorage.getItem('devLast_'+id)||'{}'),cue=cues[x.cat];let rows=Array.from({length:p.sets},(_,i)=>`<div class="setrow"><b>${t('Set','مجموعة')} ${i+1}</b><input id="w${i}" type="number" step=".5" value="${last.weights?.[i]||''}" placeholder="${t('Weight kg','الوزن kg')}"><input id="r${i}" type="number" value="${last.reps?.[i]||''}" placeholder="${t('Reps','العدات')}"><input class="check" id="c${i}" type="checkbox"></div>`).join('');$('detailBody').innerHTML=`<small class="red">${x.sub.toUpperCase()}</small><h2>${ar()?x.ar:x.en}</h2><p class="muted">${ar()?p.goalNote.ar:p.goalNote.en}</p><div class="demo"><div class="pose">${model(x.cat)}<div><b>${t('START POSITION','وضعية البداية')}</b><p class="muted">${t('Set your position, brace and control the load.','ثبّت وضعيتك وشد جسمك وتحكم بالوزن قبل البداية.')}</p></div></div><div class="pose end">${model(x.cat)}<div><b>${t('END POSITION','وضعية النهاية')}</b><p class="muted">${t('Finish under control; do not force painful range.','أنه الحركة بتحكم ولا تجبر المفصل على مدى مؤلم.')}</p></div></div></div><div class="cuebox"><div class="cue"><b>🎯 ${t('Target','الاستهداف')}</b><span class="muted">${t('Red area shows the main muscle group emphasized by this movement.','المنطقة الحمراء توضح المجموعة العضلية الرئيسية المستهدفة.')}</span></div><div class="cue"><b>✓ ${t('Coach cue','ملاحظة الكوتش')}</b><span class="muted">${ar()?cue[1]:cue[0]}</span></div></div><div class="stats"><div class="stat"><small class="muted">${t('SETS','المجموعات')}</small><br><b>${p.sets}</b></div><div class="stat"><small class="muted">${t('REPS','العدات')}</small><br><b>${p.reps}</b></div><div class="stat"><small class="muted">${t('REST','الراحة')}</small><br><b>${p.rest}</b></div><div class="stat"><small class="muted">RIR</small><br><b>${p.rir}</b></div></div><p><b>${t('Equipment:','المعدة:')}</b> ${ar()?equipment[x.eq][1]:equipment[x.eq][0]}</p><button class="btn">▶ ${t('VIDEO • RESERVED','الفيديو • جاهز للإضافة')}</button><div class="logger"><h3>${t('Workout Log','سجل التمرين')}</h3>${rows}<button class="save" onclick="saveLog('${id}',${p.sets})">✓ ${t('SAVE WORKOUT','حفظ التمرين')}</button></div>`;$('detail').classList.add('show')}function saveLog(id,n){let weights=[],reps=[],done=[];for(let i=0;i<n;i++){weights.push($('w'+i).value);reps.push($('r'+i).value);done.push($('c'+i).checked)}localStorage.setItem('devLast_'+id,JSON.stringify({weights,reps,done,date:new Date().toISOString()}));alert(t('Workout saved. Next time your previous numbers will be ready.','تم حفظ التمرين. في المرة القادمة ستظهر أرقامك السابقة.'))}function closeDetail(){$('detail').classList.remove('show')}function toggleLang(){lang=ar()?'en':'ar';localStorage.setItem('gymLanguage',lang);apply()}apply();</script></body></html>
