function repSlug(x){return repAliases[x.id]||x.id}
function repRecord(x){if(!repCatalog||repUnavailable.has(x.id))return null;let r=repCatalog.get(repSlug(x))||null;if(!r)return null;let expected={chest:['chest'],back:['back'],shoulders:['shoulders'],arms:['upper_arms','lower_arms'],legs:['upper_legs','lower_legs'],core:['core']}[x.cat]||[];if(expected.length&&!expected.includes(r.body_part))return null;let eqMap={dumbbell:['dumbbell'],barbell:['barbell','ez_bar'],cable:['cable'],machine:['chest_press_machine','shoulder_press_machine','lat_pulldown_machine','leg_press','leg_extension','leg_curl','hack_squat','pec_deck','hip_abduction_machine','hip_adduction_machine','standing_calf_raise_machine','seated_calf_raise_machine','ab_crunch_machine','plate_loaded_lateral_raise_machine','preacher_curl_machine','bicep_curl_machine','tricep_extension_machine','back_extension_machine','hip_thrust_machine','assisted_pullup_machine','dip_machine','chest_fly_machine','smith_machine'],band:['resistance_band','loop_band'],plate:['plates'],bodyweight:['pull_up_bar','dip_station']};let allowed=eqMap[x.eq]||[];if(x.eq==='bodyweight'){if(r.is_bodyweight!==true&&r.equipment&&!allowed.includes(r.equipment))return null}else if(allowed.length&&(!r.equipment||!allowed.includes(r.equipment)))return null;return r}

function matchSummary(xs){if(!repCatalog)return '<div class="matchSummary"><span class="pendingTag">'+t('Image library unavailable — safe placeholders are being used.','مكتبة الصور غير متاحة حالياً — يتم استخدام بدائل آمنة.')+'</span></div>';let ok=xs.filter(x=>!repUnavailable.has(x.id)&&repRecord(x)).length,p=xs.length-ok;return '<div class="matchSummary"><b>'+ok+' '+t('verified visual matches','مطابقات صور موثوقة')+'</b> · <span class="pendingTag">'+p+' '+t('safe placeholders','بدائل آمنة')+'</span></div>'}
function model(c){return `<div class="model"><div class="head"></div><div class="shirt"></div><div class="arm l"></div><div class="arm r"></div><div class="shorts"></div><div class="leg l"></div><div class="leg r"></div><i class="target ${c}"></i></div>`}function apply(){document.documentElement.lang=lang;document.documentElement.dir=ar()?'rtl':'ltr';document.body.classList.toggle('arabic',ar());$('lang').textContent=ar()?'English':'العربية';$('home').textContent=t('← Home','الرئيسية ←');$('eyebrow').textContent=t('SMART EXERCISE LIBRARY','مكتبة التمارين الذكية');$('title').textContent=t('TRAIN WITH PRECISION.','تمرّن بدقة.');$('intro').textContent=planMode?t('Choose your own exercises for '+planLabel+'. Sections stay on this page so you can mix the areas you want.','اختر تمارينك بنفسك لحصة '+planLabel+'. كل أجزاء العضلة موجودة في نفس الصفحة وتقدر تختار العدد والتوزيع اللي يناسبك.'):t('Find the right movement, see its target area, save favorites and log every working set.','اختر الحركة المناسبة، اعرف المنطقة المستهدفة، احفظ مفضلاتك وسجّل كل مجموعة تدريبية.');$('search').placeholder=t('Search exercises...','ابحث عن تمرين...');renderCats();render()}function renderCats(){$('cats').innerHTML=Object.entries(DEV_EXERCISE_CATEGORIES).filter(([k])=>!planMode||!allowedCats.length||allowedCats.includes(k)).map(([k,v])=>`<button class="cat ${k===cat?'active':''}" onclick="cat='${k}';renderCats();render()"><b>${ar()?v.ar:v.en}</b><br><small class="muted">${DEV_EXERCISES.filter(x=>x.cat===k).length} ${t('exercises','تمارين')}</small></button>`).join('')}function eqPick(el,v){eq=v;document.querySelectorAll('.toolbar .chip').forEach(x=>{if(x.id!=='favFilter')x.classList.remove('active')});el.classList.add('active');render()}function toggleFavFilter(){favOnly=!favOnly;$('favFilter').classList.toggle('active',favOnly);render()}function toggleFav(e,id){e.stopPropagation();favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('devFavExercises',JSON.stringify(favs));render()}function subName(catName,sub){let names={chest:{upper:['Upper Chest','الصدر العلوي'],mid:['Mid / General Chest','الصدر الأوسط / العام'],lower:['Lower Chest','الصدر السفلي']},back:{lats:['Lats','اللاتس'],upper:['Upper / Mid Back','أعلى / منتصف الظهر'],lower:['Lower Back','أسفل الظهر']},shoulders:{front:['Front Delts','الكتف الأمامي'],side:['Side Delts','الكتف الجانبي'],rear:['Rear Delts','الكتف الخلفي']},arms:{'biceps-short':['Biceps — Short Head','البايسبس — الرأس القصير'],'biceps-long':['Biceps — Long Head','البايسبس — الرأس الطويل'],brachialis:['Brachialis','البراكيالس'],'triceps-lateral':['Triceps — Lateral Head','الترايسبس — الرأس الجانبي'],'triceps-long':['Triceps — Long Head','الترايسبس — الرأس الطويل'],triceps:['Triceps — Compound','الترايسبس — مركب']},legs:{quads:['Quads','الفخذ الأمامي'],hamstrings:['Hamstrings','الفخذ الخلفي'],glutes:['Glutes','المؤخرة'],adductors:['Adductors','العضلات الداخلية'],calves:['Calves','السمانة']},core:{abs:['Abs','البطن'],obliques:['Obliques','الجوانب'],'lower-abs':['Lower Abs','أسفل البطن'],stability:['Core Stability','ثبات الكور']}};let v=(names[catName]||{})[sub];return v?(ar()?v[1]:v[0]):sub.replaceAll('-',' ')}
function togglePlanExercise(e,id){e.stopPropagation();let key=planDay||cat;picked[key]=picked[key]||[];let i=picked[key].indexOf(id);if(i>=0)picked[key].splice(i,1);else picked[key].push(id);render()}
function selectedCount(){return (picked[planDay||cat]||[]).length}
function renderPlanBar(){let el=$('planBar');if(!el)return;if(!planMode){el.innerHTML='';return}let n=selectedCount();el.innerHTML='<div><b>'+planLabel+' · '+n+' '+t('selected','تم اختيارها')+'</b><br><small class="muted">'+t('You can return later and change these exercises.','تقدر ترجع وتعدل اختياراتك بأي وقت.')+'</small></div><button '+(!n?'disabled':'')+' onclick="savePlanDay()">'+t('SAVE DAY ✓','حفظ اليوم ✓')+'</button>'}
function savePlanDay(){if(!selectedCount())return;let key=planDay||cat,after=JSON.stringify(picked[key]||[]);localStorage.setItem('devPlanExercises',JSON.stringify(picked));if(planOriginal!==after)localStorage.removeItem('devActiveWorkout_'+key);location.href='index.html#plan'}
function card(x){let chosen=(picked[planDay||cat]||[]).includes(x.id);return `<article class="exercise" onclick="openDetail('${x.id}')"><button class="fav ${favs.includes(x.id)?'on':''}" onclick="toggleFav(event,'${x.id}')">${favs.includes(x.id)?'♥':'♡'}</button><div class="visual">${exerciseVisual(x)}</div><h3 class="exerciseName">${ar()?x.ar:x.en}</h3><div class="tags"><span class="tag">${ar()?equipment[x.eq][1]:equipment[x.eq][0]}</span><span class="tag">${x.sets} × ${x.reps}</span>${repStatus(x)}</div>${planMode?`<button class="add ${chosen?'on':''}" onclick="togglePlanExercise(event,'${x.id}')">${chosen?t('✓ ADDED','✓ تمت الإضافة'):t('+ ADD TO THIS DAY','+ أضف لهذا اليوم')}</button>`:''}</article>`}
function sectionGuide(){let guides={chest:['Pick any mix across upper, mid/general and lower chest.','اختر التوزيع اللي يناسبك بين الصدر العلوي والأوسط/العام والسفلي.'],back:['Build your mix across lats, upper/mid back and lower back.','وزّع تمارينك بين اللاتس وأعلى/منتصف الظهر وأسفل الظهر.'],shoulders:['Choose between front, side and rear delts based on your plan.','اختر بين الكتف الأمامي والجانبي والخلفي حسب خطتك.'],arms:['Mix biceps, brachialis and triceps movements as you prefer.','وزّع اختياراتك بين البايسبس والبراكيالس والترايسبس مثل ما تفضل.'],legs:['Choose from quads, hamstrings, glutes, adductors and calves.','اختر من الفخذ الأمامي والخلفي والمؤخرة والعضلات الداخلية والسمانة.'],core:['Mix abs, obliques, lower abs and core-stability work.','اختر بين البطن والجوانب وأسفل البطن وتمارين ثبات الكور.']};return (guides[cat]||guides.chest)[ar()?1:0]}
function jumpSection(id){let el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function render(){let q=$('search').value.toLowerCase();let xs=DEV_EXERCISES.filter(x=>x.cat===cat&&(eq==='all'||x.eq===eq)&&(!favOnly||favs.includes(x.id))&&(!q||(x.en+' '+x.ar).toLowerCase().includes(q)));if(!xs.length){$('grid').innerHTML=`<p class="muted">${t('No exercises match this filter.','لا توجد تمارين مطابقة لهذا الاختيار.')}</p>`;renderPlanBar();return}if(planMode){let groups=[...new Set(xs.map(x=>x.sub))];let nav=`<div class="sectionNav" style="grid-column:1/-1">${groups.map((g,i)=>`<button class="chip ${i===0?'active':''}" onclick="jumpSection('sec-${cat}-${g}')">${subName(cat,g)}</button>`).join('')}</div>`;$('grid').innerHTML=matchSummary(xs)+`<div style="grid-column:1/-1" class="planNotice"><b>${t('You choose the mix.','أنت تختار التوزيع.')}</b><br><span class="muted">${sectionGuide()}</span></div>`+nav+groups.map(g=>`<section id="sec-${cat}-${g}" class="section" style="grid-column:1/-1"><div class="sectionHead"><h2>${subName(cat,g)}</h2><small class="muted">${xs.filter(x=>x.sub===g).length} ${t('exercises','تمارين')}</small></div><div class="sectionGrid">${xs.filter(x=>x.sub===g).map(card).join('')}</div></section>`).join('')}else $('grid').innerHTML=matchSummary(xs)+xs.map(card).join('');renderPlanBar()}
function openDetail(id){let x=DEV_EXERCISES.find(e=>e.id===id),plan=JSON.parse(localStorage.getItem('gymPlan')||'{}'),p=DEV_PLAN_ENGINE.prescribe(x,plan.goal||'Muscle',plan.level||'Advanced'),last=JSON.parse(localStorage.getItem('devLast_'+id)||'{}'),cue=cues[x.cat];let rows=Array.from({length:p.sets},(_,i)=>`<div class="setrow"><b>${t('Set','مجموعة')} ${i+1}</b><input id="w${i}" type="number" step=".5" value="${last.weights?.[i]||''}" placeholder="${t('Weight kg','الوزن kg')}"><input id="r${i}" type="number" value="${last.reps?.[i]||''}" placeholder="${t('Reps','العدات')}"><input class="check" id="c${i}" type="checkbox"></div>`).join('');$('detailBody').innerHTML=`<small class="red">${x.sub.toUpperCase()}</small><h2>${ar()?x.ar:x.en}</h2><p class="muted">${ar()?p.goalNote.ar:p.goalNote.en}</p><div class="demo"><div class="pose">${poseVisual(x,'start')}<div><b>${t('START POSITION','وضعية البداية')}</b><p class="muted">${t('Set your position, brace and control the load.','ثبّت وضعيتك وشد جسمك وتحكم بالوزن قبل البداية.')}</p></div></div><div class="pose end">${poseVisual(x,'peak')}<div><b>${t('END POSITION','وضعية النهاية')}</b><p class="muted">${t('Finish under control; do not force painful range.','أنه الحركة بتحكم ولا تجبر المفصل على مدى مؤلم.')}</p></div></div></div><div class="cuebox"><div class="cue"><b>🎯 ${t('Target','الاستهداف')}</b><span class="muted">${t('Red area shows the main muscle group emphasized by this movement.','المنطقة الحمراء توضح المجموعة العضلية الرئيسية المستهدفة.')}</span></div><div class="cue"><b>✓ ${t('Coach cue','ملاحظة الكوتش')}</b><span class="muted">${ar()?cue[1]:cue[0]}</span></div></div><div class="stats"><div class="stat"><small class="muted">${t('SETS','المجموعات')}</small><br><b>${p.sets}</b></div><div class="stat"><small class="muted">${t('REPS','العدات')}</small><br><b>${p.reps}</b></div><div class="stat"><small class="muted">${t('REST','الراحة')}</small><br><b>${p.rest}</b></div><div class="stat"><small class="muted">RIR</small><br><b>${p.rir}</b></div></div><p><b>${t('Equipment:','المعدة:')}</b> ${ar()?equipment[x.eq][1]:equipment[x.eq][0]}</p><button class="btn">▶ ${t('VIDEO • RESERVED','الفيديو • جاهز للإضافة')}</button><div class="logger"><h3>${t('Workout Log','سجل التمرين')}</h3>${rows}<button class="save" onclick="saveLog('${id}',${p.sets})">✓ ${t('SAVE WORKOUT','حفظ التمرين')}</button></div>`;$('detail').classList.add('show')}function saveLog(id,n){let weights=[],reps=[],done=[];for(let i=0;i<n;i++){weights.push($('w'+i).value);reps.push($('r'+i).value);done.push($('c'+i).checked)}localStorage.setItem('devLast_'+id,JSON.stringify({weights,reps,done,date:new Date().toISOString()}));alert(t('Workout saved. Next time your previous numbers will be ready.','تم حفظ التمرين. في المرة القادمة ستظهر أرقامك السابقة.'))}function closeDetail(){$('detail').classList.remove('show')}function toggleLang(){lang=ar()?'en':'ar';localStorage.setItem('gymLanguage',lang);apply()}apply();</script></body></html>
