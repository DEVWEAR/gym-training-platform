*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#191919;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.hero{height:345px;position:relative;background:linear-gradient(180deg,#0007,#000b),url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1400&q=85') center 43%/cover;color:white;overflow:hidden}.hero:after{content:"";position:absolute;bottom:-1px;left:0;width:100%;height:70px;background:#fff;clip-path:polygon(0 100%,100% 35%,100% 100%)}.top{display:flex;align-items:center;justify-content:space-between;padding:42px 24px 0;position:relative;z-index:1}.iconbtn{border:0;background:transparent;color:white;font-size:34px;line-height:1}.menu{color:#ffb900;font-size:35px}.heroTitle{font-size:23px;font-weight:900;text-align:center;margin:25px 0 12px}.searchWrap{position:relative;z-index:2;margin:42px 24px 0}.searchWrap input{width:100%;height:103px;border:0;border-radius:8px;background:#fff;color:#222;box-shadow:0 13px 22px #0005;padding:0 65px 0 20px;font-size:21px;outline:none;text-align:right}.searchWrap input:focus{box-shadow:0 0 0 3px #ffb900,0 13px 22px #0005}.searchIcon{position:absolute;right:23px;top:35px;color:#ffb900;font-size:29px}.content{max-width:1100px;margin:0 auto;padding:22px 13px 130px}.filters{display:flex;gap:11px;overflow-x:auto;padding:10px 0 20px;scrollbar-width:none;white-space:nowrap}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid #ededed;background:#fff;color:#969696;border-radius:999px;padding:12px 19px;font-weight:750;font-size:16px;flex:none}.chip.active{background:#ffb900;color:#191919;border-color:#ffb900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px;margin-top:22px}.coachCard{position:relative;aspect-ratio:.83;overflow:hidden;border-radius:12px;background:#202225;box-shadow:0 2px 7px #0002;text-align:right;border:0;padding:0;color:white}.coachCard img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.coachCard:hover img{transform:scale(1.035)}.coachCard:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#000d)}.cardInfo{position:absolute;z-index:1;bottom:0;right:0;left:0;padding:13px}.cardName{font-size:clamp(16px,2.8vw,22px);font-weight:900;line-height:1.3;margin-bottom:10px}.cardMeta{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:12px;color:#ddd}.stars{color:#ffba00;letter-spacing:1px;font-size:17px;direction:ltr}.empty{padding:45px;text-align:center;color:#777}.demo{font-size:12px;color:#777;text-align:center;margin:12px 0}.bottomNav{position:fixed;z-index:20;bottom:0;left:0;right:0;height:88px;background:#fff;border-top:4px solid #ffb900;display:flex;align-items:center;justify-content:space-around;box-shadow:0 -4px 18px #0001}.navLink{color:#8e9cac;font-size:29px;min-width:54px;text-align:center}.navLink.active{color:#ffb900}.navLink.home{background:#fff;border:3px solid #ffb900;border-radius:15px;transform:translateY(-23px);width:66px;height:66px;display:grid;place-items:center;font-size:31px}.drawer{display:none;position:fixed;z-index:30;inset:0;background:#0009}.drawer.show{display:block}.drawerPanel{background:#111317;color:white;width:min(330px,85vw);height:100%;padding:30px 22px;box-shadow:0 0 35px #0005}.drawerPanel a{display:block;padding:17px;border-bottom:1px solid #333}.close{background:none;color:white;border:0;font-size:28px}.modal{display:none;position:fixed;inset:0;z-index:40;background:#000b;padding:18px;align-items:center;justify-content:center}.modal.show{display:flex}.detail{background:#fff;border-radius:22px;width:min(450px,100%);max-height:90vh;overflow:auto;color:#222}.detail img{width:100%;height:240px;object-fit:cover}.detailBody{padding:20px}.detail .close{color:#333;float:left}.cta{background:#ffb900;border:0;border-radius:12px;padding:14px 18px;font-weight:900;display:inline-block;margin-top:12px}.detailNote{color:#777;font-size:13px}.sectionHeader{display:flex;justify-content:space-between;align-items:center;margin:15px 0 0}.sectionHeader h2{font-size:18px;margin:0}.apply{border:1px solid #ddd;background:white;border-radius:12px;padding:10px 13px;font-weight:750}.applicationLink{display:block;margin-top:35px;text-align:center;color:#777;font-size:14px}.applicationLink a{color:#b98200;text-decoration:underline}@media(min-width:750px){.hero{height:385px}.searchWrap{max-width:850px;margin:60px auto 0}.content{padding:25px 30px 130px}.grid{grid-template-columns:repeat(3,1fr)}.coachCard{aspect-ratio:.82}.bottomNav{max-width:800px;left:50%;transform:translateX(-50%);border-radius:20px 20px 0 0}}@media(max-width:380px){.chip{font-size:14px;padding:10px 14px}.grid{gap:13px 10px}.cardInfo{padding:9px}.cardMeta{font-size:10px}.stars{font-size:12px}}
</style></head><body>
<section class="hero"><div class="top"><button class="iconbtn menu" id="openMenu" aria-label="القائمة">☰</button><a href="index.html" style="font-weight:900;font-size:20px">DEV TRAINING</a><button class="iconbtn" id="bell" aria-label="الإشعارات">♧</button></div><div class="searchWrap"><span class="searchIcon">⌕</span><input id="search" placeholder="اسم المدرب" aria-label="ابحث عن مدرب" autocomplete="off"></div></section>
<main class="content"><div class="filters" id="filters" aria-label="تخصصات المدربين"></div><div class="sectionHeader"><h2>اكتشف المدربين</h2><button class="apply" id="applyBtn">انضم كمدرب +</button></div><p class="demo">الصور والأسماء والتقييمات أدناه أمثلة تجريبية وليست ملفات مدربين حقيقيين.</p><div class="grid" id="cards"></div><p class="empty" id="empty" hidden>ما حصلنا مدربين يطابقون البحث.</p><div class="applicationLink">هل أنت مدرب؟ <a href="trainers-apply.html">تعرّف على شروط الانضمام</a></div></main>
<nav class="bottomNav" aria-label="التنقل"><a class="navLink" href="index.html" aria-label="الحساب">♟</a><a class="navLink active" href="trainers.html" aria-label="المدربين">♟</a><a class="navLink home" href="index.html" aria-label="الرئيسية">⌂</a><a class="navLink" href="index.html" aria-label="استكشاف">◈</a><a class="navLink" href="index.html" aria-label="الأقسام">▦</a></nav>
<div class="drawer" id="drawer"><div class="drawerPanel"><button class="close" id="closeMenu" aria-label="إغلاق">✕</button><h2>DEV TRAINING</h2><a href="index.html">الرئيسية</a><a href="trainers.html">المدربين</a><a href="trainers-apply.html">انضم كمدرب</a></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="بيانات المدرب"><div class="detail" id="detail"></div></div>
<script>
const coaches=[
{name:"عبدالله الربيعة",years:22,category:"كمال أجسام",rating:"★★★★★",image:"https://images.unsplash.com/photo-1534367610401-9f5ed68180aa?w=700&q=85",bio:"مدرب تجريبي متخصص في كمال الأجسام وبناء العضلات."},
{name:"عبدالله العوضي",years:5,category:"كروسفت",rating:"★★★★★",image:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=700&q=85",bio:"مدرب تجريبي يهتم بتطوير اللياقة والقوة."},
{name:"دكتور محمود شوقي",years:12,category:"باورلفتنق",rating:"★★★★★",image:"https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=700&q=85",bio:"ملف تجريبي لتدريبات القوة. اللقب المعروض تجريبي وليس مؤهلاً موثقاً."},
{name:"أحمد منصور",years:8,category:"كمال أجسام",rating:"★★★★★",image:"https://images.unsplash.com/photo-1567013127542-490d757e51fc?w=700&q=85",bio:"مدرب تجريبي لبناء العضلات وتحسين الأداء."},
{name:"سالم راشد",years:6,category:"تغذية",rating:"★★★★★",image:"https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=700&q=85",bio:"ملف تجريبي للتوعية بالتغذية الرياضية."},
{name:"عمر خالد",years:9,category:"رفع أثقال",rating:"★★★★★",image:"https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=700&q=85",bio:"مدرب تجريبي لتقنيات رفع الأثقال."}
];
const categories=["الكل","كمال أجسام","كروسفت","باورلفتنق","تغذية","رفع أثقال"];let selected="الكل";
const filters=document.getElementById("filters"),cards=document.getElementById("cards"),search=document.getElementById("search");
function render(){filters.innerHTML="";categories.forEach(cat=>{const b=document.createElement("button");b.className="chip"+(selected===cat?" active":"");b.textContent=cat;b.onclick=()=>{selected=cat;render()};filters.append(b)});cards.innerHTML="";const term=search.value.trim().toLowerCase();const found=coaches.filter(c=>(selected==="الكل"||c.category===selected)&&(c.name+" "+c.category).toLowerCase().includes(term));document.getElementById("empty").hidden=found.length>0;found.forEach(c=>{const b=document.createElement("button");b.className="coachCard";b.setAttribute("aria-label","عرض ملف "+c.name);const img=document.createElement("img");img.src=c.image;img.alt="صورة توضيحية تجريبية";img.loading="lazy";img.onerror=()=>{img.style.display="none";b.style.background="linear-gradient(135deg,#292929,#666)"};const info=document.createElement("div");info.className="cardInfo";info.innerHTML='<div class="cardName"></div><div class="cardMeta"><span class="experience"></span><span class="stars">★★★★★</span></div>';info.querySelector(".cardName").textContent=c.name;info.querySelector(".experience").textContent=c.years+" سنوات";b.append(img,info);b.onclick=()=>showCoach(c);cards.append(b)})}
function showCoach(c){const d=document.getElementById("detail");d.innerHTML="";const img=document.createElement("img");img.src=c.image;img.alt="صورة تجريبية";const body=document.createElement("div");body.className="detailBody";const close=document.createElement("button");close.className="close";close.textContent="✕";close.onclick=closeModal;const title=document.createElement("h2");title.textContent=c.name;const p=document.createElement("p");p.textContent=c.category+" · "+c.years+" سنوات خبرة (تجريبي)";const desc=document.createElement("p");desc.textContent=c.bio;const note=document.createElement("p");note.className="detailNote";note.textContent="هذا ملف تجريبي للعرض فقط، ولا يمكن حجز خدمات هذا المدرب حالياً.";body.append(close,title,p,desc,note);d.append(img,body);document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}search.addEventListener("input",render);document.getElementById("openMenu").onclick=()=>document.getElementById("drawer").classList.add("show");document.getElementById("closeMenu").onclick=()=>document.getElementById("drawer").classList.remove("show");document.getElementById("drawer").onclick=e=>{if(e.target.id==="drawer")e.target.classList.remove("show")};document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});document.getElementById("applyBtn").onclick=()=>location.href="trainers-apply.html";document.getElementById("bell").onclick=()=>alert("الإشعارات غير مفعّلة في النسخة التجريبية.");render();
</script></body></html>
