<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV Progress</title><style>*{box-sizing:border-box}body{margin:0;background:#07080a;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:1px solid #ffffff20;background:#111318;color:#fff;padding:11px 14px;border-radius:12px}.red{color:#ff3b3b}.muted{color:#969aa4;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat,.card{background:#101216;border:1px solid #ffffff12;border-radius:18px;padding:16px}.stat strong{font-size:28px;display:block;margin-top:6px}.session{padding:13px 0;border-bottom:1px solid #ffffff10}.best{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.prBadge{display:inline-block;margin-top:6px;color:#75f19a;font-size:12px;font-weight:800}.bestItem{background:#0b0d10;border:1px solid #ffffff0d;border-radius:13px;padding:12px}.bestItem strong{display:block;margin-bottom:4px}.delta{margin-top:5px;font-size:12px}.up{color:#75f19a}.same{color:#aeb3bd}.tag{display:inline-block;color:#75f19a;background:#17351f;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800}.empty{text-align:center;padding:35px 12px}@media(max-width:560px){.stats,.best{grid-template-columns:1fr}}/* Visual Upgrade */

</style><style>body{background:#0d1519;color:#eef5f7;padding-bottom:110px}body:before{background:radial-gradient(circle at 82% 3%,#78e7ff25,transparent 28%),radial-gradient(circle at 8% 28%,#b7ff6815,transparent 25%),linear-gradient(155deg,#0d1519,#142127 50%,#0b1115)}.red{color:#78e7ff}.top{background:#132027e8}.stat,.card{background:linear-gradient(145deg,#19262d,#121b20)}.stat:before{background:linear-gradient(90deg,#78e7ff,#b7ff68)}.tag,.prBadge,.up{color:#b7ff68}.devAppNav{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:40;width:min(680px,calc(100% - 16px));display:grid;grid-template-columns:repeat(4,1fr);align-items:end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border:1px solid #fff;border-radius:22px;background:#f3f6f5f2;backdrop-filter:blur(20px);box-shadow:0 18px 55px #0008;direction:rtl}.devNavItem{border:0;background:transparent;color:#66747a;min-height:52px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.devNavIcon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.devNavItem.active{color:#0e181c;background:#dce7e8}.devNavItem.active .devNavIcon{color:#0b9fbd}.devNavCenter{transform:translateY(-13px);color:#0e181c}.devNavCenter .devNavIcon{width:47px;height:47px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#78e7ff,#b7ff68);color:#0c171b;box-shadow:0 10px 25px #78e7ff55}.devNavCenter.active{background:transparent}</style><style>.devNavItem>span:last-child:not(.devNavIcon){display:none!important}</style><style id="devFixedNavDirection">.devAppNav{direction:rtl!important}.devAppNav .devNavItem{direction:ltr!important}</style><link rel="stylesheet" href="dev-performance-theme.css">
</head><body><main class="wrap"><div class="top"><b><span class="red">DEV</span> <span id="title"></span></b></div><div id="app"></div></main><script src="exercise-library.js"></script><script>let lang=localStorage.getItem('gymLanguage')||'en',ar=()=>lang==='ar',t=(a,b)=>ar()?b:a,raw=JSON.parse(localStorage.getItem('devWorkoutHistory')||'[]'),h=raw.filter(s=>s?.finished&&(s.exercises||[]).some(e=>(e.done||[]).some(Boolean))).sort((a,b)=>new Date(b.end||b.start)-new Date(a.end||a.start));document.documentElement.dir=ar()?'rtl':'ltr';title.textContent=t('PROGRESS','التقدم');function date(v){return new Date(v).toLocaleDateString(ar()?'ar-AE':'en-GB',{day:'numeric',month:'short',year:'numeric'})}function sets(s){return(s.exercises||[]).reduce((a,e)=>a+(e.done||[]).filter(Boolean).length,0)}function prText(s){let prs=s.prs||[],n=prs.length;if(!n)return'';let loads=prs.filter(p=>!p.type||p.type==='load').length,reps=prs.filter(p=>p.type==='reps').length,label=loads&&reps?t('new PRs','أرقام قياسية جديدة'):reps?t(reps===1?'rep PR':'rep PRs',reps===1?'رقم عدات جديد':'أرقام عدات جديدة'):t(loads===1?'load PR':'load PRs',loads===1?'رقم وزن جديد':'أرقام وزن جديدة');return'<span class="prBadge">🏆 '+n+' '+label+'</span>'}function dur(s){if(!s.end||!s.start)return'—';let ms=new Date(s.end)-new Date(s.start);if(!Number.isFinite(ms)||ms<0)return'—';return Math.max(1,Math.round(ms/60000))+' '+t('min','دقيقة')}function name(id){let e=(window.DEV_EXERCISES||[]).find(x=>x.id===id);return e?(ar()?e.ar:e.en):id}function completed(e,i){return !Array.isArray(e.done)||e.done[i]===true}function trend(id){let rows=[];[...h].reverse().forEach(s=>(s.exercises||[]).filter(e=>e.id===id).forEach(e=>{let vals=(e.weights||[]).map((w,i)=>({w:Number(w),r:Number((e.reps||[])[i]),ok:completed(e,i)})).filter(v=>v.ok&&v.w>0&&v.r>0);if(vals.length){let top=vals.sort((a,b)=>b.w-a.w||b.r-a.r)[0];rows.push(top)}}));if(rows.length<2)return'';let a=rows[rows.length-2],b=rows[rows.length-1];if(b.w>a.w)return'<div class="delta up">↑ +'+(b.w-a.w).toFixed(1).replace('.0','')+' kg '+t('since last time','من آخر مرة')+'</div>';if(b.w===a.w&&b.r>a.r)return'<div class="delta up">↑ +'+(b.r-a.r)+' '+t('reps since last time','عدات من آخر مرة')+'</div>';return'<div class="delta same">'+t('Keep building from your last result','استمر بالبناء على آخر نتيجة')+'</div>'}function bests(){let m={};[...h].reverse().forEach(s=>(s.exercises||[]).forEach(e=>{let x=(window.DEV_EXERCISES||[]).find(z=>z.id===e.id),bodyweight=x?.eq==='bodyweight';(e.reps||[]).forEach((rv,i)=>{let r=Number(rv),w=Number((e.weights||[])[i]);if(!completed(e,i)||r<=0)return;if(bodyweight){if(!m[e.id]||r>m[e.id].r)m[e.id]={r,date:s.end||s.start,type:'reps'}}else if(w>0&&(!m[e.id]||w>m[e.id].w||(w===m[e.id].w&&r>m[e.id].r)))m[e.id]={w,r,date:s.end||s.start,type:'load'}})}));return Object.entries(m).sort((a,b)=>new Date(b[1].date)-new Date(a[1].date)).slice(0,6)}let best=bests(),week=h.filter(s=>{let tm=new Date(s.end||s.start).getTime(),age=Date.now()-tm;return Number.isFinite(tm)&&age>=0&&age<604800000}).length,total=h.reduce((a,s)=>a+sets(s),0),html='<div class="stats"><div class="stat"><span class="muted">'+t('Workouts','الحصص')+'</span><strong>'+h.length+'</strong></div><div class="stat"><span class="muted">'+t('Last 7 days','آخر 7 أيام')+'</span><strong>'+week+'</strong></div><div class="stat"><span class="muted">'+t('Completed sets','المجموعات المكتملة')+'</span><strong>'+total+'</strong></div></div><div class="card"><h2>'+t('Heaviest Completed Sets','أثقل مجموعات مكتملة')+'</h2>'+(best.length?'<div class="best">'+best.map(([id,b])=>'<div class="bestItem"><span class="tag">'+(b.type==='reps'?t('REP BEST','أفضل عدات'):t('LOAD BEST','أفضل وزن'))+'</span><strong>'+name(id)+'</strong><div class="muted">'+(b.type==='reps'?b.r+' '+t('reps','عدات'):b.w+' kg × '+b.r+' '+t('reps','عدات')+trend(id))+'</div></div>').join('')+'</div>':'<p class="muted">'+t('Your best numbers will appear after you complete workouts.','أثقل مجموعات مكتملة بتظهر بعد ما تكمل حصصك.')+'</p>')+'</div><div class="card"><h2>'+t('Workout History','سجل التمارين')+'</h2>';html+=h.length?h.slice(0,20).map(s=>'<div class="session"><b>'+(s.label||t('Workout','تمرين'))+'</b><div class="muted">'+date(s.end||s.start)+' · '+dur(s)+' · '+sets(s)+' '+t('sets','مجموعات')+'</div>'+prText(s)+'</div>').join(''):'<div class="empty"><b>'+t('Your progress starts with your first workout.','تقدمك يبدأ من أول حصة.')+'</b><p class="muted">'+t('Finish a workout and it will appear here automatically.','أكمل أول تمرين وبيظهر هني تلقائياً.')+'</p></div>';app.innerHTML=html+'</div>';</script><nav class="devAppNav" aria-label="DEV app navigation"><button aria-label="المدربين" class="devNavItem" onclick="location.href='index.html?tab=coaches.html'"><span class="devNavIcon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"/><path d="M4 7h3M17 7h3"/></svg></span><span data-en="Coaches" data-ar="المدربين"></span></button><button aria-label="تقدمي" class="devNavItem active" onclick="location.href='index.html?tab=progress.html'"><span class="devNavIcon"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg></span><span data-en="Progress" data-ar="تقدمي"></span></button><button aria-label="الرئيسية" class="devNavItem devNavCenter" onclick="location.href='index.html?tab=index.html'"><span class="devNavIcon"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg></span><span data-en="Home" data-ar="الرئيسية"></span></button><button aria-label="التمارين" class="devNavItem" onclick="location.href='index.html?tab=training.html'"><span class="devNavIcon"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg></span><span data-en="Training" data-ar="التمارين"></span></button></nav></body></html>
