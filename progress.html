<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV Progress</title><style>*{box-sizing:border-box}body{margin:0;background:#07080a;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:1px solid #ffffff20;background:#111318;color:#fff;padding:11px 14px;border-radius:12px}.red{color:#ff3b3b}.muted{color:#969aa4;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat,.card{background:#101216;border:1px solid #ffffff12;border-radius:18px;padding:16px}.stat strong{font-size:28px;display:block;margin-top:6px}.session{padding:13px 0;border-bottom:1px solid #ffffff10}.best{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.bestItem{background:#0b0d10;border:1px solid #ffffff0d;border-radius:13px;padding:12px}.bestItem strong{display:block;margin-bottom:4px}.delta{margin-top:5px;font-size:12px}.up{color:#75f19a}.same{color:#aeb3bd}.tag{display:inline-block;color:#75f19a;background:#17351f;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800}.empty{text-align:center;padding:35px 12px}@media(max-width:560px){.stats,.best{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><b><span class="red">DEV</span> <span id="title"></span></b><button class="btn" onclick="location.href='index.html#plan'" id="back"></button></div><div id="app"></div></main><script src="exercise-library.js"></script><script>let lang=localStorage.getItem('gymLanguage')||'en',ar=()=>lang==='ar',t=(a,b)=>ar()?b:a,h=JSON.parse(localStorage.getItem('devWorkoutHistory')||'[]');document.documentElement.dir=ar()?'rtl':'ltr';title.textContent=t('PROGRESS','التقدم');back.textContent=t('Back','رجوع');function date(v){return new Date(v).toLocaleDateString(ar()?'ar-AE':'en-GB',{day:'numeric',month:'short',year:'numeric'})}function sets(s){return(s.exercises||[]).reduce((a,e)=>a+(e.done||[]).filter(Boolean).length,0)}function dur(s){if(!s.end)return'—';return Math.max(1,Math.round((new Date(s.end)-new Date(s.start))/60000))+' '+t('min','دقيقة')}function name(id){let e=(window.DEV_EXERCISES||[]).find(x=>x.id===id);return e?(ar()?e.ar:e.en):id}function trend(id){let rows=[];[...h].reverse().forEach(s=>(s.exercises||[]).filter(e=>e.id===id).forEach(e=>{let vals=(e.weights||[]).map((w,i)=>({w:Number(w),r:Number((e.reps||[])[i])})).filter(v=>v.w>0&&v.r>0);if(vals.length){let top=vals.sort((a,b)=>b.w-a.w||b.r-a.r)[0];rows.push(top)}}));if(rows.length<2)return'';let a=rows[rows.length-2],b=rows[rows.length-1];if(b.w>a.w)return'<div class="delta up">↑ +'+(b.w-a.w).toFixed(1).replace('.0','')+' kg '+t('since last time','من آخر مرة')+'</div>';if(b.w===a.w&&b.r>a.r)return'<div class="delta up">↑ +'+(b.r-a.r)+' '+t('reps since last time','عدات من آخر مرة')+'</div>';return'<div class="delta same">'+t('Keep building from your last result','استمر بالبناء على آخر نتيجة')+'</div>'}function bests(){let m={};[...h].reverse().forEach(s=>(s.exercises||[]).forEach(e=>{(e.weights||[]).forEach((w,i)=>{w=Number(w);let r=Number((e.reps||[])[i]);if(w>0&&r>0&&(!m[e.id]||w>m[e.id].w||(w===m[e.id].w&&r>m[e.id].r)))m[e.id]={w,r,date:s.end||s.start}})}));return Object.entries(m).sort((a,b)=>b[1].w-a[1].w).slice(0,6)}let best=bests(),week=h.filter(s=>Date.now()-new Date(s.end||s.start).getTime()<604800000).length,total=h.reduce((a,s)=>a+sets(s),0),html='<div class="stats"><div class="stat"><span class="muted">'+t('Workouts','الحصص')+'</span><strong>'+h.length+'</strong></div><div class="stat"><span class="muted">'+t('Last 7 days','آخر 7 أيام')+'</span><strong>'+week+'</strong></div><div class="stat"><span class="muted">'+t('Completed sets','المجموعات المكتملة')+'</span><strong>'+total+'</strong></div></div><div class="card"><h2>'+t('Best Numbers','أفضل أرقامك')+'</h2>'+(best.length?'<div class="best">'+best.map(([id,b])=>'<div class="bestItem"><span class="tag">'+t('BEST','أفضل رقم')+'</span><strong>'+name(id)+'</strong><div class="muted">'+b.w+' kg × '+b.r+' '+t('reps','عدات')+trend(id)+'</div></div>').join('')+'</div>':'<p class="muted">'+t('Your best numbers will appear after you complete workouts.','أفضل أرقامك بتظهر بعد ما تكمل حصصك.')+'</p>')+'</div><div class="card"><h2>'+t('Workout History','سجل التمارين')+'</h2>';html+=h.length?h.slice(0,20).map(s=>'<div class="session"><b>'+(s.label||t('Workout','تمرين'))+'</b><div class="muted">'+date(s.end||s.start)+' · '+dur(s)+' · '+sets(s)+' '+t('sets','مجموعات')+'</div></div>').join(''):'<div class="empty"><b>'+t('Your progress starts with your first workout.','تقدمك يبدأ من أول حصة.')+'</b><p class="muted">'+t('Finish a workout and it will appear here automatically.','أكمل أول تمرين وبيظهر هني تلقائياً.')+'</p></div>';app.innerHTML=html+'</div>';</script></body></html>
