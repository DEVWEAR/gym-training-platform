<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV Progress</title><style>*{box-sizing:border-box}body{margin:0;background:#07080a;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:1px solid #ffffff20;background:#111318;color:#fff;padding:11px 14px;border-radius:12px}.red{color:#ff3b3b}.muted{color:#969aa4;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat,.card{background:#101216;border:1px solid #ffffff12;border-radius:18px;padding:16px}.stat strong{font-size:28px;display:block;margin-top:6px}.session{padding:13px 0;border-bottom:1px solid #ffffff10}.empty{text-align:center;padding:35px 12px}@media(max-width:560px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><b><span class="red">DEV</span> <span id="title"></span></b><button class="btn" onclick="location.href='index.html#plan'" id="back"></button></div><div id="app"></div></main><script>let lang=localStorage.getItem('gymLanguage')||'en',ar=()=>lang==='ar',t=(a,b)=>ar()?b:a,h=JSON.parse(localStorage.getItem('devWorkoutHistory')||'[]');document.documentElement.dir=ar()?'rtl':'ltr';title.textContent=t('PROGRESS','التقدم');back.textContent=t('Back','رجوع');function date(v){return new Date(v).toLocaleDateString(ar()?'ar-AE':'en-GB',{day:'numeric',month:'short',year:'numeric'})}function sets(s){return(s.exercises||[]).reduce((a,e)=>a+(e.done||[]).filter(Boolean).length,0)}function dur(s){if(!s.end)return'—';return Math.max(1,Math.round((new Date(s.end)-new Date(s.start))/60000))+' '+t('min','دقيقة')}let week=h.filter(s=>Date.now()-new Date(s.end||s.start).getTime()<604800000).length,total=h.reduce((a,s)=>a+sets(s),0),html='<div class="stats"><div class="stat"><span class="muted">'+t('Workouts','الحصص')+'</span><strong>'+h.length+'</strong></div><div class="stat"><span class="muted">'+t('Last 7 days','آخر 7 أيام')+'</span><strong>'+week+'</strong></div><div class="stat"><span class="muted">'+t('Completed sets','المجموعات المكتملة')+'</span><strong>'+total+'</strong></div></div><div class="card"><h2>'+t('Workout History','سجل التمارين')+'</h2>';html+=h.length?h.slice(0,20).map(s=>'<div class="session"><b>'+(s.label||t('Workout','تمرين'))+'</b><div class="muted">'+date(s.end||s.start)+' · '+dur(s)+' · '+sets(s)+' '+t('sets','مجموعات')+'</div></div>').join(''):'<div class="empty"><b>'+t('Your progress starts with your first workout.','تقدمك يبدأ من أول حصة.')+'</b><p class="muted">'+t('Finish a workout and it will appear here automatically.','أكمل أول تمرين وبيظهر هني تلقائياً.')+'</p></div>';app.innerHTML=html+'</div>';</script></body></html>
