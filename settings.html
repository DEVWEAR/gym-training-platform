<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b21"><title>DEV Settings</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 3%,#78e7ff25,transparent 28%),radial-gradient(circle at 8% 28%,#b7ff6815,transparent 25%),#0d1519;color:#eef5f7;font-family:Arial,Tahoma,sans-serif;min-height:100vh;padding:18px 18px 115px}.wrap{max-width:780px;margin:auto}.top{border:1px solid #ffffff1c;background:#132027e8;border-radius:22px;padding:22px;font-weight:900;letter-spacing:2px}.top span{color:#78e7ff}h1{font-size:clamp(34px,8vw,55px);margin:60px 4px 14px}p{color:#9baeb8;line-height:1.8}.card{margin:22px 0;border:1px solid #ffffff1b;border-radius:22px;padding:22px;background:linear-gradient(145deg,#19262d,#121b20)}.card h2{font-size:20px;margin:0 0 16px}.option{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid #ffffff12}.option:first-of-type{border-top:0}button{border:1px solid #78e7ff65;background:#17343d;color:#eef5f7;padding:12px 18px;border-radius:14px;font-size:15px;cursor:pointer}.active{background:#78e7ff;color:#0d1519}small{color:#9baeb8}</style><link rel="stylesheet" href="dev-performance-theme.css">
</head><body><main class="wrap"><header class="top"><span>DEV</span> SETTINGS</header><h1 id="heading">الإعدادات</h1><p id="desc">تحكم في تفضيلاتك داخل DEV Training.</p><section class="card"><h2 id="languageTitle">اللغة</h2><div class="option"><span id="languageLabel">لغة التطبيق</span><div><button id="arBtn" onclick="setLanguage('ar')">العربية</button> <button id="enBtn" onclick="setLanguage('en')">English</button></div></div></section><section class="card"><h2 id="infoTitle">عن التطبيق</h2><div class="option"><span>DEV Training</span><small>DEV Aurora</small></div></section></main><script>function setLanguage(v){localStorage.setItem('gymLanguage',v);render();try{parent.location.reload()}catch(e){}}function render(){const ar=(localStorage.getItem('gymLanguage')||'ar')==='ar';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';heading.textContent=ar?'الإعدادات':'Settings';desc.textContent=ar?'تحكم في تفضيلاتك داخل DEV Training.':'Manage your DEV Training preferences.';languageTitle.textContent=ar?'اللغة':'Language';languageLabel.textContent=ar?'لغة التطبيق':'App language';infoTitle.textContent=ar?'عن التطبيق':'About';arBtn.classList.toggle('active',ar);enBtn.classList.toggle('active',!ar)}render();</script></body></html>
