<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV Workout</title><style>*{box-sizing:border-box}body{margin:0;background:#07080a;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.exitModal{display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:center;justify-content:center;padding:18px}.exitModal.show{display:flex}.exitSheet{max-width:430px;width:100%;background:#111318;border:1px solid #ffffff20;border-radius:20px;padding:20px}.exitBtns{display:flex;gap:8px;margin-top:16px}.exitBtns button{flex:1}.btn{border:1px solid #ffffff20;background:#111318;color:#fff;padding:11px 14px;border-radius:12px}.red{color:#ff3838}.muted{color:#969aa4}.card{background:#101216;border:1px solid #ffffff12;border-radius:22px;padding:18px;margin:16px 0}.sets{display:grid;gap:8px}.set{display:grid;grid-template-columns:60px 1fr 1fr 48px;gap:8px;align-items:center}.set input{width:100%;background:#08090b;border:1px solid #ffffff18;color:#fff;padding:12px;border-radius:10px}.check{width:24px;height:24px;accent-color:#ed2c2c}.summary{background:#101216;border:1px solid #ffffff12;border-radius:22px;padding:22px;margin-top:18px}.summary strong{font-size:28px;display:block}.actions{display:flex;gap:10px;position:sticky;bottom:8px;background:#07080ae8;padding:10px 0}.primary{flex:1;border:0;background:#ed2c2c;color:#fff;padding:14px;border-radius:13px;font-weight:900}.timer{font-size:28px;font-weight:900}.restBox{display:none;position:sticky;top:8px;z-index:5;background:#17130b;border:1px solid #f0ad2c55;border-radius:16px;padding:12px 14px;margin:12px 0}.restBox.show{display:flex;align-items:center;justify-content:space-between;gap:12px}.restActions{display:flex;gap:7px}.restActions button{border:1px solid #ffffff20;background:#111318;color:#fff;padding:8px 10px;border-radius:9px}.miniH </style></head><body><main class="wrap"><div class="top"><b><span class="red">DEV</span> WORKOUT</b><button class="btn" onclick="askExit()" id="exit"></button></div><div id="restBox" class="restBox"></div><div id="ready"></div><div id="app"></div></main><div id="exitModal" class="exitModal"><div class="exitSheet"><h2 id="exitTitle"></h2><p class="muted" id="exitText"></p><div class="exitBtns"><button class="primary" id="stayBtn" onclick="closeExit()"></button><button class="btn" id="leaveBtn" onclick="leaveWorkout()"></button></div></div></div><script src="exercise-library.js"></script><script src="chest-demonstrations.js"></script><script src="plan-engine.js"></script><script>let p=new URLSearchParams(location.search),key=p.get('day')||'',label=p.get('label')||key,restTimer=null,restLeft=0,lang=localStorage.getItem('gymLanguage')||'en',ar=()=>lang==='ar',ids=(JSON.parse(localStorage.getItem('devPlanExercises')||'{}')[key]||[]),i=0,draftKey='devActiveWorkout_'+key,savedDraft=JSON.parse(localStorage.getItem('devActiveWorkout_'+key)||'null'),session=savedDraft||{key,label,start:new Date().toISOString(),exercises:[]};if(savedDraft){let planned=new Set(ids);session.exercises=(session.exercises||[]).filter(e=>e&&planned.has(e.id));session.key=key;session.label=label;if(Number.isInteger(savedDraft.index))i=Math.min(savedDraft.index,Math.max(0,ids.length-1))}const $=x=>document.getElementById(x),t=(a,b)=>ar()?b:a;document.documentElement.dir=ar()?'rtl':'ltr';document.body.classList.toggle('arabic',ar());$('exit').textContent=t('Exit','خروج');function askExit(){try{collect()}catch(e){saveDraft()}$('exitTitle').textContent=t('Workout saved','تم حفظ تمرينك');$('exitText').textContent=t('You can leave now and continue this workout later from where you stopped.','تقدر تطلع الحين وترجع تكمل التمرين لاحقاً من نفس المكان.');$('stayBtn').textContent=t('KEEP TRAINING','أكمل التمرين');$('leaveBtn').textContent=t('LEAVE FOR NOW','خروج مؤقت');$('exitModal').classList.add('show')}function closeExit(){$('exitModal').classList.remove('show')}function leaveWorkout(){saveDraft();location.href='index.html#plan'}function readinessUI(){if(session.readiness)return;$('ready').innerHTML='<div class="card"><b>'+t('How do you feel today?','كيف حالك اليوم؟')+'</b><p class="muted">'+t('One quick choice helps us keep the session sensible.','اختيار سريع يساعدنا نخلي الحصة مناسبة لك.')+'</p><div class="readiness"><button onclick="setReady(\'good\')">'+t('Good — ready to train','ممتاز — جاهز للتمرين')+'</button><button onclick="setReady(\'tired\')">'+t('Tired / low energy','تعبان / طاقتي قليلة')+'</button><button onclick="setReady(\'pain\')">'+t('Unusual pain','عندي ألم غير معتاد')+'</button></div></div>'}function setReady(v){session.readiness=v;saveDraft();render();$('ready').innerHTML=v==='pain'?'<div class="card"><b class="red">'+t('Do not push through sharp or unusual pain.','لا تتمرن خلال ألم حاد أو غير معتاد.')+'</b><p class="muted">'+t('Stop the affected movement and seek qualified assessment when needed.','أوقف الحركة المتأثرة واطلب تقييماً من مختص عند الحاجة.')+'</p></div>':v==='tired'?'<div class="card"><b>'+t('Low-energy day','يوم طاقتك منخفضة')+'</b><p class="muted">'+t('Keep technique strict and do not force weight increases today.','ركز على الأداء الصحيح ولا تجبر نفسك على زيادة الوزن اليوم.')+'</p></div>':''}function saveDraft(){session.index=i;session.updated=new Date().toISOString();localStorage.setItem(draftKey,JSON.stringify(session))}function ex(){return DEV_EXERCISES.find(x=>x.id===ids[i])}function cleanLast(v){if(!v||!Array.isArray(v.done))return v||{};return {...v,weights:(v.weights||[]).map((x,j)=>v.done[j]===true?x:''),reps:(v.reps||[]).map((x,j)=>v.done[j]===true?x:''),done:v.done.map(Boolean)}}const CHEST_GUIDES={
'incline-db-press':['Set the bench to a moderate incline. Lower the dumbbells beside the upper chest, then press up without banging them together.','Builds the upper chest while also training the front delts and triceps.','اضبط البنش على ميل علوي متوسط. انزل الدمبل بجانب أعلى الصدر ثم ادفع للأعلى بتحكم بدون ضرب الدمبل ببعض.','يقوي ويضخم أعلى الصدر مع مشاركة الكتف الأمامي والترايسبس.'],
'incline-bb-press':['Use a moderate incline, keep shoulder blades back, lower the bar toward the upper chest, then press up.','A strong compound movement for upper-chest strength and size.','استخدم ميل علوي متوسط وثبت لوحي الكتف للخلف، انزل البار باتجاه أعلى الصدر ثم ادفعه للأعلى.','تمرين مركب قوي لزيادة قوة وحجم أعلى الصدر.'],
'incline-smith-press':['Set an incline bench under the Smith bar. Lower toward the upper chest and press along the fixed path.','Lets you load the upper chest with extra stability.','ضع بنش مائل تحت بار السميث، انزل البار نحو أعلى الصدر ثم ادفعه ضمن مساره الثابت.','يسمح بتحميل أعلى الصدر بثبات أكبر.'],
'incline-machine-press':['Adjust the seat so the handles line up with the upper chest. Press forward/up and return slowly.','Targets the upper chest with a stable machine path.','اضبط المقعد بحيث تكون المقابض بمستوى أعلى الصدر، ادفع للأمام ولأعلى ثم ارجع ببطء.','يستهدف أعلى الصدر بمسار ثابت وآمن.'],
'incline-plate-press':['Set the seat for an upper-chest pressing angle. Press the plate-loaded handles forward, then return under control.','Combines machine stability with a strong upper-chest load.','اضبط المقعد لزاوية ضغط الصدر العلوي، ادفع المقابض للأمام ثم ارجع بتحكم.','يجمع بين ثبات الجهاز وتحميل قوي لأعلى الصدر.'],
'incline-cable-fly':['Lie on an incline bench between low cables. Bring the handles together above the upper chest with softly bent elbows.','Keeps constant cable tension on the upper chest.','استلقِ على بنش مائل بين كيبلين منخفضين، واجمع المقابض فوق أعلى الصدر مع ثني بسيط للكوع.','يحافظ على شد مستمر على أعلى الصدر.'],
'low-high-cable-fly':['Start with the handles low and wide. Sweep both arms upward and inward toward the upper chest.','Emphasizes the upper-chest fibers through constant tension.','ابدأ بالمقابض منخفضة وعلى الجانبين، وارفع الذراعين للداخل ولأعلى باتجاه أعلى الصدر.','يركز على ألياف أعلى الصدر مع شد مستمر.'],
'single-arm-low-high-fly':['Start one handle low beside the hip and sweep it upward across the body toward upper-chest height.','Lets each side of the upper chest work independently.','ابدأ بالمقبض منخفضاً بجانب الورك واسحبه للأعلى وعبر الجسم حتى مستوى أعلى الصدر.','يجعل كل جهة من أعلى الصدر تعمل بشكل مستقل.'],
'flat-db-press':['Lie flat, lower the dumbbells beside the chest with controlled elbows, then press straight up.','Builds overall chest size and allows each arm to work independently.','استلقِ على بنش مستوي، انزل الدمبل بجانب الصدر بتحكم ثم ادفعهما للأعلى.','يبني حجم الصدر بشكل عام ويجعل كل ذراع تعمل بشكل مستقل.'],
'flat-bb-press':['Plant your feet, keep shoulder blades back, lower the bar to mid chest, then press up.','A primary compound lift for chest strength and mass.','ثبت القدمين ولوحي الكتف للخلف، انزل البار إلى منتصف الصدر ثم ادفع للأعلى.','تمرين مركب أساسي لقوة وحجم الصدر.'],
'flat-smith-press':['Place a flat bench under the Smith bar. Lower to mid chest and press back up with control.','Provides a stable pressing path for the middle chest.','ضع بنش مستوي تحت بار السميث، انزل البار لمنتصف الصدر ثم ادفعه للأعلى بتحكم.','يوفر مسار ضغط ثابت لاستهداف منتصف الصدر.'],
'chest-press-machine':['Adjust the seat so handles are around mid-chest. Press forward without shrugging, then return slowly.','Trains the chest with high stability and easy load control.','اضبط المقعد بحيث تكون المقابض عند منتصف الصدر، ادفع للأمام بدون رفع الكتفين ثم ارجع ببطء.','يدرب الصدر بثبات عالٍ وتحكم سهل بالوزن.'],
'plate-loaded-chest-press':['Set the handles around chest level. Press the independent lever arms forward, then return under control.','Loads the chest heavily while the machine provides stability.','اضبط المقابض عند مستوى الصدر، ادفع أذرع الجهاز للأمام ثم ارجع بتحكم.','يسمح بتحميل قوي للصدر مع ثبات الجهاز.'],
'db-chest-fly':['Lie flat with a soft elbow bend. Open the dumbbells wide until you feel a chest stretch, then bring them together.','Trains chest adduction and gives a strong stretch under load.','استلقِ بشكل مستوٍ مع ثني بسيط للكوع، افتح الدمبل حتى تشعر بتمدد الصدر ثم اجمعهما.','يدرب ضم الذراعين ويعطي الصدر تمدداً قوياً تحت الحمل.'],
'pec-deck-fly':['Set the seat so elbows/handles align with the chest. Bring the arms together, squeeze, then return slowly.','Isolates the chest with a controlled, stable path.','اضبط المقعد بحيث تكون الذراعان بمستوى الصدر، اجمعهما واعصر الصدر ثم ارجع ببطء.','يعزل الصدر بمسار ثابت ومتحكم.'],
'cable-fly':['Set both pulleys around chest height. Bring the handles together in front of the chest, then open under control.','Keeps continuous tension through the chest fly movement.','اضبط البكرتين عند مستوى الصدر، اجمع المقابض أمام الصدر ثم افتح بتحكم.','يحافظ على شد مستمر خلال حركة التفتيح.'],
'mid-cable-fly':['Use chest-height pulleys and sweep the arms horizontally inward with a slight elbow bend.','Directly emphasizes the middle chest with constant tension.','استخدم كيبل بمستوى الصدر واجمع الذراعين أفقياً للداخل مع ثني بسيط للكوع.','يركز مباشرة على منتصف الصدر مع شد مستمر.'],
'single-arm-cable-fly':['Stand stable with one cable at chest height. Sweep that arm across the chest without rotating the torso.','Improves unilateral chest control and helps address side-to-side imbalance.','قف بثبات والكيبل عند مستوى الصدر، اسحب الذراع عبر الصدر بدون لف الجذع.','يحسن التحكم بكل جهة ويساعد على تقليل فرق القوة بين الجانبين.'],
'standing-cable-chest-press':['Stand in a split stance with cables behind you. Press the handles forward and return without overextending the shoulders.','Trains pressing strength with constant cable tension and core stability.','قف بوضعية ثابتة والكيبل خلفك، ادفع المقابض للأمام ثم ارجع بدون مبالغة في مد الكتف.','يدرب قوة الضغط مع شد مستمر وثبات للجذع.'],
'single-arm-cable-chest-press':['Press one cable forward from chest level while keeping the torso stable, then return slowly.','Builds unilateral pressing strength and trunk control.','ادفع كيبل واحد للأمام من مستوى الصدر مع ثبات الجذع ثم ارجع ببطء.','يبني قوة الضغط لكل جهة ويحسن ثبات الجذع.'],
'seated-cable-chest-press':['Sit firmly with cables behind you. Press forward from chest level and return under control.','Combines seated stability with continuous cable tension.','اجلس بثبات والكيبل خلفك، ادفع للأمام من مستوى الصدر ثم ارجع بتحكم.','يجمع بين ثبات الجلوس والشد المستمر للكيبل.'],
'decline-db-press':['Use a decline bench with the head lower than the hips. Lower dumbbells beside the lower chest and press up.','Emphasizes the lower chest while allowing independent arm movement.','استخدم بنش Decline بحيث يكون الرأس أخفض من الورك، انزل الدمبل بجانب أسفل الصدر ثم ادفع للأعلى.','يركز على أسفل الصدر مع عمل كل ذراع بشكل مستقل.'],
'decline-bb-press':['Secure yourself on a decline bench, lower the bar toward the lower chest, then press up.','A compound press that emphasizes the lower chest.','ثبت جسمك على بنش Decline، انزل البار باتجاه أسفل الصدر ثم ادفع للأعلى.','ضغط مركب يركز على الجزء السفلي من الصدر.'],
'decline-smith-press':['Set a decline bench under the Smith bar with the head lower. Lower toward the lower chest and press up.','Provides a stable lower-chest pressing movement.','ضع بنش Decline تحت السميث والرأس أخفض، انزل البار نحو أسفل الصدر ثم ادفعه للأعلى.','يوفر ضغطاً ثابتاً لاستهداف أسفل الصدر.'],
'decline-machine-press':['Adjust the machine so the press travels slightly downward toward the lower-chest line. Press and return slowly.','Targets the lower chest with machine stability.','اضبط الجهاز بحيث يكون مسار الضغط مائلاً قليلاً للأسفل باتجاه أسفل الصدر، ادفع ثم ارجع ببطء.','يستهدف أسفل الصدر بثبات الجهاز.'],
'decline-db-fly':['Lie on a decline bench with softly bent elbows. Open the dumbbells wide, then bring them together over the lower chest.','Adds a loaded stretch with extra lower-chest emphasis.','استلقِ على بنش Decline مع ثني بسيط للكوع، افتح الدمبل ثم اجمعهما فوق أسفل الصدر.','يعطي تمدداً تحت الحمل مع تركيز أكبر على أسفل الصدر.'],
'high-to-low-fly':['Start with high pulleys and sweep the handles downward and inward toward the lower chest/upper abdomen.','Keeps constant tension while emphasizing the lower chest.','ابدأ بالكيبل من الأعلى واسحب المقابض للداخل وللأسفل باتجاه أسفل الصدر.','يحافظ على شد مستمر مع تركيز على أسفل الصدر.'],
'single-arm-high-low-fly':['Start one cable high and sweep it diagonally down across the body without twisting the torso.','Unilateral lower-chest isolation with constant cable tension.','ابدأ بكيبل واحد من الأعلى واسحبه قطرياً للأسفل عبر الجسم بدون لف الجذع.','يعزل أسفل الصدر لكل جهة مع شد مستمر.'],
'chest-dips':['Lean the torso forward, keep elbows controlled, lower until a comfortable chest stretch, then press up.','A powerful bodyweight movement for the lower chest and triceps.','مل بالجذع للأمام، انزل بتحكم حتى تمدد مريح للصدر ثم ادفع للأعلى.','تمرين وزن جسم قوي لأسفل الصدر والترايسبس.'],
'push-up':['Keep the body in one straight line. Lower the chest toward the floor, then push away without letting the hips sag.','Builds chest, triceps and shoulder strength with bodyweight.','حافظ على الجسم بخط مستقيم، انزل الصدر نحو الأرض ثم ادفع للأعلى بدون هبوط الورك.','يقوي الصدر والترايسبس والكتف باستخدام وزن الجسم.'],
'weighted-push-up':['Perform a strict push-up with a securely positioned external load and a rigid torso.','Progresses the push-up by increasing chest loading.','نفذ تمرين الضغط بأداء ثابت مع وزن إضافي مثبت بشكل آمن وحافظ على استقامة الجسم.','يزيد صعوبة الضغط ويرفع الحمل على الصدر.'],
'wide-push-up':['Place hands wider than shoulder width, keep the body straight, lower under control, then press up.','Shifts more emphasis toward the chest during the push-up.','ضع اليدين أوسع من الكتفين، حافظ على استقامة الجسم، انزل بتحكم ثم ادفع للأعلى.','يزيد تركيز تمرين الضغط على الصدر.'],
'svend-press':['Hold plates together at chest height, squeeze them firmly and press straight forward, then return.','Creates strong chest contraction with light-to-moderate loading.','اضغط الأوزان معاً أمام الصدر بقوة، ادفعها للأمام ثم ارجع مع استمرار العصر.','يعطي انقباضاً قوياً للصدر بأوزان خفيفة إلى متوسطة.'],

'band-chest-press':['Anchor the band behind you at chest height. Press forward evenly and return under control.','Portable chest pressing with increasing band resistance.','ثبت حبل المقاومة خلفك عند مستوى الصدر، ادفع للأمام بالتساوي ثم ارجع بتحكم.','ضغط صدر عملي بمقاومة تزداد كلما تمدد الحبل.'],
'band-chest-fly':['Anchor the bands behind you, keep elbows softly bent and bring the hands together in front of the chest.','Provides chest-fly resistance without a cable machine.','ثبت الحبل خلفك، حافظ على ثني بسيط للكوع واجمع اليدين أمام الصدر.','يوفر مقاومة لتفتيح الصدر بدون جهاز كيبل.'],
