<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV Workout</title><style>*{box-sizing:border-box}body{margin:0;background:#07080a;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:1px solid #ffffff20;background:#111318;color:#fff;padding:11px 14px;border-radius:12px}.red{color:#ff3838}.muted{color:#969aa4}.card{background:#101216;border:1px solid #ffffff12;border-radius:22px;padding:18px;margin:16px 0}.sets{display:grid;gap:8px}.set{display:grid;grid-template-columns:60px 1fr 1fr 48px;gap:8px;align-items:center}.set input{width:100%;background:#08090b;border:1px solid #ffffff18;color:#fff;padding:12px;border-radius:10px}.check{width:24px;height:24px;accent-color:#ed2c2c}.actions{display:flex;gap:10px;position:sticky;bottom:8px;background:#07080ae8;padding:10px 0}.primary{flex:1;border:0;background:#ed2c2c;color:#fff;padding:14px;border-radius:13px;font-weight:900}.timer{font-size:28px;font-weight:900}.restBox{display:none;position:sticky;top:8px;z-index:5;background:#17130b;border:1px solid #f0ad2c55;border-radius:16px;padding:12px 14px;margin:12px 0}.restBox.show{display:flex;align-items:center;justify-content:space-between;gap:12px}.restActions{display:flex;gap:7px}.restActions button{border:1px solid #ffffff20;background:#111318;color:#fff;padding:8px 10px;border-radius:9px}.miniHelp{border:0;background:transparent;color:#b7bbc4;text-decoration:underline;padding:0;cursor:pointer}.tip{display:none;margin-top:8px;padding:10px;border-radius:10px;background:#12151a;color:#c8cbd2;font-size:13px}.tip.show{display:block}.readiness{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.readiness button{border:1px solid #ffffff18;background:#0b0d10;color:#fff;padding:10px;border-radius:10px}.readiness button.on{border-color:#75f19a;background:#17351f}.helper{background:#0b0d10;border:1px solid #ffffff10;border-radius:14px;padding:11px 13px;margin:10px 0;font-size:14px;line-height:1.45}.progress{height:6px;background:#24262b;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#ed2c2c}.arabic{text-align:right}@media(max-width:520px){.readiness{grid-template-columns:1fr}.set{grid-template-columns:48px 1fr 1fr 38px}.wrap{padding:12px}}</style></head><body><main class="wrap"><div class="top"><b><span class="red">DEV</span> WORKOUT</b><button class="btn" onclick="location.href='index.html#plan'" id="exit"></button></div><div id="restBox" class="restBox"></div><div id="ready"></div><div id="app"></div></main><script src="exercise-library.js"></script><script src="plan-engine.js"></script><script>let p=new URLSearchParams(location.search),key=p.get('day')||'',label=p.get('label')||key,restTimer=null,restLeft=0,lang=localStorage.getItem('gymLanguage')||'en',ar=()=>lang==='ar',ids=(JSON.parse(localStorage.getItem('devPlanExercises')||'{}')[key]||[]),i=0,draftKey='devActiveWorkout_'+key,savedDraft=JSON.parse(localStorage.getItem('devActiveWorkout_'+key)||'null'),session=savedDraft||{key,label,start:new Date().toISOString(),exercises:[]};if(savedDraft&&Number.isInteger(savedDraft.index))i=Math.min(savedDraft.index,Math.max(0,ids.length-1));const $=x=>document.getElementById(x),t=(a,b)=>ar()?b:a;document.documentElement.dir=ar()?'rtl':'ltr';document.body.classList.toggle('arabic',ar());$('exit').textContent=t('Exit','خروج');function readinessUI(){if(session.readiness)return;$('ready').innerHTML='<div class="card"><b>'+t('How do you feel today?','كيف حالك اليوم؟')+'</b><p class="muted">'+t('One quick choice helps us keep the session sensible.','اختيار سريع يساعدنا نخلي الحصة مناسبة لك.')+'</p><div class="readiness"><button onclick="setReady(\'good\')">'+t('Good — ready to train','ممتاز — جاهز للتمرين')+'</button><button onclick="setReady(\'tired\')">'+t('Tired / low energy','تعبان / طاقتي قليلة')+'</button><button onclick="setReady(\'pain\')">'+t('Unusual pain','عندي ألم غير معتاد')+'</button></div></div>'}function setReady(v){session.readiness=v;saveDraft();$('ready').innerHTML=v==='pain'?'<div class="card"><b class="red">'+t('Do not push through sharp or unusual pain.','لا تتمرن خلال ألم حاد أو غير معتاد.')+'</b><p class="muted">'+t('Stop the affected movement and seek qualified assessment when needed.','أوقف الحركة المتأثرة واطلب تقييماً من مختص عند الحاجة.')+'</p></div>':v==='tired'?'<div class="card"><b>'+t('Low-energy day','يوم طاقتك منخفضة')+'</b><p class="muted">'+t('Keep technique strict and do not force weight increases today.','ركز على الأداء الصحيح ولا تجبر نفسك على زيادة الوزن اليوم.')+'</p></div>':''}function saveDraft(){session.index=i;session.updated=new Date().toISOString();localStorage.setItem(draftKey,JSON.stringify(session))}function ex(){return DEV_EXERCISES.find(x=>x.id===ids[i])}function toggleTip(){let e=$('rirTip');if(e)e.classList.toggle('show')}function restSeconds(v){let m=String(v||'90').match(/\d+/g);if(!m)return 90;return +m[m.length-1]}function fmt(sec){return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}function stopRest(){clearInterval(restTimer);restTimer=null;$('restBox').classList.remove('show')}function startRest(sec){stopRest();restLeft=sec;$('restBox').classList.add('show');drawRest();restTimer=setInterval(()=>{restLeft--;drawRest();if(restLeft<=0)stopRest()},1000)}function addRest(n){restLeft=Math.max(0,restLeft+n);drawRest()}function drawRest(){let b=$('restBox');b.innerHTML='<div><small class="muted">'+t('REST TIMER','مؤقت الراحة')+'</small><div class="timer">'+fmt(restLeft)+'</div></div><div class="restActions"><button onclick="addRest(30)">+30s</button><button onclick="stopRest()">'+t('SKIP','تخطي')+'</button></div>'}function setDone(n,sec){collect();if($('c'+n).checked)startRest(sec)}function render(){if(!ids.length){$('app').innerHTML='<div class="card"><h2>'+t('No exercises selected','لا توجد تمارين مختارة')+'</h2><p class="muted">'+t('Return to your plan and choose exercises first.','ارجع إلى خطتك واختر التمارين أولاً.')+'</p></div>';return}let x=ex(),plan=JSON.parse(localStorage.getItem('gymPlan')||'{}'),rx=DEV_PLAN_ENGINE.prescribe(x,plan.goal||'Muscle',plan.level||'Advanced'),last=session.exercises[i]||JSON.parse(localStorage.getItem('devLast_'+x.id)||'{}'),prog=DEV_PLAN_ENGINE.progression(x,plan.goal||'Muscle',last),sets=Array.from({length:rx.sets},(_,n)=>'<div class="set"><b>'+(n+1)+'</b><input id="w'+n+'" type="number" step=".5" placeholder="'+t('kg','كجم')+'" value="'+(last.weights?.[n]||'')+'"><input id="r'+n+'" type="number" placeholder="'+t('reps','عدات')+'" value="'+(last.reps?.[n]||'')+'"><input id="c'+n+'" class="check" type="checkbox" '+(last.done?.[n]?'checked':'')+' onchange="setDone('+n+','+restSeconds(rx.rest)+')"></div>').join('');$('app').innerHTML='<p class="muted">'+label+' · '+(i+1)+' / '+ids.length+'</p><div class="progress"><i style="width:'+((i+1)/ids.length*100)+'%"></i></div><div class="card"><small class="red">'+x.en+'</small><h1>'+(ar()?x.ar:x.en)+'</h1><p class="muted">'+t('Previous numbers are pre-filled. Adjust them to what you complete today.','أرقام المرة السابقة موجودة تلقائياً. عدّلها حسب تمرين اليوم.')+'</p><div class="sets">'+sets+'</div><p><b>'+t('Rest','الراحة')+':</b> '+rx.rest+' · <b>RIR:</b> '+rx.rir+'</p></div><div class="actions"><button class="btn" onclick="prev()" '+(i===0?'disabled':'')+'>'+t('← Previous','السابق →')+'</button><button class="primary" onclick="next()">'+(i===ids.length-1?t('FINISH WORKOUT ✓','إنهاء التمرين ✓'):t('NEXT EXERCISE →','التمرين التالي ←'))+'</button></div>'}function collect(){let x=ex(),plan=JSON.parse(localStorage.getItem('gymPlan')||'{}'),rx=DEV_PLAN_ENGINE.prescribe(x,plan.goal||'Muscle',plan.level||'Advanced'),weights=[],reps=[],done=[];for(let n=0;n<rx.sets;n++){weights.push($('w'+n).value);reps.push($('r'+n).value);done.push($('c'+n).checked)}let rec={id:x.id,weights,reps,done};session.exercises[i]=rec;saveDraft();localStorage.setItem('devLast_'+x.id,JSON.stringify({...rec,date:new Date().toISOString()}))}function next(){stopRest();collect();if(i<ids.length-1){i++;render()}else finish()}function prev(){stopRest();collect();if(i>0){i--;render()}}function sessionPRs(){let hist=JSON.parse(localStorage.getItem('devWorkoutHistory')||'[]'),out=[];session.exercises.forEach(e=>{if(!e)return;let prior=0;hist.forEach(s=>(s.exercises||[]).filter(z=>z.id===e.id).forEach(z=>(z.weights||[]).forEach(w=>prior=Math.max(prior,Number(w)||0))));let now=Math.max(0,...(e.weights||[]).map(Number));if(now>prior&&prior>0)out.push({id:e.id,weight:now,previous:prior})});return out}function finish(){stopRest();session.prs=sessionPRs();localStorage.removeItem(draftKey);session.end=new Date().toISOString();let h=JSON.parse(localStorage.getItem('devWorkoutHistory')||'[]');h.unshift(session);localStorage.setItem('devWorkoutHistory',JSON.stringify(h.slice(0,100)));let st=JSON.parse(localStorage.getItem('gymScheduleState')||'{}');let seqLen=Math.max(1,(JSON.parse(localStorage.getItem('gymPlan')||'{}').trainingDays||[]).length);st.workoutIndex=(Math.max(0,+st.workoutIndex||0)+1)%seqLen;let d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');st.lastCompleted=y+'-'+m+'-'+dd;st.lastPromptDate=st.lastCompleted;localStorage.setItem('gymScheduleState',JSON.stringify(st));location.href='index.html#plan'}window.addEventListener('beforeunload',()=>{try{collect()}catch(e){saveDraft()}});readinessUI();render();</script></body></html>
