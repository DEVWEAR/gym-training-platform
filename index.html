<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYM Training</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07080a;color:#fff}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 85% 5%,#6a0b0b88,transparent 30%),linear-gradient(135deg,#050607,#111318);z-index:-1}.wrap{max-width:1150px;margin:auto;padding:20px}.nav,.row,.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.red{color:#ff3b3b}.muted{color:#92969f;line-height:1.55}.pill,.secondary{background:#ffffff09;border:1px solid #ffffff18;color:#fff;padding:11px 15px;border-radius:999px;cursor:pointer}.primary{border:0;background:#ed2c2c;color:#fff;padding:14px 19px;border-radius:13px;font-weight:800;cursor:pointer}.hero{padding:65px 0 30px;max-width:850px}.hero h1{font-size:clamp(48px,8vw,90px);line-height:.9;margin:15px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel,.choice{background:#111318;border:1px solid #ffffff12;border-radius:20px;padding:20px}.card{min-height:135px}.bottom{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:30px}.status{color:#52e889}.workout{padding:17px 0;border-bottom:1px solid #ffffff0c}.warmup{padding:15px;margin:12px 0;background:#2c220b;border:1px solid #f0ad2c55;border-radius:14px}.hold{padding:14px;margin:12px 0;border:1px solid #ffffff12;border-radius:14px}.coach{margin:20px 0 60px;padding:28px;background:#101216;border:1px solid #ffffff14;border-radius:26px}.coachhead{display:flex;justify-content:space-between;gap:20px}.advanced{background:#3b1111;border:1px solid #ff3b3b66;color:#ff6565;border-radius:999px;padding:8px 13px;height:max-content;font-size:12px;font-weight:900}.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;direction:ltr;margin-top:20px}.coachday{background:#0d0f12;border:1px solid #ffffff12;border-radius:17px;padding:18px;min-height:140px}.coachday h3{margin:10px 0}.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#111318;border:1px solid #ffffff20;border-radius:25px;padding:24px}.close{float:right;background:#ffffff0d;border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px}.progress{height:5px;background:#303239;border-radius:9px;margin:18px 0}.progress i{display:block;height:100%;background:#ed2c2c;border-radius:9px}.step{display:none}.step.active{display:block}.choices,.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{color:#fff;text-align:left;cursor:pointer}.choice:hover{border-color:#ffffff35}.choice.selected{border-color:#ff3b3b;background:#351313}.choice b{font-size:17px}.choice small{display:block;margin-top:6px}.fields input{background:#090a0d;border:1px solid #ffffff18;color:#fff;padding:15px;border-radius:13px;font-size:16px;width:100%}.splitgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.split{position:relative}.actions{display:flex;gap:10px;margin-top:20px}.arabic{text-align:right}.arabic .choice{text-align:right}.arabic .close{float:left}.arabic .week .coachday{direction:rtl;text-align:right}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.bottom{grid-template-columns:1fr}.week{grid-template-columns:1fr}.choices,.fields,.splitgrid{grid-template-columns:1fr}.coachhead{flex-direction:column}}</style></head><body><main class="wrap"><nav class="nav"><div class="brand"><span class="red">GYM</span> TRAINING</div><button class="pill" id="lang" onclick="toggleLang()"></button></nav><section class="hero"><small class="red" data-en="TRAIN SMARTER • GET STRONGER" data-ar="تدرّب بذكاء • كن أقوى"></small><h1 data-en="YOUR BODY.<br><span class='red'>YOUR PLAN.</span>" data-ar="جسمك.<br><span class='red'>خطتك.</span>"></h1><p class="muted" data-en="Training built around your level, goal, schedule and equipment." data-ar="تدريب مبني على مستواك وهدفك وجدولك والمعدات المتوفرة لك."></p><button class="primary" onclick="openBuilder()" data-en="BUILD MY PLAN →" data-ar="ابنِ خطتي ←"></button></section><section class="cards"><div class="card"><b data-en="◉ My Workout" data-ar="◉ تماريني"></b><p class="muted" data-en="Your personalized session." data-ar="حصتك التدريبية المخصصة."></p></div><div class="card"><b data-en="⚡ Exercises" data-ar="⚡ التمارين"></b><p class="muted" data-en="Dumbbell, barbell, cable & machine alternatives." data-ar="بدائل دمبل وبار وكيبل وأجهزة."></p></div><div class="card"><b data-en="◎ Nutrition" data-ar="◎ التغذية"></b><p class="muted" data-en="Calories and macros around your goal." data-ar="السعرات والماكروز حسب هدفك."></p></div><div class="card"><b data-en="↗ Progress" data-ar="↗ التقدم"></b><p class="muted" data-en="Strength, records and consistency." data-ar="القوة والأرقام والاستمرارية."></p></div></section><section class="bottom" id="plan"><div class="panel"><div class="top"><h2 id="focusTitle"></h2><span class="status" id="status"></span></div><div class="warmup" id="warmup"></div><div class="hold"><b data-en="Not going to the gym today?" data-ar="ما بتروح الجم اليوم؟"></b><p class="muted" data-en="Hold today and move this workout to your next training day." data-ar="أجّل تمرين اليوم وانقله إلى يوم التدريب القادم."></p><button class="secondary" id="holdBtn" onclick="toggleHold()"></button></div><div id="exerciseList"></div></div><div class="panel"><h2 data-en="Your Plan" data-ar="خطتك"></h2><div id="planSummary" class="muted"></div><br><button class="primary" onclick="openBuilder()" data-en="REBUILD MY PLAN" data-ar="إعادة بناء خطتي"></button></div></section><section class="coach"><div class="coachhead"><div><small class="red" data-en="FOLLOW THE COACH" data-ar="تدرّب مع الكوتش"></small><h2 data-en="Coach's Weekly Workouts" data-ar="تمارين الكوتش الأسبوعية"></h2><p class="muted" data-en="Advanced coach routine from Sunday to Thursday. Exercises will be added later." data-ar="جدول الكوتش للمحترفين من الأحد إلى الخميس. سنضيف التمارين لاحقاً."></p></div><span class="advanced" data-en="ADVANCED • PRO" data-ar="للمحترفين • متقدم"></span></div><div class="week"><div class="coachday"><small data-en="SUNDAY" data-ar="الأحد"></small><h3 data-en="Chest" data-ar="الصدر"></h3></div><div class="coachday"><small data-en="MONDAY" data-ar="الاثنين"></small><h3 data-en="Back" data-ar="الظهر"></h3></div><div class="coachday"><small data-en="TUESDAY" data-ar="الثلاثاء"></small><h3 data-en="Shoulders" data-ar="الأكتاف"></h3></div><div class="coachday"><small data-en="WEDNESDAY" data-ar="الأربعاء"></small><h3 data-en="Arms" data-ar="الذراعين"></h3></div><div class="coachday"><small data-en="THURSDAY" data-ar="الخميس"></small><h3 data-en="Legs" data-ar="الأرجل"></h3></div></div></section></main><div class="modal" id="builder"><div class="sheet"><button class="close" onclick="closeBuilder()">×</button><small class="red" data-en="BUILD MY PLAN" data-ar="ابنِ خطتي"></small><h2 id="stepTitle"></h2><div class="progress"><i id="bar"></i></div><div class="step" data-step="1"><p class="muted" data-en="First, tell us your experience level." data-ar="أولاً، اختر مستواك الحالي في التمرين."></p><div class="choices"><button class="choice" onclick="pick(this,'level','Beginner')"><b data-en="Beginner" data-ar="مبتدئ"></b><small class="muted" data-en="Simple structure • controlled volume" data-ar="جدول أبسط • حجم تدريبي مناسب"></small></button><button class="choice" onclick="pick(this,'level','Advanced')"><b data-en="Advanced" data-ar="متقدم"></b><small class="muted" data-en="More volume • more exercise control" data-ar="حجم تدريبي أعلى • تحكم أكبر"></small></button></div></div><div class="step" data-step="2"><p class="muted" data-en="What are you training for?" data-ar="ما هو هدفك الأساسي؟"></p><div class="choices"><button class="choice" onclick="pick(this,'goal','Muscle')" data-en="Build Muscle" data-ar="تضخيم وبناء العضلات"></button><button class="choice" onclick="pick(this,'goal','Cut')" data-en="Fat Loss / Cut" data-ar="تنشيف / خسارة الدهون"></button><button class="choice" onclick="pick(this,'goal','Strength')" data-en="Strength" data-ar="القوة"></button><button class="choice" onclick="pick(this,'goal','Maintain')" data-en="Maintain" data-ar="المحافظة"></button></div></div><div class="step" data-step="3"><p class="muted" data-en="Tell us about your body and how many days you can train." data-ar="أدخل بياناتك وعدد الأيام التي تستطيع التدريب فيها أسبوعياً."></p><div class="fields"><input id="weight" type="number"><input id="height" type="number"><input id="age" type="number"><input id="days" type="number" min="2" max="6"></div></div><div class="step" data-step="4"><p class="muted" id="splitHelp"></p><div class="splitgrid" id="splitChoices"></div></div><div class="step" data-step="5"><p class="muted" data-en="Which muscle would you like to prioritize?" data-ar="أي عضلة تريد إعطاءها أولوية؟"></p><div class="choices"><button class="choice" onclick="chooseMuscle(this,'Chest')" data-en="Chest" data-ar="الصدر"></button><button class="choice" onclick="chooseMuscle(this,'Back')" data-en="Back" data-ar="الظهر"></button><button class="choice" onclick="chooseMuscle(this,'Shoulders')" data-en="Shoulders" data-ar="الأكتاف"></button><button class="choice" onclick="chooseMuscle(this,'Arms')" data-en="Arms" data-ar="الذراعين"></button><button class="choice" onclick="chooseMuscle(this,'Legs')" data-en="Legs" data-ar="الأرجل"></button><button class="choice" onclick="chooseMuscle(this,'Core')" data-en="Core" data-ar="البطن والكور"></button></div></div><div class="step" data-step="6"><p class="muted" id="focusHelp"></p><div class="choices" id="focusChoices"></div></div><div class="actions"><button class="secondary" id="back" onclick="move(-1)"></button><button class="primary" id="next" onclick="move(1)"></button></div></div></div><script>let lang=localStorage.getItem('gymLanguage')||'en',step=1,held=localStorage.getItem('gymHeld')==='1',data=JSON.parse(localStorage.getItem('gymPlan')||'{}');const $=x=>document.getElementById(x),ar=()=>lang==='ar';const titles={en:['','Training level','Your goal','Body & training days','Choose your workout split','Muscle priority','Choose your focus'],ar:['','مستواك التدريبي','هدفك','بياناتك وأيام التدريب','اختر نظام جدولك','أولوية العضلات','اختر الجزء المستهدف']};const splits=[['Full Body','2–3','Balanced full-body sessions','تمرين كامل الجسم'],['Upper Lower','3–4','Upper and lower body rotation','تقسيم علوي وسفلي'],['Push Pull Legs (PPL)','3–6','Push, pull and legs rotation','دفع وسحب وأرجل'],['Upper Lower PPL','5','Upper/Lower combined with PPL','دمج نظامين'],['Arnold Split','6','Chest + back / shoulders + arms / legs','صدر وظهر / أكتاف وذراع / أرجل'],['Bro Split','5–6','Main muscle focus each session','عضلة رئيسية لكل حصة'],['Body Part Split','4–6','Flexible muscle-by-muscle structure','تقسيم حسب العضلات'],['Powerbuilding Split','4–5','Strength compounds + hypertrophy work','قوة مع تضخيم']];const focus={Chest:[['Overall Chest','الصدر بالكامل'],['Upper Chest','الصدر العلوي'],['Mid Chest','منتصف الصدر'],['Lower Chest','الصدر السفلي']],Back:[['Overall Back','الظهر بالكامل'],['Lats','اللاتس / العرض'],['Upper Back','أعلى الظهر']],Shoulders:[['Overall Shoulders','الأكتاف بالكامل'],['Front Delts','الأمامي'],['Side Delts','الجانبي'],['Rear Delts','الخلفي']],Arms:[['Overall Arms','الذراعين بالكامل'],['Biceps','البايسبس'],['Triceps','الترايسبس']],Legs:[['Overall Legs','الأرجل بالكامل'],['Quads','الأمامية'],['Hamstrings','الخلفية'],['Glutes','المؤخرة'],['Calves','السمانة']],Core:[['Overall Core','الكور بالكامل'],['Abs','البطن'],['Obliques','الجوانب']]};function applyLang(){document.body.classList.toggle('arabic',ar());$('lang').textContent=ar()?'English 🇬🇧':'العربية 🇦🇪';document.querySelectorAll('[data-en][data-ar]').forEach(e=>e.innerHTML=e.getAttribute(ar()?'data-ar':'data-en'));$('weight').placeholder=ar()?'الوزن (كجم)':'Weight (kg)';$('height').placeholder=ar()?'الطول (سم)':'Height (cm)';$('age').placeholder=ar()?'العمر':'Age';$('days').placeholder=ar()?'أيام التدريب (2–6)':'Training days (2–6)';showStep();renderPlan()}function toggleLang(){lang=ar()?'en':'ar';localStorage.setItem('gymLanguage',lang);applyLang()}function openBuilder(){data={};step=1;$('builder').classList.add('show');showStep()}function closeBuilder(){$('builder').classList.remove('show')}function pick(el,k,v){el.parentElement.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');data[k]=v}function chooseMuscle(el,v){pick(el,'muscle',v);data.focus=null}function renderSplits(){$('splitHelp').innerHTML=ar()?'اختر نظام التمرين الذي تفضله. أسماء الأنظمة تبقى بالإنجليزية.':'Choose the workout split you prefer.';$('splitChoices').innerHTML=splits.map(s=>'<button class="choice split" onclick="pick(this,\'split\',\''+s[0]+'\')"><b dir="ltr">'+s[0]+'</b><small class="muted">'+s[1]+' '+(ar()?'أيام':'days')+' • '+(ar()?s[3]:s[2])+'</small></button>').join('')}function renderFocus(){let a=focus[data.muscle]||[];$('focusHelp').textContent=ar()?'اختر الجزء الذي تريد التركيز عليه أكثر.':'Choose the area you want to emphasize.';$('focusChoices').innerHTML=a.map(x=>'<button class="choice" onclick="pick(this,\'focus\',\''+x[0]+'\')">'+(ar()?x[1]:x[0])+'</button>').join('')}function move(n){if(n<0){step=Math.max(1,step-1);showStep();return}if(step===1&&!data.level||step===2&&!data.goal)return;if(step===3){data.weight=$('weight').value;data.height=$('height').value;data.age=$('age').value;data.days=$('days').value;if(+data.days<2||+data.days>6)return}if(step===4&&!data.split||step===5&&!data.muscle)return;if(step===6){if(!data.focus)return;finish();return}step++;if(step===4)renderSplits();if(step===6)renderFocus();showStep()}function showStep(){document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',+x.dataset.step===step));if(!$('stepTitle'))return;$('stepTitle').textContent=titles[lang][step];$('bar').style.width=(step/6*100)+'%';$('back').style.visibility=step===1?'hidden':'visible';$('back').textContent=ar()?'رجوع':'Back';$('next').textContent=step===6?(ar()?'جهّز خطتي ←':'CREATE MY PLAN →'):(ar()?'متابعة ←':'Continue →')}function finish(){localStorage.setItem('gymPlan',JSON.stringify(data));closeBuilder();renderPlan();$('plan').scrollIntoView({behavior:'smooth'})}function renderPlan(){let f=data.focus||(ar()?'الصدر':'Chest');$('focusTitle').innerHTML=(ar()?'تمرينك اليوم · ':'Today’s workout · ')+'<span class="red">'+f+'</span>';$('status').textContent=held?(ar()?'● مؤجل':'● ON HOLD'):(ar()?'● جاهز':'● READY');$('holdBtn').textContent=held?(ar()?'استئناف اليوم':'RESUME TODAY'):(ar()?'تأجيل تمرين اليوم':'HOLD TODAY');$('warmup').innerHTML=ar()?'<b>🔥 الإحماء أولاً</b><br><span class="muted">إحماء مناسب ومجموعات تمهيدية خفيفة، ثم زيادة الحمل تدريجياً.</span>':'<b>🔥 Warm up first</b><br><span class="muted">Use an appropriate warm-up and light ramp-up sets, then increase load gradually.</span>';$('planSummary').innerHTML=data.split?'<b style="color:white" dir="ltr">'+data.split+'</b><br>'+(ar()?'أيام التدريب: ':'Training days: ')+data.days+'<br>'+(ar()?'المستوى: ':'Level: ')+(ar()?(data.level==='Beginner'?'مبتدئ':'متقدم'):data.level):ar()?'ابنِ خطتك للبدء.':'Build your plan to get started.';let ex=[['Incline Press','ضغط صدر علوي','4 × 8–10'],['Chest Fly','تفتيح صدر','3 × 10–12'],['Flat Press','ضغط صدر مستوي','3 × 8–10']];$('exerciseList').innerHTML=ex.map(x=>'<div class="workout row"><b>'+(ar()?x[1]:x[0])+'</b><b>'+x[2]+'</b></div>').join('')}function toggleHold(){held=!held;localStorage.setItem('gymHeld',held?'1':'0');renderPlan()}applyLang();</script></body></html>
