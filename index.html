<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYM Training</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07080a;color:#fff}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 85% 5%,#650b0b88,transparent 30%),linear-gradient(135deg,#050607,#111318);z-index:-1}.wrap{max-width:1150px;margin:auto;padding:20px}.nav,.top,.row{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.red{color:#ff3b3b}.muted{color:#92969f;line-height:1.6}.pill,.secondary{background:#ffffff09;border:1px solid #ffffff18;color:#fff;padding:11px 15px;border-radius:999px;cursor:pointer}.primary{border:0;background:#ed2c2c;color:#fff;padding:14px 19px;border-radius:13px;font-weight:800;cursor:pointer}.hero{padding:70px 0 35px;max-width:850px}.hero h1{font-size:clamp(48px,8vw,92px);line-height:.9;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel,.choice{background:#111318;border:1px solid #ffffff12;border-radius:22px;padding:20px}.card{min-height:145px}.bottom{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:30px}.status{color:#52e889}.warmup{display:none;padding:16px;margin:12px 0 18px;border:1px solid #f0ad2c55;background:#2c220b;border-radius:15px}.warmup.show{display:block}.workout{padding:18px 0;border-bottom:1px solid #ffffff0c}.holdbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;padding:14px;border:1px solid #ffffff12;background:#0c0e11;border-radius:15px}.holdbtn{background:#24272d;color:#fff;border:1px solid #ffffff18;padding:11px 15px;border-radius:12px;font-weight:800;cursor:pointer}.holdbtn.active{background:#553b0a;border-color:#f0ad2c;color:#ffd778}.coach{margin:20px 0 60px;padding:28px;background:linear-gradient(145deg,#121418,#0c0d10);border:1px solid #ffffff14;border-radius:26px}.coachhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.coachhead h2{font-size:32px;margin:5px 0 8px}.advanced{display:inline-block;background:#3b1111;border:1px solid #ff3b3b66;color:#ff6565;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:900;white-space:nowrap}.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.coachday{background:#0d0f12;border:1px solid #ffffff12;border-radius:18px;padding:18px;min-height:150px;position:relative;overflow:hidden}.coachday:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#ed2c2c}.coachday small{color:#8e929b;font-weight:700}.coachday h3{margin:12px 0 8px;font-size:21px}.pending{color:#686d76;font-size:13px;line-height:1.5}.weeknote{margin-top:16px;padding:13px 15px;border-radius:14px;background:#ffffff05;border:1px solid #ffffff0c;color:#999da6}.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#111318;border:1px solid #ffffff18;border-radius:24px;padding:22px}.close{float:right;background:#ffffff0d;border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}.progress{height:5px;background:#303239;border-radius:9px;margin:18px 0}.progress i{display:block;height:100%;background:#ed2c2c;border-radius:9px;transition:.25s}.step{display:none}.step.active{display:block}.choices,.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{color:#fff;text-align:left;cursor:pointer}.choice.selected{border-color:#ff3b3b;background:#341313}.fields input{background:#090a0d;border:1px solid #ffffff18;color:#fff;padding:15px;border-radius:13px;font-size:16px;width:100%}.actions{display:flex;gap:10px;margin-top:18px}.arabic{text-align:right}.arabic .choice{text-align:right}.arabic .close{float:left}.arabic .coachday:before{left:auto;right:0}@media(max-width:900px){.week{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.bottom{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.choices,.fields{grid-template-columns:1fr}.holdbar{flex-direction:column;align-items:flex-start}.coachhead{flex-direction:column}.week{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="nav"><div class="brand"><span class="red">GYM</span> TRAINING</div><button class="pill" id="lang" onclick="toggleLang()"></button></nav><section class="hero"><small class="red" data-en="TRAIN SMARTER • GET STRONGER" data-ar="تدرّب بذكاء • كن أقوى"></small><h1 data-en="YOUR BODY.<br><span class='red'>YOUR PLAN.</span>" data-ar="جسمك.<br><span class='red'>خطتك.</span>"></h1><p class="muted" data-en="Training built around your level, goal and equipment. Build a plan that adapts to you." data-ar="تدريب مبني على مستواك وهدفك والمعدات المتوفرة لك. ابنِ برنامجاً يتكيف معك."></p><button class="primary" onclick="openBuilder()" data-en="BUILD MY PLAN →" data-ar="ابنِ خطتي ←"></button></section><section class="cards"><div class="card"><b data-en="◉ My Workout" data-ar="◉ تماريني"></b><p class="muted" data-en="Your personalized session for today." data-ar="حصتك التدريبية المخصصة لليوم."></p></div><div class="card"><b data-en="⚡ Exercises" data-ar="⚡ التمارين"></b><p class="muted" data-en="Dumbbell, barbell, cable & machine alternatives." data-ar="بدائل دمبل وبار وكيبل وأجهزة."></p></div><div class="card"><b data-en="◎ Nutrition" data-ar="◎ التغذية"></b><p class="muted" data-en="Calories and macros around your goal." data-ar="السعرات والماكروز حسب هدفك."></p></div><div class="card"><b data-en="↗ Progress" data-ar="↗ التقدم"></b><p class="muted" data-en="Strength, records and consistency." data-ar="القوة والأرقام والاستمرارية."></p></div></section><section class="bottom" id="plan"><div class="panel"><div class="top"><h2 id="focusTitle"></h2><span id="dayStatus" class="status"></span></div><div id="warmup" class="warmup"></div><div class="holdbar"><div><b data-en="Not going to the gym today?" data-ar="ما بتروح الجم اليوم؟"></b><br><small class="muted" data-en="Hold today without losing your workout or streak." data-ar="أجّل تمرين اليوم بدون ما تخسر التمرين أو الاستمرارية."></small></div><button id="holdButton" class="holdbtn" onclick="holdAction()"></button></div><div id="exerciseList"></div></div><div class="panel"><h2 data-en="Smart Schedule" data-ar="الجدول الذكي"></h2><p class="muted" data-en="Your plan moves with you instead of marking a held workout as missed." data-ar="جدولك يتحرك معك بدل ما يحسب التمرين المؤجل كتمرين فائت."></p><button class="primary" onclick="openBuilder()" data-en="PERSONALIZE MY PLAN" data-ar="خصص خطتي"></button></div></section><section class="coach"><div class="coachhead"><div><small class="red" data-en="FOLLOW THE COACH" data-ar="تدرّب مع الكوتش"></small><h2 data-en="Coach's Weekly Workouts" data-ar="تمارين الكوتش الأسبوعية"></h2><p class="muted" data-en="A separate advanced weekly routine for members who want to follow the coach's training from Sunday to Thursday." data-ar="جدول أسبوعي مستقل للمشتركين اللي حابين يقلدون تمارين الكوتش من الأحد إلى الخميس."></p></div><span class="advanced" data-en="ADVANCED • PRO" data-ar="للمحترفين • متقدم"></span></div><div class="week"><div class="coachday"><small data-en="SUNDAY" data-ar="الأحد"></small><h3 data-en="Chest" data-ar="الصدر"></h3><div class="pending" data-en="Coach exercises will be added later." data-ar="سيتم إضافة تمارين الكوتش لاحقاً."></div></div><div class="coachday"><small data-en="MONDAY" data-ar="الاثنين"></small><h3 data-en="Back" data-ar="الظهر"></h3><div class="pending" data-en="Coach exercises will be added later." data-ar="سيتم إضافة تمارين الكوتش لاحقاً."></div></div><div class="coachday"><small data-en="TUESDAY" data-ar="الثلاثاء"></small><h3 data-en="Shoulders" data-ar="الأكتاف"></h3><div class="pending" data-en="Coach exercises will be added later." data-ar="سيتم إضافة تمارين الكوتش لاحقاً."></div></div><div class="coachday"><small data-en="WEDNESDAY" data-ar="الأربعاء"></small><h3 data-en="Arms" data-ar="الذراعين"></h3><div class="pending" data-en="Coach exercises will be added later." data-ar="سيتم إضافة تمارين الكوتش لاحقاً."></div></div><div class="coachday"><small data-en="THURSDAY" data-ar="الخميس"></small><h3 data-en="Legs" data-ar="الأرجل"></h3><div class="pending" data-en="Coach exercises will be added later." data-ar="سيتم إضافة تمارين الكوتش لاحقاً."></div></div></div><div class="weeknote" data-en="↻ New coach routine every week • Friday & Saturday: recovery / rest" data-ar="↻ جدول كوتش جديد كل أسبوع • الجمعة والسبت: استشفاء / راحة"></div></section></main><div class="modal" id="builder"><div class="sheet"><button class="close" onclick="closeBuilder()">×</button><small class="red" data-en="PERSONAL COACH SETUP" data-ar="إعداد المدرب الشخصي"></small><h2 id="stepTitle"></h2><div class="progress"><i id="bar"></i></div><div class="step" data-step="1"><div class="choices"><button class="choice" onclick="pick(this,'level','Beginner')"><b data-en="Beginner" data-ar="مبتدئ"></b><br><small class="muted" data-en="3–4 exercises · guided" data-ar="3–4 تمارين · مع توجيه"></small></button><button class="choice" onclick="pick(this,'level','Advanced')"><b data-en="Advanced" data-ar="متقدم"></b><br><small class="muted" data-en="5–6 exercises · more control" data-ar="5–6 تمارين · تحكم أكبر"></small></button></div></div><div class="step" data-step="2"><div class="choices"><button class="choice" onclick="pick(this,'goal','Build Muscle')" data-en="Build Muscle" data-ar="تضخيم وبناء العضلات"></button><button class="choice" onclick="pick(this,'goal','Cut')" data-en="Cut / Fat Loss" data-ar="تنشيف / خسارة الدهون"></button><button class="choice" onclick="pick(this,'goal','Maintain')" data-en="Maintain" data-ar="المحافظة"></button><button class="choice" onclick="pick(this,'goal','Strength')" data-en="Strength" data-ar="القوة"></button></div></div><div class="step" data-step="3"><div class="fields"><input id="weight" type="number"><input id="height" type="number"><input id="age" type="number"><input id="days" type="number" min="2" max="7"></div></div><div class="step" data-step="4"><p class="muted" data-en="Choose the muscle group you want to prioritize." data-ar="اختر المجموعة العضلية التي تريد إعطاءها أولوية."></p><div class="choices"><button class="choice" onclick="chooseMuscle(this,'Chest')" data-en="Chest" data-ar="الصدر"></button><button class="choice" onclick="chooseMuscle(this,'Back')" data-en="Back" data-ar="الظهر"></button><button class="choice" onclick="chooseMuscle(this,'Shoulders')" data-en="Shoulders" data-ar="الأكتاف"></button><button class="choice" onclick="chooseMuscle(this,'Legs')" data-en="Legs" data-ar="الأرجل"></button><button class="choice" onclick="chooseMuscle(this,'Arms')" data-en="Arms" data-ar="الذراعين"></button><button class="choice" onclick="chooseMuscle(this,'Core')" data-en="Core" data-ar="البطن والكور"></button></div></div><div class="step" data-step="5"><p class="muted" id="subHint"></p><div class="choices" id="subChoices"></div></div><div class="actions"><button class="secondary" id="back" onclick="move(-1)"></button><button class="primary" id="next" onclick="move(1)"></button></div></div></div><script>let lang=localStorage.getItem('gymLanguage')||'en',step=1,held=localStorage.getItem('gymHeld')==='1';let data=JSON.parse(localStorage.getItem('gymPlan')||'{}');const $=x=>document.getElementById(x),ar=()=>lang==='ar';const titles={en:['','What’s your training level?','What’s your main goal?','Tell us about your body & schedule','Which muscle do you want to prioritize?','Which area needs more focus?'],ar:['','ما هو مستواك في التمرين؟','ما هو هدفك الرئيسي؟','أخبرنا عن جسمك وجدولك','أي عضلة تريد إعطاءها أولوية؟','أي جزء تريد التركيز عليه أكثر؟']};const sub={Chest:[['Overall Chest','Overall chest','الصدر بالكامل'],['Upper Chest','Upper chest','الصدر العلوي'],['Mid Chest','Mid chest','منتصف الصدر'],['Lower Chest','Lower chest','الصدر السفلي']],Back:[['Overall Back','Overall back','الظهر بالكامل'],['Lats','Lats / width','اللاتس / العرض'],['Upper Back','Upper back','أعلى الظهر'],['Lower Back','Lower back','أسفل الظهر']],Shoulders:[['Overall Shoulders','Overall shoulders','الأكتاف بالكامل'],['Front Delts','Front delts','الأمامي'],['Side Delts','Side delts','الجانبي'],['Rear Delts','Rear delts','الخلفي']],Legs:[['Overall Legs','Overall legs','الأرجل بالكامل'],['Quads','Quads','الأمامية'],['Hamstrings','Hamstrings','الخلفية'],['Glutes','Glutes','المؤخرة'],['Calves','Calves','السمانة']],Arms:[['Overall Arms','Overall arms','الذراعين بالكامل'],['Biceps','Biceps','البايسبس'],['Triceps','Triceps','الترايسبس']],Core:[['Overall Core','Overall core','الكور بالكامل'],['Abs','Abs','البطن'],['Obliques','Obliques','الجوانب']]};const names={'Upper Chest':['Upper Chest','الصدر العلوي'],'Overall Chest':['Chest','الصدر'],'Mid Chest':['Mid Chest','منتصف الصدر'],'Lower Chest':['Lower Chest','الصدر السفلي'],Chest:['Chest','الصدر'],Back:['Back','الظهر'],Shoulders:['Shoulders','الأكتاف'],Legs:['Legs','الأرجل'],Arms:['Arms','الذراعين'],Core:['Core','الكور']};function t(v){return names[v]?names[v][ar()?1:0]:v}function applyLanguage(){document.body.classList.toggle('arabic',ar());$('lang').textContent=ar()?'English 🇬🇧':'العربية 🇦🇪';document.querySelectorAll('[data-en][data-ar]').forEach(e=>e.innerHTML=e.getAttribute(ar()?'data-ar':'data-en'));$('weight').placeholder=ar()?'الوزن (كجم)':'Weight (kg)';$('height').placeholder=ar()?'الطول (سم)':'Height (cm)';$('age').placeholder=ar()?'العمر':'Age';$('days').placeholder=ar()?'أيام التدريب في الأسبوع':'Training days / week';showStep();renderPlan()}function toggleLang(){lang=ar()?'en':'ar';localStorage.setItem('gymLanguage',lang);applyLanguage()}function openBuilder(){$('builder').classList.add('show');step=1;showStep()}function closeBuilder(){$('builder').classList.remove('show')}function pick(el,k,v){el.parentElement.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');data[k]=v}function chooseMuscle(el,v){pick(el,'muscle',v);data.focus=null}function renderSub(){let a=sub[data.muscle]||[];$('subHint').textContent=ar()?'اختر الجزء الذي تريد إعطاءه أولوية.':'Choose the area you want to prioritize.';$('subChoices').innerHTML=a.map(x=>'<button class="choice" onclick="pick(this,\'focus\',\''+x[0]+'\')">'+(ar()?x[2]:x[1])+'</button>').join('')}function move(n){if(step===3&&n>0){data.weight=$('weight').value;data.height=$('height').value;data.age=$('age').value;data.days=$('days').value}if(step===4&&n>0&&!data.muscle)return;if(step===5&&n>0){if(!data.focus)return;finishPlan();return}step=Math.max(1,Math.min(5,step+n));if(step===5)renderSub();showStep()}function showStep(){document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',+x.dataset.step===step));if(!$('stepTitle'))return;$('stepTitle').textContent=titles[lang][step];$('bar').style.width=(step/5*100)+'%';$('back').style.visibility=step===1?'hidden':'visible';$('back').textContent=ar()?'رجوع':'Back';$('next').textContent=step===5?(ar()?'جهّز جدولي ←':'CREATE MY PLAN →'):(ar()?'متابعة ←':'Continue →')}function finishPlan(){localStorage.setItem('gymPlan',JSON.stringify(data));closeBuilder();renderPlan();$('plan').scrollIntoView({behavior:'smooth',block:'start'})}function renderPlan(){let focus=data.focus||'Chest';$('focusTitle').innerHTML=(ar()?'تمرينك اليوم · ':'Today’s workout · ')+'<span class="red">'+t(focus)+'</span>';$('dayStatus').textContent=held?(ar()?'● مؤجل':'● ON HOLD'):(ar()?'● جاهز':'● READY');$('holdButton').textContent=held?(ar()?'↻ استئناف تمرين اليوم':'↻ RESUME TODAY'):(ar()?'⏸ تأجيل تمرين اليوم':'⏸ HOLD TODAY');$('holdButton').classList.toggle('active',held);let upper=focus==='Upper Chest';$('warmup').classList.toggle('show',!!data.focus);$('warmup').innerHTML=ar()?'<b>🔥 ابدأ بالإحماء أولاً</b><br><span class="muted">إحماء مناسب + مجموعات تمهيدية خفيفة قبل أول تمرين أساسي. ارفع الحمل تدريجياً ولا تبدأ بوزن ثقيل مباشرة.</span>':'<b>🔥 Warm up first</b><br><span class="muted">Use an appropriate warm-up and light ramp-up sets before the first working exercise. Increase load gradually rather than starting heavy.</span>';let ex=upper?[['Incline Press','ضغط صدر علوي','Dumbbell / Barbell / Machine','دمبل / بار / جهاز','4 × 8–10'],['Incline Fly','تفتيح علوي','Cable / Dumbbell','كيبل / دمبل','3 × 10–12'],['Flat Press','ضغط صدر مستوي','Barbell / Dumbbell / Machine','بار / دمبل / جهاز','3 × 8–10'],['Chest Fly','تفتيح صدر','Cable / Pec Deck','كيبل / بيك ديك','3 × 10–12']]:[['Incline Press','ضغط صدر علوي','Dumbbell / Barbell / Machine','دمبل / بار / جهاز','4 × 8–10'],['Chest Fly','تفتيح صدر','Cable / Dumbbell / Pec Deck','كيبل / دمبل / بيك ديك','3 × 10–12'],['Flat Press','ضغط صدر مستوي','Barbell / Dumbbell / Machine','بار / دمبل / جهاز','3 × 8–10']];$('exerciseList').innerHTML=ex.map(x=>'<div class="workout row"><div><b>'+(ar()?x[1]:x[0])+'</b><br><span class="muted">'+(ar()?x[3]:x[2])+'</span></div><b>'+x[4]+'</b></div>').join('')}function holdAction(){held=!held;localStorage.setItem('gymHeld',held?'1':'0');renderPlan()}applyLanguage();</script></body></html>
