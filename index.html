oday without changing your weekly plan. Resume whenever you are ready." data-ar="أجّل تمرين اليوم بدون ما يتغير جدولك الأسبوعي، واستأنف لما تكون جاهز."></p><button class="secondary" id="holdBtn" onclick="toggleHold()"></button></div><div class="hold" id="missedCheck" style="display:none"><b data-en="Did you train on your last scheduled day?" data-ar="تمرّنت في آخر يوم كان عندك فيه تمرين؟"></b><p class="muted" data-en="Confirm it so your workout history stays accurate." data-ar="أكد لنا عشان سجل تمارينك يظل مضبوطاً."></p><button class="primary" onclick="confirmMissed(true)" data-en="YES, I TRAINED" data-ar="نعم، تمرّنت"></button> <button class="secondary" onclick="confirmMissed(false)" data-en="NO, I DIDN'T" data-ar="لا، ما تمرّنت"></button></div><div class="planExercises" id="exerciseList"></div><br><button class="primary" onclick="openBuilder()" data-en="REBUILD MY PLAN" data-ar="إعادة بناء خطتي"></button></div></section><section class="cards"><div class="card link" role="link" tabindex="0" onclick="location.href='nutrition-v2.html'" onkeydown="if(event.key==='Enter')location.href='nutrition-v2.html'"><b data-en="◎ Nutrition" data-ar="◎ التغذية"></b><p class="muted" data-en="Smart calories, macros, food search & barcode." data-ar="سعرات وماكروز ذكية، بحث عن الطعام وباركود."></p></div><div class="card link" role="link" tabindex="0" onclick="location.href='progress.html'" onkeydown="if(event.key==='Enter')location.href='progress.html'"><b data-en="↗ Progress" data-ar="↗ التقدم"></b><p class="muted" data-en="Strength, records and consistency." data-ar="القوة والأرقام والاستمرارية."></p></div></section></main><div class="quickPicker" id="quickPicker"><div class="quickSheet"><div class="quickTop"><div><small class="red" id="quickEyebrow"></small><h2 id="quickTitle" style="margin:4px 0"></h2></div><button class="quickClose" onclick="closeQuickPicker()">×</button></div><div id="quickBody"></div></div></div><div class="modal" id="builder"><div class="sheet"><button class="close" onclick="closeBuilder()">×</button><small class="red" data-en="BUILD MY PLAN" data-ar="ابنِ خطتي"></small><h2 id="stepTitle"></h2><div class="progress"><i id="bar"></i></div><div class="step" data-step="1"><p class="muted" data-en="First, tell us your experience level." data-ar="أولاً، اختر مستواك الحالي في التمرين."></p><div class="choices"><button class="choice" onclick="pick(this,'level','Beginner')"><b data-en="Beginner" data-ar="مبتدئ"></b></button><button class="choice" onclick="pick(this,'level','Advanced')"><b data-en="Advanced" data-ar="متقدم"></b></button></div></div><div class="step" data-step="2"><p class="muted" data-en="What are you training for?" data-ar="ما هو هدفك الأساسي؟"></p><div class="choices"><button class="choice" onclick="pick(this,'goal','Muscle')" data-en="Build Muscle" data-ar="تضخيم وبناء العضلات"></button><button class="choice" onclick="pick(this,'goal','Cut')" data-en="Fat Loss / Cut" data-ar="تنشيف / خسارة الدهون"></button><button class="choice" onclick="pick(this,'goal','Strength')" data-en="Strength" data-ar="القوة"></button><button class="choice" onclick="pick(this,'goal','Maintain')" data-en="Maintain" data-ar="المحافظة"></button></div></div><div class="step" data-step="3"><p class="muted" data-en="Tell us about your body and training days." data-ar="أدخل بياناتك وعدد أيام التدريب أسبوعياً."></p><div class="fields"><input id="weight" type="number"><input id="height" type="number"><input id="age" type="number"><input id="days" type="number" min="2" max="6" readonly aria-readonly="true"></div><p class="muted" data-en="Choose your actual training days. Nutrition will follow this schedule automatically." data-ar="اختر أيام تدريبك الفعلية. التغذية ستتبع هذا الجدول تلقائياً."></p><div class="choices" id="trainingDayChoices"></div></div><div class="step" data-step="4"><p class="muted" id="splitHelp"></p><div class="splitgrid" id="splitChoices"></div></div><div class="actions"><button class="secondary" id="back" onclick="move(-1)">
