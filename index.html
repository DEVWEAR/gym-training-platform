<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYM Training</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07080a;color:#fff}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 85% 5%,#6a0b0b88,transparent 30%),linear-gradient(135deg,#050607,#111318);z-index:-1}.wrap{max-width:1150px;margin:auto;padding:20px}.nav,.row,.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.red{color:#ff3b3b}.muted{color:#92969f;line-height:1.55}.pill,.secondary{background:#ffffff09;border:1px solid #ffffff18;color:#fff;padding:11px 15px;border-radius:999px;cursor:pointer}.primary{border:0;background:#ed2c2c;color:#fff;padding:14px 19px;border-radius:13px;font-weight:800;cursor:pointer}.hero{padding:65px 0 30px;max-width:850px}.hero h1{font-size:clamp(48px,8vw,90px);line-height:.9;margin:15px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card,.panel,.choice{background:#111318;border:1px solid #ffffff12;border-radius:20px;padding:20px}.card{min-height:135px}.card.link{cursor:pointer;transition:.2s}.card.link:hover{transform:translateY(-3px);border-color:#ff3b3b55;background:#15171c}.card.link:after{content:'→';float:right;color:#ff3b3b;font-weight:900}.arabic .card.link:after{content:'←';float:left}.bottom{display:block;margin-bottom:30px}.status{color:#52e889}.workout{padding:17px 0;border-bottom:1px solid #ffffff0c}.warmup{padding:15px;margin:16px 0 12px;background:#2c220b;border:1px solid #f0ad2c55;border-radius:14px}.hold{padding:14px;margin:12px 0 18px;border:1px solid #ffffff12;border-radius:14px}.planExercises{margin-top:18px;padding-top:6px;border-top:1px solid #ffffff0c}.hiddenLegacy{display:none}.weekPlan{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:18px}.planDay{background:#0d0f12;border:1px solid #ffffff12;border-radius:16px;padding:16px;cursor:pointer;color:#fff;text-align:left}.planDay:hover{border-color:#ff3b3b66}.planDay b{display:block;margin:6px 0}.planDay small{color:#8f949d}.planPicked{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:999px;background:#ffffff08;font-size:12px}.planPicked.ready{color:#75f19a;background:#17351f}.startWorkout{display:inline-block;margin-top:9px;color:#fff;background:#ed2c2c;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:900}.arabic .planDay{text-align:right}.coach{margin:20px 0 60px;padding:28px;background:#101216;border:1px solid #ffffff14;border-radius:26px}.coachhead{display:flex;justify-content:space-between;gap:20px}.advanced{background:#3b1111;border:1px solid #ff3b3b66;color:#ff6565;border-radius:999px;padding:8px 13px;height:max-content;font-size:12px;font-weight:900}.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;direction:ltr;margin-top:20px}.coachday{background:#0d0f12;border:1px solid #ffffff12;border-radius:17px;padding:18px;min-height:140px}.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#111318;border:1px solid #ffffff20;border-radius:25px;padding:24px}.close{float:right;background:#ffffff0d;border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px}.progress{height:5px;background:#303239;border-radius:9px;margin:18px 0}.progress i{display:block;height:100%;background:#ed2c2c;border-radius:9px}.step{display:none}.step.active{display:block}.choices,.fields,.splitgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{color:#fff;text-align:left;cursor:pointer}.choice:hover{border-color:#ffffff35}.choice.selected{border-color:#ff3b3b;background:#351313}.choice small{display:block;margin-top:6px}.fields input{background:#090a0d;border:1px solid #ffffff18;color:#fff;padding:15px;border-radius:13px;font-size:16px;width:100%}.actions{display:flex;gap:10px;margin-top:20px}.focusGroup{border:1px solid #ffffff12;border-radius:18px;padding:15px;margin:12px 0}.focusGroup h3{margin:0 0 10px}.focusGroup .choices{grid-template-columns:repeat(2,1fr)}.hint{padding:12px 14px;background:#ffffff07;border-radius:12px;margin:10px 0}.arabic{text-align:right}.arabic .choice{text-align:right}.arabic .close{float:left}.arabic .week .coachday{direction:rtl;text-align:right}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.week{grid-template-columns:1fr}.choices,.fields,.splitgrid,.focusGroup .choices{grid-template-columns:1fr}.coachhead{flex-direction:column}}@media(max-width:560px){.wrap{padding:14px}.hero{padding-top:38px}.cards{grid-template-columns:1fr}.sheet{padding:18px}.actions{position:sticky;bottom:-24px;background:#111318;padding:12px 0 4px;z-index:2}.weekPlan{grid-template-columns:1fr}.planDay{min-height:118px}.primary,.secondary,.pill{min-height:44px}}</style></head><body><main class="wrap"><nav class="nav"><div class="brand"><span class="red">GYM</span> TRAINING</div><button class="pill" id="lang" onclick="toggleLang()"></button></nav><section class="hero"><small class="red" data-en="TRAIN SMARTER • GET STRONGER" data-ar="تدرّب بذكاء • كن أقوى"></small><h1 data-en="YOUR BODY.<br><span class='red'>YOUR PLAN.</span>" data-ar="جسمك.<br><span class='red'>خطتك.</span>"></h1><p class="muted" data-en="Training built around your level, goal, schedule and equipment." data-ar="تدريب مبني على مستواك وهدفك وجدولك والمعدات المتوفرة لك."></p><button class="primary" onclick="openBuilder()" data-en="BUILD MY PLAN →" data-ar="ابنِ خطتي ←"></button></section><section class="cards"><div class="card link" role="link" tabindex="0" onclick="location.href='exercises.html'" onkeydown="if(event.key==='Enter')location.href='exercises.html'"><b data-en="⚡ Exercises" data-ar="⚡ التمارين"></b><p class="muted" data-en="Smart library, visual guides, favorites & workout log." data-ar="مكتبة ذكية، شرح بصري، مفضلة وسجل أوزانك وعداتك."></p></div><div class="card link" role="link" tabindex="0" onclick="location.href='nutrition-v2.html'" onkeydown="if(event.key==='Enter')location.href='nutrition-v2.html'"><b data-en="◎ Nutrition" data-ar="◎ التغذية"></b><p class="muted" data-en="Smart calories, macros, food search & barcode." data-ar="سعرات وماكروز ذكية، بحث عن الطعام وباركود."></p></div><div class="card link" role="link" tabindex="0" onclick="location.href='progress.html'" onkeydown="if(event.key==='Enter')location.href='progress.html'"><b data-en="↗ Progress" data-ar="↗ التقدم"></b><p class="muted" data-en="Strength, records and consistency." data-ar="القوة والأرقام والاستمرارية."></p></div></section><section class="bottom" id="plan"><div class="panel"><div class="hiddenLegacy"><h2 id="focusTitle"></h2><span class="status" id="status"></span></div><h2 data-en="Your Plan" data-ar="خطتي"></h2><div id="planSummary" class="muted"></div><div class="warmup" id="warmup"></div><div class="hold"><b data-en="Not going to the gym today?" data-ar="ما بتروح الجم اليوم؟"></b><p class="muted" data-en="Hold today and move this workout to your next training day." data-ar="أجّل تمرين اليوم وانقله إلى يوم التدريب القادم."></p><button class="secondary" id="holdBtn" onclick="toggleHold()"></button></div><div class="hold" id="missedCheck" style="display:none"><b data-en="Did you train on your last scheduled day?" data-ar="تمرّنت في آخر يوم كان عندك فيه تمرين؟"></b><p class="muted" data-en="Confirm it so your workout sequence and nutrition stay accurate." data-ar="أكد لنا عشان ترتيب حصصك والتغذية يظلون مضبوطين."></p><button class="primary" onclick="confirmMissed(true)" data-en="YES, I TRAINED" data-ar="نعم، تمرّنت"></button> <button class="secondary" onclick="confirmMissed(false)" data-en="NO, I DIDN'T" data-ar="لا، ما تمرّنت"></button></div><div class="planExercises" id="exerciseList"></div><br><button class="primary" onclick="openBuilder()" data-en="REBUILD MY PLAN" data-ar="إعادة بناء خطتي"></button></div></section><section class="coach"><div class="coachhead"><div><small class="red" data-en="FOLLOW THE COACH" data-ar="تدرّب مع الكوتش"></small><h2 data-en="Coach's Weekly Workouts" data-ar="تمارين الكوتش الأسبوعية"></h2><p class="muted" data-en="Advanced coach routine from Sunday to Thursday. Exercises will be added later." data-ar="جدول الكوتش للمحترفين من الأحد إلى الخميس. سنضيف التمارين لاحقاً."></p></div><span class="advanced" data-en="ADVANCED • PRO" data-ar="للمحترفين • متقدم"></span></div><div class="week"><div class="coachday"><small data-en="SUNDAY" data-ar="الأحد"></small><h3 data-en="Chest" data-ar="الصدر"></h3></div><div class="coachday"><small data-en="MONDAY" data-ar="الاثنين"></small><h3 data-en="Back" data-ar="الظهر"></h3></div><div class="coachday"><small data-en="TUESDAY" data-ar="الثلاثاء"></small><h3 data-en="Shoulders" data-ar="الأكتاف"></h3></div><div class="coachday"><small data-en="WEDNESDAY" data-ar="الأربعاء"></small><h3 data-en="Arms" data-ar="الذراعين"></h3></div><div class="coachday"><small data-en="THURSDAY" data-ar="الخميس"></small><h3 data-en="Legs" data-ar="الأرجل"></h3></div></div></section></main><div class="modal" id="builder"><div class="sheet"><button class="close" onclick="closeBuilder()">×</button><small class="red" data-en="BUILD MY PLAN" data-ar="ابنِ خطتي"></small><h2 id="stepTitle"></h2><div class="progress"><i id="bar"></i></div><div class="step" data-step="1"><p class="muted" data-en="First, tell us your experience level." data-ar="أولاً، اختر مستواك الحالي في التمرين."></p><div class="choices"><button class="choice" onclick="pick(this,'level','Beginner')"><b data-en="Beginner" data-ar="مبتدئ"></b></button><button class="choice" onclick="pick(this,'level','Advanced')"><b data-en="Advanced" data-ar="متقدم"></b></button></div></div><div class="step" data-step="2"><p class="muted" data-en="What are you training for?" data-ar="ما هو هدفك الأساسي؟"></p><div class="choices"><button class="choice" onclick="pick(this,'goal','Muscle')" data-en="Build Muscle" data-ar="تضخيم وبناء العضلات"></button><button class="choice" onclick="pick(this,'goal','Cut')" data-en="Fat Loss / Cut" data-ar="تنشيف / خسارة الدهون"></button><button class="choice" onclick="pick(this,'goal','Strength')" data-en="Strength" data-ar="القوة"></button><button class="choice" onclick="pick(this,'goal','Maintain')" data-en="Maintain" data-ar="المحافظة"></button></div></div><div class="step" data-step="3"><p class="muted" data-en="Tell us about your body and training days." data-ar="أدخل بياناتك وعدد أيام التدريب أسبوعياً."></p><div class="fields"><input id="weight" type="number"><input id="height" type="number"><input id="age" type="number"><input id="days" type="number" min="2" max="6"></div><p class="muted" data-en="Choose your actual training days. Nutrition will follow this schedule automatically." data-ar="اختر أيام تدريبك الفعلية. التغذية ستتبع هذا الجدول تلقائياً."></p><div class="choices" id="trainingDayChoices"></div></div><div class="step" data-step="4"><p class="muted" id="splitHelp"></p><div class="splitgrid" id="splitChoices"></div></div><div class="step" data-step="5"><p class="muted" data-en="Would you like extra emphasis on any muscle areas?" data-ar="هل تريد إعطاء عضلات أو أجزاء معيّنة أولوية إضافية؟"></p><div class="choices"><button class="choice" onclick="setPriority(this,false)"><b data-en="Balanced plan" data-ar="لا، أريد جدول متوازن"></b><small class="muted" data-en="No extra emphasis." data-ar="بدون أولوية إضافية لعضلة معيّنة."></small></button><button class="choice" onclick="setPriority(this,true)"><b data-en="Yes, customize priorities" data-ar="نعم، أريد تخصيص الأولويات"></b><small class="muted" data-en="Choose one or more muscles and specific areas." data-ar="اختر عضلة واحدة أو أكثر وحدد الأجزاء التي تريد التركيز عليها."></small></button></div></div><div class="step" data-step="6"><p class="muted" data-en="Select all muscles you want to prioritize." data-ar="اختر كل العضلات التي تريد إعطاءها أولوية. يمكنك اختيار أكثر من عضلة."></p><div class="choices" id="muscleChoices"></div></div><div class="step" data-step="7"><p class="muted" data-en="Now choose the specific areas for each selected muscle. You can select more than one." data-ar="الحين حدد الأجزاء التي تريد التركيز عليها لكل عضلة. تقدر تختار أكثر من جزء."></p><div id="focusChoices"></div></div><div class="actions"><button class="secondary" id="back" onclick="move(-1)"></button><button class="primary" id="next" onclick="move(1)"></button></div></div></div><script>let lang=localStorage.getItem('gymLanguage')||'en',step=1,held=localStorage.getItem('gymHeld')==='1',data=JSON.parse(localStorage.getItem('gymPlan')||'{}');const $=x=>document.getElementById(x),ar=()=>lang==='ar';const weekDays=[['sun','Sunday','الأحد'],['mon','Monday','الاثنين'],['tue','Tuesday','الثلاثاء'],['wed','Wednesday','الأربعاء'],['thu','Thursday','الخميس'],['fri','Friday','الجمعة'],['sat','Saturday','السبت']];function renderTrainingDays(){let el=$('trainingDayChoices');if(!el)return;el.innerHTML=weekDays.map(d=>'<button type="button" class="choice '+((data.trainingDays||[]).includes(d[0])?'selected':'')+'" onclick="toggleTrainingDay(this,\''+d[0]+'\')">'+(ar()?d[2]:d[1])+'</button>').join('')}function toggleTrainingDay(btn,key){data.trainingDays=data.trainingDays||[];let i=data.trainingDays.indexOf(key);if(i>=0)data.trainingDays.splice(i,1);else{if(data.trainingDays.length>=6)return;data.trainingDays.push(key)}btn.classList.toggle('selected');data.days=data.trainingDays.length;$('days').value=data.days;if(data.split&&!validSplitDays(data.split,data.days))delete data.split;sessionStorage.setItem('gymBuilderDraft',JSON.stringify(data))}function todayTraining(){let keys=['sun','mon','tue','wed','thu','fri','sat'];return (data.trainingDays||[]).includes(keys[new Date().getDay()])}const titles={en:['','Training level','Your goal','Body & training days','Choose your workout split','Training priorities','Choose muscles','Choose target areas'],ar:['','مستواك التدريبي','هدفك','بياناتك وأيام التدريب','اختر نظام جدولك','أولويات التدريب','اختر العضلات','حدد الأجزاء المستهدفة']};const splits=[['Full Body','2–3','Balanced full-body sessions','تمرين كامل الجسم'],['Upper Lower','3–4','Upper and lower body rotation','تقسيم علوي وسفلي'],['Push Pull Legs (PPL)','3–6','Push, pull and legs rotation','دفع وسحب وأرجل'],['Upper Lower PPL','5','Upper/Lower combined with PPL','دمج نظامين'],['Arnold Split','6','Chest + back / shoulders + arms / legs','صدر وظهر / أكتاف وذراع / أرجل'],['Bro Split','5–6','Main muscle focus each session','عضلة رئيسية لكل حصة'],['Body Part Split','4–6','Flexible muscle-by-muscle structure','تقسيم حسب العضلات'],['Powerbuilding Split','4–5','Strength compounds + hypertrophy work','قوة مع تضخيم']];const muscles=[['Chest','الصدر'],['Back','الظهر'],['Shoulders','الأكتاف'],['Arms','الذراعين'],['Legs','الأرجل'],['Core','البطن والكور']];const focus={Chest:[['Upper Chest','الصدر العلوي'],['Mid Chest','منتصف الصدر'],['Lower Chest','الصدر السفلي']],Back:[['Lats','اللاتس / العرض'],['Upper Back','أعلى الظهر'],['Mid Back','منتصف الظهر'],['Lower Back','أسفل الظهر']],Shoulders:[['Front Delts','الأمامي'],['Side Delts','الجانبي'],['Rear Delts','الخلفي']],Arms:[['Biceps Long Head','بايسبس — الرأس الطويل'],['Biceps Short Head','بايسبس — الرأس القصير'],['Brachialis','البراكيالس'],['Triceps Long Head','ترايسبس — الرأس الطويل'],['Triceps Lateral Head','ترايسبس — الرأس الجانبي'],['Triceps Medial Head','ترايسبس — الرأس الإنسي']],Legs:[['Quads','الفخذ الأمامي'],['Hamstrings','الفخذ الخلفي'],['Glutes','المؤخرة'],['Calves','السمانة'],['Adductors','العضلات الداخلية']],Core:[['Abs','البطن'],['Obliques','الجوانب'],['Lower Abs','أسفل البطن']]};function applyLang(){document.body.classList.toggle('arabic',ar());$('lang').textContent=ar()?'English 🇬🇧':'العربية 🇦🇪';document.querySelectorAll('[data-en][data-ar]').forEach(e=>e.innerHTML=e.getAttribute(ar()?'data-ar':'data-en'));$('weight').placeholder=ar()?'الوزن (كجم)':'Weight (kg)';$('height').placeholder=ar()?'الطول (سم)':'Height (cm)';$('age').placeholder=ar()?'العمر':'Age';$('days').placeholder=ar()?'أيام التدريب (2–6)':'Training days (2–6)';showStep();renderPlan()}function toggleLang(){lang=ar()?'en':'ar';localStorage.setItem('gymLanguage',lang);applyLang()}function openBuilder(){let saved=JSON.parse(localStorage.getItem('gymPlan')||'{}'),draft=JSON.parse(sessionStorage.getItem('gymBuilderDraft')||'null');data=draft&&Object.keys(draft).length?draft:saved;data.muscles=data.muscles||[];data.focuses=data.focuses||{};step=1;$('builder').classList.add('show');showStep();restoreBuilder()}function restoreBuilder(){['weight','height','age','days'].forEach(k=>{if($(k)&&data[k]!=null)$(k).value=data[k]});document.querySelectorAll('.step .choice').forEach(el=>el.classList.remove('selected'));document.querySelectorAll('.step .choice').forEach(el=>{let oc=el.getAttribute('onclick')||'';if((data.level&&oc.includes("'level','"+data.level+"'"))||(data.goal&&oc.includes("'goal','"+data.goal+"'"))||(data.split&&oc.includes("'split','"+data.split+"'"))||(data.priority==='balanced'&&oc.includes('setPriority(this,false)'))||(data.priority==='custom'&&oc.includes('setPriority(this,true)')))el.classList.add('selected')});renderTrainingDays();$('builder').classList.add('show');showStep()}function closeBuilder(){$('builder').classList.remove('show');sessionStorage.setItem('gymBuilderDraft',JSON.stringify(data))}window.addEventListener('beforeunload',()=>{if($('builder')&&$('builder').classList.contains('show'))sessionStorage.setItem('gymBuilderDraft',JSON.stringify(data))});function pick(el,k,v){el.parentElement.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');data[k]=v}function setPriority(el,v){pick(el,'priority',v?'custom':'balanced');if(!v){data.muscles=[];data.focuses={}}}function toggleMuscle(el,m){data.muscles=data.muscles||[];let i=data.muscles.indexOf(m);if(i>=0){data.muscles.splice(i,1);delete(data.focuses||{})[m];el.classList.remove('selected')}else{data.muscles.push(m);el.classList.add('selected')}}function toggleFocus(el,m,f){data.focuses=data.focuses||{};data.focuses[m]=data.focuses[m]||[];let i=data.focuses[m].indexOf(f);if(i>=0){data.focuses[m].splice(i,1);el.classList.remove('selected')}else{data.focuses[m].push(f);el.classList.add('selected')}}function renderSplits(){let n=+(data.trainingDays||[]).length||+data.days||0,available=splits.filter(s=>!n||validSplitDays(s[0],n));if(data.split&&!available.some(s=>s[0]===data.split))delete data.split;$('splitHelp').innerHTML=ar()?('اختر نظاماً مناسباً لـ '+n+' أيام تدريب. أسماء الأنظمة تبقى بالإنجليزية.'):('Choose a workout split that fits your '+n+' training days.');$('splitChoices').innerHTML=available.map(s=>'<button class="choice '+(data.split===s[0]?'selected':'')+'" onclick="pick(this,\'split\',\''+s[0]+'\')"><b dir="ltr">'+s[0]+'</b><small class="muted">'+s[1]+' '+(ar()?'أيام':'days')+' • '+(ar()?s[3]:s[2])+'</small></button>').join('')}function renderMuscles(){$('muscleChoices').innerHTML=muscles.map(m=>'<button class="choice '+((data.muscles||[]).includes(m[0])?'selected':'')+'" onclick="toggleMuscle(this,\''+m[0]+'\')">'+(ar()?m[1]:m[0])+'</button>').join('')}function renderFocus(){let html='';(data.muscles||[]).forEach(m=>{let name=(muscles.find(x=>x[0]===m)||[m,m])[ar()?1:0];html+='<div class="focusGroup"><h3>'+name+'</h3><div class="choices">'+focus[m].map(f=>'<button class="choice '+(((data.focuses||{})[m]||[]).includes(f[0])?'selected':'')+'" onclick="toggleFocus(this,\''+m+'\',\''+f[0]+'\')">'+(ar()?f[1]:f[0])+'</button>').join('')+'</div></div>'});$('focusChoices').innerHTML=html}function move(n){if(n<0){step=Math.max(1,step-1);if(step===6)renderMuscles();showStep();return}if(step===1&&!data.level||step===2&&!data.goal)return;if(step===3){data.weight=$('weight').value;data.height=$('height').value;data.age=$('age').v function renderWeeklyPlan(){let box=$('exerciseList');if(!box)return;if(!data.split){box.innerHTML='';return}let sessions=planSessions(),names=Object.fromEntries(weekDays.map(x=>[x[0],ar()?x[2]:x[1]])),saved=JSON.parse(localStorage.getItem('devPlanExercises')||'{}');let cards=sessions.map(({day,label},i)=>{let sessionKey=day+'__'+label,cats=splitMuscles(label).join(','),url='exercises.html?plan=1&day='+encodeURIComponent(sessionKey)+'&label='+encodeURIComponent(label)+'&cats='+encodeURIComponent(cats),n=(saved[sessionKey]||[]).length;return '<button class="planDay" onclick="location.href=\''+url+'\'"><small>'+names[day]+'</small><b dir="ltr">'+label+'</b><span class="muted">'+(ar()?'اضغط واختر تمارينك بنفسك':'Tap to choose your exercises')+'</span><br><span class="planPicked '+(n?'ready':'')+'">'+(n?(ar()?n+' تمارين مختارة':n+' exercises selected')+'<br><span class="startWorkout" onclick="event.stopPropagation();location.href=\'workout.html?day=\'+encodeURIComponent(sessionKey)+\'&label=\'+encodeURIComponent(label)">'+(ar()?'ابدأ التمرين':'START WORKOUT')+'</span>':(ar()?'لم تختر تمارين بعد':'No exercises selected yet'))+'</span></button>'}).join('');box.innerHTML='<div class="weekPlan">'+cards+'</div>'}function localDate(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function lastScheduledBeforeToday(){let td=data.trainingDays||[];if(!td.length)return null,keys=['sun','mon','tue','wed','thu','fri','sat'],now=new Date();for(let n=1;n<=7;n++){let d=new Date(now);d.setDate(now.getDate()-n);if(td.includes(keys[d.getDay()]))return localDate(d)}return null}function completedWorkoutOn(date){let h=JSON.parse(localStorage.getItem('devWorkoutHistory')||'[]');return h.some(s=>{if(!s?.finished||!s.end)return false;let d=new Date(s.end);return !isNaN(d)&&localDate(d)===date&&(s.exercises||[]).some(e=>(e.done||[]).some(Boolean))})}function checkMissedWorkout(){let box=$('missedCheck');if(!box)return;let state=JSON.parse(localStorage.getItem('gymScheduleState')||'{}'),last=lastScheduledBeforeToday();if(last&&completedWorkoutOn(last)){if(state.lastCompleted!==last){state.lastCompleted=last;state.lastPromptDate=last;localStorage.setItem('gymScheduleState',JSON.stringify(state))}box.style.display='none';return}box.style.display=last&&state.lastCompleted!==last&&state.lastPromptDate!==last&&!state.heldDate?'block':'none'}function confirmMissed(didTrain){let state=JSON.parse(localStorage.getItem('gymScheduleState')||'{}'),last=lastScheduledBeforeToday();if(!last)return;if(didTrain){let seq=workoutSequence();state.workoutIndex=(Math.max(0,+state.workoutIndex||0)+1)%seq.length;state.lastCompleted=last}else{state.heldDate=last;state.shift=1}state.lastPromptDate=last;localStorage.setItem('gymScheduleState',JSON.stringify(state));renderPlan()}function toggleHold(){let keys=['sun','mon','tue','wed','thu','fri','sat'],today=keys[new Date().getDay()],scheduled=(data.trainingDays||[]).includes(today),state=JSON.parse(localStorage.getItem('gymScheduleState')||'{}');held=!held;localStorage.setItem('gymHeld',held?'1':'0');if(held&&scheduled){state.heldDate=localDate();state.shift=1;state.workoutIndex=Math.max(0,+state.workoutIndex||0);localStorage.setItem('gymScheduleState',JSON.stringify(state))}else if(!held){delete state.heldDate;state.shift=0;localStorage.setItem('gymScheduleState',JSON.stringify(state))}renderPlan()}applyLang();</script></body></html>
