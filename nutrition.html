<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYM Nutrition</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07080a;color:#fff}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 90% 0,#6a0b0b88,transparent 30%),linear-gradient(135deg,#050607,#111318);z-index:-1}.wrap{max-width:1100px;margin:auto;padding:20px}.nav,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:2px}.red{color:#ff3b3b}.muted{color:#92969f;line-height:1.55}.btn,.pill{border:1px solid #ffffff18;background:#ffffff09;color:#fff;padding:12px 16px;border-radius:13px;cursor:pointer}.primary{background:#ed2c2c;border:0;font-weight:800}.hero{padding:48px 0 20px}.hero h1{font-size:clamp(42px,7vw,74px);margin:10px 0}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.card{background:#111318;border:1px solid #ffffff12;border-radius:22px;padding:20px;margin-bottom:14px}.ring{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;margin:12px auto;background:conic-gradient(#ed2c2c var(--p),#292c31 0);position:relative}.ring:after{content:"";position:absolute;width:168px;height:168px;border-radius:50%;background:#111318}.ringText{z-index:1;text-align:center}.ringText strong{font-size:34px}.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.macro{background:#0b0d10;border-radius:15px;padding:14px}.bar{height:7px;background:#292c31;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:#ed2c2c}.coach{border-color:#ff3b3b55;background:linear-gradient(135deg,#201010,#111318)}.meals .meal{padding:14px 0;border-bottom:1px solid #ffffff0c}.setup{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:18px;z-index:10}.setup.show{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#111318;border:1px solid #ffffff20;border-radius:24px;padding:24px}.fields,.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields input,.fields select{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff18;background:#090a0d;color:#fff}.choice{padding:15px;border-radius:14px;border:1px solid #ffffff18;background:#0b0d10;color:#fff;cursor:pointer}.choice.on{border-color:#ed2c2c;background:#351313}.quick{display:flex;gap:8px;flex-wrap:wrap}.arabic{text-align:right}@media(max-width:760px){.grid,.fields,.choices{grid-template-columns:1fr}.macros{grid-template-columns:1fr}.ring{width:185px;height:185px}.ring:after{width:145px;height:145px}}</style></head><body><main class="wrap"><nav class="nav"><div class="brand"><span class="red">GYM</span> NUTRITION</div><div><button class="pill" onclick="location.href='index.html'" data-en="← Training" data-ar="التدريب →"></button> <button class="pill" id="lang" onclick="toggleLang()"></button></div></nav><section class="hero"><small class="red" data-en="SMART NUTRITION COACH" data-ar="مدرب التغذية الذكي"></small><h1 data-en="EAT FOR YOUR <span class='red'>GOAL.</span>" data-ar="كُل حسب <span class='red'>هدفك.</span>"></h1><p class="muted" data-en="Calories, macros, meals and weekly adjustments that work with your training." data-ar="سعرات وماكروز ووجبات وتعديلات أسبوعية مرتبطة بتمرينك."></p></section><div class="grid"><div><section class="card"><div class="row"><div><small class="muted" data-en="TODAY" data-ar="اليوم"></small><h2 data-en="Daily target" data-ar="هدفك اليومي"></h2></div><button class="btn" onclick="openSetup()" data-en="Edit goal" data-ar="تعديل الهدف"></button></div><div class="ring" id="ring"><div class="ringText"><strong id="calUsed">0</strong><div class="muted">/ <span id="calTarget">2400</span> kcal</div></div></div><div class="macros" id="macros"></div></section><section class="card meals"><div class="row"><h2 data-en="Today's meals" data-ar="وجبات اليوم"></h2><button class="btn primary" onclick="addFood()" data-en="+ Add Food" data-ar="+ إضافة طعام"></button></div><div id="mealList"></div><div class="quick"><button class="btn" onclick="copyYesterday()" data-en="Copy yesterday" data-ar="نسخ أمس"></button><button class="btn" onclick="saveMeal()" data-en="Save meal" data-ar="حفظ وجبة"></button><button class="btn" onclick="water()" data-en="+ Water" data-ar="+ ماء"></button></div></section></div><div><section class="card coach"><small class="red">DEV NUTRITION COACH</small><h2 id="coachTitle"></h2><p class="muted" id="coachText"></p><button class="btn primary" onclick="buildMeal()" data-en="BUILD MY NEXT MEAL" data-ar="ابنِ وجبتي القادمة"></button></section><section class="card"><h2 data-en="Smart meal builder" data-ar="بناء الوجبة الذكي"></h2><p class="muted" id="remaining"></p><div class="quick"><button class="btn" data-en="Quick meal" data-ar="وجبة سريعة"></button><button class="btn" data-en="Home cooked" data-ar="طبخ البيت"></button><button class="btn" data-en="Pre-workout" data-ar="قبل التمرين"></button><button class="btn" data-en="Post-workout" data-ar="بعد التمرين"></button></div><div id="suggestion"></div></section><section class="card"><h2 data-en="Weekly body trend" data-ar="اتجاه الوزن الأسبوعي"></h2><p class="muted" data-en="We use your weekly average — not one day's scale weight — before suggesting calorie changes." data-ar="نعتمد متوسط وزنك الأسبوعي، وليس وزن يوم واحد، قبل اقتراح تعديل السعرات."></p><div class="row"><span data-en="This week" data-ar="هذا الأسبوع"></span><b id="trend">—</b></div><button class="btn" onclick="logWeight()" data-en="Log weight" data-ar="تسجيل الوزن"></button></section></div></div></main><div class="setup" id="setup"><div class="sheet"><div class="row"><div><small class="red" data-en="NUTRITION SETUP" data-ar="إعداد التغذية"></small><h2 data-en="Build my nutrition target" data-ar="ابنِ هدفي الغذائي"></h2></div><button class="pill" onclick="closeSetup()">×</button></div><p class="muted" data-en="This gives you a starting estimate. Your real weight trend can refine it over time." data-ar="هذا تقدير مبدئي، ويمكن لاتجاه وزنك الفعلي تحسينه مع الوقت."></p><div class="fields"><input id="weight" type="number"><input id="height" type="number"><input id="age" type="number"><select id="sex"><option value="male">Male / ذكر</option><option value="female">Female / أنثى</option></select><select id="activity"><option value="1.2">Sedentary / قليل الحركة</option><option value="1.375">Light / خفيف</option><option value="1.55" selected>Moderate / متوسط</option><option value="1.725">Very active / عالي</option></select><input id="days" type="number" min="0" max="7"></div><h3 data-en="Goal" data-ar="الهدف"></h3><div class="choices"><button class="choice" onclick="goal(this,'cut')" data-en="Fat loss / Cut" data-ar="تنشيف / خسارة الدهون"></button><button class="choice" onclick="goal(this,'muscle')" data-en="Build muscle" data-ar="بناء العضلات"></button><button class="choice" onclick="goal(this,'maintain')" data-en="Maintain" data-ar="المحافظة"></button></div><br><button class="btn primary" onclick="calculate()" data-en="CREATE MY TARGET" data-ar="إنشاء هدفي"></button></div></div><script>let lang=localStorage.getItem('gymLanguage')||'en',profile=JSON.parse(localStorage.getItem('nutritionProfile')||'null'),foods=JSON.parse(localStorage.getItem('nutritionFoods')||'[]'),waterCount=+(localStorage.getItem('nutritionWater')||0),selectedGoal='maintain';const $=x=>document.getElementById(x),ar=()=>lang==='ar';function toggleLang(){lang=ar()?'en':'ar';localStorage.setItem('gymLanguage',lang);render()}function render(){document.documentElement.lang=lang;document.body.dir=ar()?'rtl':'ltr';document.body.classList.toggle('arabic',ar());document.querySelectorAll('[data-en]').forEach(e=>e.innerHTML=e.dataset[lang]);$('lang').textContent=ar()?'English':'العربية';$('weight').placeholder=ar()?'الوزن كجم':'Weight kg';$('height').placeholder=ar()?'الطول سم':'Height cm';$('age').placeholder=ar()?'العمر':'Age';$('days').placeholder=ar()?'حصص الجيم أسبوعياً':'Gym sessions / week';renderDashboard()}function openSetup(){$('setup').classList.add('show')}function closeSetup(){$('setup').classList.remove('show')}function goal(el,g){selectedGoal=g;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));el.classList.add('on')}function calculate(){let w=+$('weight').value,h=+$('height').value,a=+$('age').value;if(!w||!h||!a)return alert(ar()?'أدخل الوزن والطول والعمر':'Enter weight, height and age');let b=10*w+6.25*h-5*a+($('sex').value==='male'?5:-161),t=b*(+$('activity').value);if(selectedGoal==='cut')t-=400;if(selectedGoal==='muscle')t+=250;t=Math.round(t/10)*10;let protein=Math.round(w*(selectedGoal==='cut'?2:1.8)),fat=Math.round(w*.8),carbs=Math.max(0,Math.round((t-protein*4-fat*9)/4));profile={cal:t,protein,fat,carbs,goal:selectedGoal,weight:w};localStorage.setItem('nutritionProfile',JSON.stringify(profile));closeSetup();render()}function totals(){return foods.reduce((a,f)=>({cal:a.cal+f.cal,p:a.p+f.p,c:a.c+f.c,f:a.f+f.f}),{cal:0,p:0,c:0,f:0})}function renderDashboard(){if(!profile){profile={cal:2400,protein:180,carbs:260,fat:70,goal:'maintain'};setTimeout(openSetup,300)}let t=totals(),pct=Math.min(100,Math.round(t.cal/profile.cal*100));$('calUsed').textContent=t.cal;$('calTarget').textContent=profile.cal;$('ring').style.setProperty('--p',pct+'%');let vals=[['Protein','البروتين',t.p,profile.protein,'g'],['Carbs','الكارب',t.c,profile.carbs,'g'],['Fat','الدهون',t.f,profile.fat,'g']];$('macros').innerHTML=vals.map(v=>`<div class="macro"><b>${ar()?v[1]:v[0]}</b><div>${v[2]} / ${v[3]}${v[4]}</div><div class="bar"><i style="width:${Math.min(100,v[2]/v[3]*100)}%"></i></div></div>`).join('');$('mealList').innerHTML=foods.length?foods.map((f,i)=>`<div class="meal row"><div><b>${f.name}</b><div class="muted">${f.cal} kcal • P ${f.p} • C ${f.c} • F ${f.f}</div></div><button class="pill" onclick="removeFood(${i})">×</button></div>`).join(''):`<p class="muted">${ar()?'ما سجلت أي وجبة للحين.':'No meals logged yet.'}</p>`;let rem={cal:Math.max(0,profile.cal-t.cal),p:Math.max(0,profile.protein-t.p),c:Math.max(0,profile.carbs-t.c),f:Math.max(0,profile.fat-t.f)};$('remaining').textContent=ar()?`باقي لك تقريباً ${rem.cal} سعرة • ${rem.p}g بروتين • ${rem.c}g كارب • ${rem.f}g دهون`:`About ${rem.cal} kcal left • ${rem.p}g protein • ${rem.c}g carbs • ${rem.f}g fat`;$('coachTitle').textContent=ar()?'قرار الوجبة القادمة':'Your next-meal decision';$('coachText').textContent=rem.p>rem.f*2?(ar()?'باقي لك بروتين أكثر من الدهون. خل الوجبة القادمة عالية البروتين وأقل دهوناً.':'You have relatively more protein left than fat. Make the next meal protein-forward and leaner.'):(ar()?'أرقامك متوازنة حالياً. كمل يومك بدون تغييرات حادة.':'Your numbers are balanced so far. Keep the rest of the day steady.')}function addFood(){let name=prompt(ar()?'اسم الطعام':'Food name');if(!name)return;let cal=+(prompt(ar()?'السعرات':'Calories')||0),p=+(prompt(ar()?'البروتين g':'Protein g')||0),c=+(prompt(ar()?'الكارب g':'Carbs g')||0),f=+(prompt(ar()?'الدهون g':'Fat g')||0);foods.push({name,cal,p,c,f});saveFoods()}function removeFood(i){foods.splice(i,1);saveFoods()}function saveFoods(){localStorage.setItem('nutritionFoods',JSON.stringify(foods));renderDashboard()}function buildMeal(){let t=totals(),p=Math.max(0,profile.protein-t.p),c=Math.max(0,profile.carbs-t.c),f=Math.max(0,profile.fat-t.f);$('suggestion').innerHTML=`<div class="card" style="margin-top:12px"><b>${ar()?'اقتراح ذكي':'Smart suggestion'}</b><p class="muted">${ar()?`اختر مصدر بروتين قليل الدهون + مصدر كارب، واضبط الكمية باتجاه المتبقي: ${p}g بروتين، ${c}g كارب، ${f}g دهون. لا تعتبر تقدير الوجبة قياساً دقيقاً.`:`Choose a lean protein + carb source and size the portions toward your remaining ${p}g protein, ${c}g carbs and ${f}g fat. Treat meal estimates as estimates, not exact measurements.`}</p></div>`}function logWeight(){let w=+(prompt(ar()?'وزنك اليوم بالكيلو':'Today weight in kg')||0);if(!w)return;let arr=JSON.parse(localStorage.getItem('nutritionWeights')||'[]');arr.push({w,date:new Date().toISOString()});localStorage.setItem('nutritionWeights',JSON.stringify(arr));let recent=arr.slice(-7);$('trend').textContent=(recent.reduce((s,x)=>s+x.w,0)/recent.length).toFixed(1)+' kg avg'}function water(){waterCount++;localStorage.setItem('nutritionWater',waterCount);alert((ar()?'أكواب الماء المسجلة اليوم: ':'Water logged today: ')+waterCount)}function copyYesterday(){alert(ar()?'بنربط سجل الأيام الكامل في المرحلة القادمة.':'Full day-history linking is coming in the next stage.')}function saveMeal(){alert(ar()?'ميزة الوجبات المحفوظة جاهزة للربط مع قاعدة البيانات لاحقاً.':'Saved meals will connect to the database in the next stage.')}render();</script></body></html>
