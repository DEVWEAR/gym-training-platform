<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Workouts · DEV Training</title><style>*{box-sizing:border-box}body{margin:0;background:#060709;color:#fff;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 80% 0,#8b171738,transparent 30%),linear-gradient(160deg,#060709,#0b0d11)}.wrap{max-width:980px;margin:auto;padding:18px}.nav{display:flex;justify-content:space-between;align-items:center;position:sticky;top:10px;padding:12px 14px;background:#090b0edb;border:1px solid #ffffff14;border-radius:18px;backdrop-filter:blur(18px)}button{border:1px solid #ffffff18;background:#15181e;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800}.red{color:#ff3838}.hero{padding:60px 4px 28px}.hero h1{font-size:clamp(46px,8vw,78px);letter-spacing:-3px;margin:6px 0}.muted{color:#969aa5}.week{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.day{background:linear-gradient(145deg,#13151a,#0d0f13);border:1px solid #ffffff14;border-radius:20px;padding:22px;min-height:140px}.day small{color:#ff4b4b;font-weight:900}.day h2{margin:8px 0;font-size:26px}@media(max-width:560px){.wrap{padding:10px}.week{grid-template-columns:1fr}.hero{padding:44px 3px 22px}}</style></head><body><main class="wrap"><nav class="nav"><b><span class="red">DEV</span> TRAINING</b><div><button onclick="location.href='index.html'" id="home">Home</button> <button onclick="toggleLang()" id="lang">العربية</button></div></nav><section class="hero"><small class="red" id="eyebrow">FOLLOW THE COACH</small><h1 id="title">Coach Workouts</h1><p class="muted" id="intro">Advanced weekly training routine from the coach.</p></section><section class="week" id="week"></section></main><script>let lang=localStorage.getItem('gymLanguage')||'en';const days=[['Sunday','الأحد','Chest','الصدر'],['Monday','الاثنين','Back','الظهر'],['Tuesday','الثلاثاء','Shoulders','الأكتاف'],['Wednesday','الأربعاء','Arms','الذراعين'],['Thursday','الخميس','Legs','الأرجل']];function ar(){return lang==='ar'}function draw(){document.body.dir=ar()?'rtl':'ltr';document.getElementById('lang').textContent=ar()?'English':'العربية';document.getElementById('home').textContent=ar()?'الرئيسية':'Home';document.getElementById('eyebrow').textContent=ar()?'تدرّب مع الكوتش':'FOLLOW THE COACH';document.getElementById('title').textContent=ar()?'تمارين الكوتش':'Coach Workouts';document.getElementById('intro').textContent=ar()?'جدول تدريبي متقدم من الكوتش.':'Advanced weekly training routine from the coach.';document.getElementById('week').innerHTML=days.map(d=>'<article class="day"><small>'+(ar()?d[1]:d[0])+'</small><h2>'+(ar()?d[3]:d[2])+'</h2><span class="muted">'+(ar()?'سنضيف تفاصيل التمارين هنا.':'Workout details will be added here.')+'</span></article>').join('')}function toggleLang(){lang=ar()?'en':'ar';localStorage.setItem('gymLanguage',lang);draw()}draw();</script></body></html>
