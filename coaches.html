<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEV Coaches</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060708;color:#fff;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 75% 0,#8b14142f,transparent 30%),linear-gradient(160deg,#050607,#0d0f13);z-index:-1}.wrap{max-width:1180px;margin:auto;padding:18px}.nav{position:sticky;top:10px;z-index:5;display:flex;justify-content:space-between;align-items:center;background:#0a0c0fe8;border:1px solid #ffffff14;border-radius:18px;padding:12px 14px;backdrop-filter:blur(16px)}.brand{font-weight:900;letter-spacing:2px}.red{color:#ff3939}.btn{border:1px solid #ffffff18;background:#ffffff09;color:#fff;border-radius:999px;padding:11px 15px;cursor:pointer}.hero{padding:70px 4px 35px}.hero small{font-weight:900;letter-spacing:1.4px}.hero h1{font-size:clamp(44px,8vw,82px);line-height:.94;margin:12px 0;letter-spacing:-2px}.hero p{color:#9ca1aa;max-width:680px;line-height:1.7;font-size:17px}.search{display:flex;gap:10px;margin:10px 0 24px}.search input{flex:1;background:#101216;border:1px solid #ffffff16;color:#fff;padding:16px;border-radius:16px;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.chip{white-space:nowrap;border:1px solid #ffffff16;background:#0e1014;color:#b7bbc3;padding:10px 14px;border-radius:999px;cursor:pointer}.chip.on{border-color:#ff3939;color:#fff;background:#331112}.sectionTop{display:flex;align-items:end;justify-content:space-between;margin:28px 0 14px}.sectionTop h2{margin:0;font-size:28px}.sectionTop span{color:#888e98;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.coach{position:relative;min-height:390px;border:1px solid #ffffff13;border-radius:25px;overflow:hidden;background:linear-gradient(145deg,#14161b,#0b0d10);cursor:pointer;transition:.2s}.coach:hover{transform:translateY(-4px);border-color:#ff393955}.visual{height:235px;background:radial-gradient(circle at 50% 30%,#373b42,#111318 60%);display:grid;place-items:center;position:relative}.avatar{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900;background:#181b20;border:1px solid #ffffff20;box-shadow:0 0 0 10px #ffffff05}.tag{position:absolute;top:14px;right:14px;background:#090a0dcc;border:1px solid #ffffff18;border-radius:999px;padding:8px 10px;font-size:11px}.info{padding:19px}.info h3{margin:0 0 7px;font-size:22px}.info p{margin:0;color:#979ca6;line-height:1.5}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.meta span{font-size:11px;background:#ffffff08;border:1px solid #ffffff10;border-radius:999px;padding:7px 9px}.empty{grid-column:1/-1;border:1px dashed #ffffff20;border-radius:24px;padding:45px 20px;text-align:center;color:#969ba5}.empty b{display:block;color:#fff;font-size:22px;margin-bottom:8px}.feature{margin:40px 0 60px;padding:25px;border:1px solid #ffffff13;border-radius:26px;background:linear-gradient(130deg,#17191e,#0c0e11)}.feature h2{margin:0 0 8px}.feature p{color:#999fa8;line-height:1.6}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.step{background:#090b0e;border:1px solid #ffffff10;border-radius:17px;padding:17px}.step i{font-style:normal;color:#ff4242;font-weight:900}.step b{display:block;margin:8px 0}.step small{color:#8e949e}.ltr{direction:ltr;text-align:left}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:12px}.hero{padding:48px 3px 25px}.grid{grid-template-columns:1fr}.visual{height:210px}.coach{min-height:350px}}
</style></head>
<body><main class="wrap">
<nav class="nav"><div class="brand"><span class="red">DEV</span> COACHES</div><div><button class="btn" onclick="location.href='index.html'">الرئيسية</button> <button class="btn" id="lang" onclick="toggleLang()">EN</button></div></nav>
<section class="hero"><small class="red" data-ar="تدريب حقيقي. بطريقتك." data-en="REAL COACHING. YOUR WAY."></small><h1 data-ar="مدربك.<br><span class='red'>رحلتك.</span>" data-en="YOUR COACH.<br><span class='red'>YOUR JOURNEY.</span>"></h1><p data-ar="مو مجرد جدول جاهز. اكتشف المدرب المناسب لهدفك، تعرّف على أسلوبه، واختر البرنامج اللي يناسب مستواك وحياتك." data-en="More than a generic plan. Discover a coach who fits your goal, understand their style, and choose a program built for your level and lifestyle."></p></section>
<div class="search"><input id="q" oninput="render()" placeholder="ابحث عن مدرب أو تخصص..."></div>
<div class="chips" id="chips"></div>
<div class="sectionTop"><h2 id="title">اكتشف المدربين</h2><span id="count"></span></div>
<section class="grid" id="grid"></section>
<section class="feature"><small class="red" data-ar="DEV COACH MATCH" data-en="DEV COACH MATCH"></small><h2 data-ar="ما تعرف أي مدرب يناسبك؟" data-en="Not sure who fits you?"></h2><p data-ar="لاحقاً DEV يطابق هدفك، خبرتك، أيام تدريبك وتفضيلاتك مع المدرب والبرنامج الأنسب لك — بدون ما تضيع بين عشرات الخيارات." data-en="DEV will match your goal, experience, schedule and preferences with the right coach and program—without making you browse endless options."></p><div class="steps"><div class="step"><i>01</i><b data-ar="حدد هدفك" data-en="Set your goal"></b><small data-ar="عضل، تنشيف، قوة أو تحسين اللياقة." data-en="Muscle, fat loss, strength or fitness."></small></div><div class="step"><i>02</i><b data-ar="DEV يطابقك" data-en="DEV matches you"></b><small data-ar="نقارن احتياجك بتخصصات المدربين." data-en="We compare your needs with coach specialties."></small></div><div class="step"><i>03</i><b data-ar="ابدأ مع مدربك" data-en="Start with your coach"></b><small data-ar="برنامج واضح ومتابعة في مكان واحد." data-en="Your program and progress in one place."></small></div></div></section>
</main>
<script>
let lang=localStorage.getItem('gymLanguage')||'ar',filter='all';
const coaches=[]; // Real coaches will be added here from the admin system.
const cats=[['all','الكل','All'],['muscle','بناء العضلات','Muscle Building'],['fat','خسارة الدهون','Fat Loss'],['strength','القوة','Strength'],['women','تدريب النساء','Women'],['nutrition','التغذية','Nutrition']];
function t(ar,en){return lang==='ar'?ar:en}
function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.classList.toggle('ltr',lang==='en');document.querySelectorAll('[data-ar]').forEach(x=>x.innerHTML=x.dataset[lang]);document.getElementById('lang').textContent=lang==='ar'?'EN':'ع';document.getElementById('q').placeholder=t('ابحث عن مدرب أو تخصص...','Search coach or specialty...');document.getElementById('title').textContent=t('اكتشف المدربين','Discover coaches');renderChips();render()}
function renderChips(){document.getElementById('chips').innerHTML=cats.map(c=>'<button class="chip '+(filter===c[0]?'on':'')+'" onclick="filter=\''+c[0]+'\';renderChips();render()">'+(lang==='ar'?c[1]:c[2])+'</button>').join('')}
function render(){let q=document.getElementById('q').value.toLowerCase(),xs=coaches.filter(c=>(filter==='all'||c.tags.includes(filter))&&(!q||(c.name+' '+c.specialty).toLowerCase().includes(q)));document.getElementById('count').textContent=xs.length?t(xs.length+' مدرب',xs.length+' coaches'):'';document.getElementById('grid').innerHTML=xs.length?xs.map(c=>'<article class="coach"><div class="visual"><div class="avatar">'+c.name[0]+'</div><span class="tag">'+c.specialty+'</span></div><div class="info"><h3>'+c.name+'</h3><p>'+c.bio+'</p><div class="meta">'+c.tags.map(x=>'<span>'+x+'</span>').join('')+'</div></div></article>').join(''):'<div class="empty"><b>'+t('مدربو DEV قريباً','DEV Coaches coming soon')+'</b>'+t('نبني شبكة مدربين مختارين بعناية. الصفحة جاهزة، ونضيف المدربين الحقيقيين فقط عند الاتفاق معهم.','We are building a carefully selected coaching network. The experience is ready, and only real approved coaches will appear here.')+'</div>'}
function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('gymLanguage',lang);apply()}apply();
</script></body></html>
