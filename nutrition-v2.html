<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV Nutrition Coach</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#fff;font-family:Arial,sans-serif}.w{max-width:1100px;margin:auto;padding:20px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.red{color:#ff3b3b}.muted{color:#9a9da5}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card{background:#121419;border:1px solid #ffffff12;border-radius:20px;padding:18px;margin:12px 0}.btn,input,select{background:#0b0d10;color:#fff;border:1px solid #ffffff1c;border-radius:12px;padding:12px}.btn{cursor:pointer}.primary{background:#e52d2d;border:0;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#0b0d10;border-radius:14px;padding:13px}.bar{height:6px;background:#292c31;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#e52d2d}.meal{padding:12px 0;border-bottom:1px solid #ffffff0c}.quick{display:flex;gap:8px;flex-wrap:wrap}.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.sheet{width:min(650px,100%);background:#121419;border-radius:22px;padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{background:#251616;border:1px solid #ff3b3b44;padding:13px;border-radius:13px}.en{direction:ltr;text-align:left}@media(max-width:760px){.grid,.fields,.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="top"><b><span class="red">DEV</span> NUTRITION COACH</b><div><button class="btn" onclick="location.href='index.html'">⌂</button> <button class="btn" onclick="lang()" id="lng">English</button></div></div><section class="card"><div class="top"><div><small class="red" id="dayType"></small><h1 id="hello">تغذيتك اليوم</h1></div><button class="btn" onclick="setup()" id="edit">تعديل الهدف</button></div><div class="stats" id="stats"></div></section><div class="grid"><div><section class="card"><div class="top"><h2 id="mealsT">وجبات اليوم</h2><button class="btn primary" onclick="addFood()" id="add">+ إضافة طعام</button></div><div id="meals"></div><div class="quick"><button class="btn" onclick="copyYesterday()" id="copy">نسخ أمس</button><button class="btn" onclick="saveCurrentMeal()" id="save">حفظ كوجبة</button><button class="btn" onclick="showSaved()" id="saved">وجباتي المحفوظة</button></div></section><section class="card"><div class="top"><h2 id="waterT">الماء والألياف</h2><button class="btn" onclick="water()">+ 💧</button></div><div id="hydration"></div></section></div><div><section class="card"><small class="red">DEV SMART COACH</small><h2 id="coachH"></h2><p class="muted" id="coach"></p><button class="btn primary" onclick="mealBuilder()" id="build">ابنِ وجبتي القادمة</button><div id="idea"></div></section><section class="card"><h2 id="weightT">متوسط الوزن الأسبوعي</h2><div class="top"><b id="avg">—</b><button class="btn" onclick="logWeight()" id="log">تسجيل الوزن</button></div><p class="muted" id="adjust"></p><button class="btn" id="applyAdj" style="display:none" onclick="applyAdjustment()"></button></section><section class="card"><h2 id="historyT">السجل</h2><div id="history"></div></section></div></div><p class="muted" id="safe">الأرقام تقديرية وليست بديلاً عن مختص تغذية، ولا يتم تعديل السعرات تلقائياً بدون موافقتك.</p></main><div class="modal" id="modal"><div class="sheet"><div class="top"><h2 id="setupT">إعداد التغذية</h2><button class="btn" onclick="closeM()">×</button></div><div class="fields"><input id="w" type="number" placeholder="الوزن كجم"><input id="h" type="number" placeholder="الطول سم"><input id="a" type="number" placeholder="العمر"><select id="sex"><option value="m">ذكر</option><option value="f">أنثى</option></select><select id="act"><option value="1.2">قليل الحركة</option><option value="1.375">نشاط خفيف</option><option value="1.55">نشاط متوسط</option><option value="1.725">نشاط عالٍ</option></select><select id="goal"><option value="cut">تنشيف</option><option value="maintain">محافظة</option><option value="gain">بناء عضل</option></select></div><p class="muted" id="setupNote">نحسب نقطة بداية محافظة ثم نستخدم اتجاه الوزن لتحسينها.</p><button class="btn primary" onclick="calc()" id="create">إنشاء الهدف</button></div></div><script>let AR=localStorage.getItem('gymLanguage')!=='en',P=JSON.parse(localStorage.getItem('n2profile')||'null'),days=JSON.parse(localStorage.getItem('n2days')||'{}'),weights=JSON.parse(localStorage.getItem('n2weights')||'[]'),savedMeals=JSON.parse(localStorage.getItem('n2saved')||'[]'),pending=0;const $=x=>document.getElementById(x),key=d=>d.toISOString().slice(0,10),today=()=>key(new Date()),yesterday=()=>{let d=new Date();d.setDate(d.getDate()-1);return key(d)},T=(ar,en)=>AR?ar:en;function D(){return days[today()]||(days[today()]={foods:[],water:0,fiber:0})}function persist(){localStorage.setItem('n2days',JSON.stringify(days));localStorage.setItem('n2weights',JSON.stringify(weights));localStorage.setItem('n2saved',JSON.stringify(savedMeals));if(P)localStorage.setItem('n2profile',JSON.stringify(P))}function lang(){AR=!AR;localStorage.setItem('gymLanguage',AR?'ar':'en');render()}function setup(){$('modal').classList.add('on')}function closeM(){$('modal').classList.remove('on')}function calc(){let w=+$('w').value,h=+$('h').value,a=+$('a').value;if(!w||!h||!a)return;let b=10*w+6.25*h-5*a+($('sex').value==='m'?5:-161),maint=b*+$('act').value,g=$('goal').value,cal=maint+(g==='cut'?-350:g==='gain'?200:0);cal=Math.max(1400,Math.round(cal/10)*10);let protein=Math.round(w*(g==='cut'?2:1.8)),fat=Math.max(45,Math.round(w*.8)),carbs=Math.max(80,Math.round((cal-protein*4-fat*9)/4));P={w,h,a,g,cal,protein,fat,carbs};persist();closeM();render()}function totals(){return D().foods.reduce((s,f)=>({cal:s.cal+f.cal,p:s.p+f.p,c:s.c+f.c,fat:s.fat+f.fat,fiber:s.fiber+(f.fiber||0)}),{cal:0,p:0,c:0,fat:0,fiber:0})}function addFood(){let n=prompt(T('اسم الطعام','Food name'));if(!n)return;let cal=+(prompt(T('السعرات','Calories'))||0),p=+(prompt(T('البروتين g','Protein g'))||0),c=+(prompt(T('الكارب g','Carbs g'))||0),fat=+(prompt(T('الدهون g','Fat g'))||0),fiber=+(prompt(T('الألياف g','Fiber g'))||0);D().foods.push({n,cal,p,c,fat,fiber});persist();render()}function del(i){D().foods.splice(i,1);persist();render()}function edit(i){let f=D().foods[i],cal=+(prompt(T('السعرات','Calories'),f.cal)||f.cal);f.cal=cal;f.p=+(prompt(T('البروتين','Protein'),f.p)||f.p);f.c=+(prompt(T('الكارب','Carbs'),f.c)||f.c);f.fat=+(prompt(T('الدهون','Fat'),f.fat)||f.fat);persist();render()}function copyYesterday(){let y=days[yesterday()];if(!y)return alert(T('لا يوجد سجل لأمس','No log for yesterday'));D().foods=JSON.parse(JSON.stringify(y.foods));persist();render()}function saveCurrentMeal(){if(!D().foods.length)return;let name=prompt(T('اسم الوجبة المحفوظة','Saved meal name'));if(!name)return;savedMeals.push({name,foods:JSON.parse(JSON.stringify(D().foods))});persist();alert(T('تم الحفظ','Saved'))}function showSaved(){if(!savedMeals.length)return alert(T('لا توجد وجبات محفوظة','No saved meals'));let list=savedMeals.map((m,i)=>(i+1)+'. '+m.name).join('\n'),n=+(prompt(list+'\n'+T('اكتب رقم الوجبة لإضافتها','Enter meal number to add'))||0);if(savedMeals[n-1])D().foods.push(...JSON.parse(JSON.stringify(savedMeals[n-1].foods)));persist();render()}function water(){D().water++;persist();render()}function mealBuilder(){let t=totals(),rp=Math.max(0,P.protein-t.p),rc=Math.max(0,P.carbs-t.c),rf=Math.max(0,P.fat-t.f);let idea=rp>35?T('دجاج أو تونة قليلة الدهون + رز أو خبز عربي + خضار','Lean chicken or tuna + rice or Arabic bread + vegetables'):T('زبادي يوناني + فاكهة، أو بيض مع خبز عربي حسب المتبقي','Greek yogurt + fruit, or eggs with Arabic bread based on what remains');$('idea').innerHTML='<div class="notice" style="margin-top:12px"><b>'+idea+'</b><p class="muted">'+T(`قرّب الكمية من المتبقي: ${rp}g بروتين • ${rc}g كارب • ${rf}g دهون`,`Size portions toward: ${rp}g protein • ${rc}g carbs • ${rf}g fat`)+'</p></div>'}function logWeight(){let w=+(prompt(T('وزنك اليوم بالكيلو','Today weight kg'))||0);if(!w)return;weights.push({d:today(),w});weights=weights.slice(-60);persist();render()}function weekly(){let a=weights.slice(-7);return a.length?a.reduce((s,x)=>s+x.w,0)/a.length:null}function prevWeekly(){let a=weights.slice(-14,-7);return a.length>=3?a.reduce((s,x)=>s+x.w,0)/a.length:null}function evaluate(){pending=0;let now=weekly(),prev=prevWeekly();if(!now||!prev||!P)return'';let pct=(now-prev)/prev*100;if(P.g==='cut'&&pct>-0.15)pending=-100;if(P.g==='cut'&&pct<-.9)pending=100;if(P.g==='gain'&&pct>.6)pending=-100;if(P.g==='gain'&&pct<.05)pending=100;if(!pending)return T('الاتجاه قريب من الهدف. لا نغيّر السعرات الآن.','Trend is close to target. No calorie change suggested.');return T(`اقتراح فقط: ${pending>0?'+':''}${pending} سعرة يومياً. لن نطبقها بدون موافقتك.`,`Suggestion only: ${pending>0?'+':''}${pending} kcal/day. It will not apply without your approval.`)}function applyAdjustment(){if(!pending)return;P.cal=Math.max(1400,P.cal+pending);P.carbs=Math.max(80,Math.round((P.cal-P.protein*4-P.fat*9)/4));persist();pending=0;render()}function render(){document.documentElement.dir=AR?'rtl':'ltr';document.documentElement.lang=AR?'ar':'en';document.body.className=AR?'':'en';$('lng').textContent=AR?'English':'العربية';$('hello').textContent=T('تغذيتك اليوم','Today nutrition');$('edit').textContent=T('تعديل الهدف','Edit goal');$('mealsT').textContent=T('وجبات اليوم','Today meals');$('add').textContent=T('+ إضافة طعام','+ Add food');$('copy').textContent=T('نسخ أمس','Copy yesterday');$('save').textContent=T('حفظ كوجبة','Save meal');$('saved').textContent=T('وجباتي المحفوظة','Saved meals');$('waterT').textContent=T('الماء والألياف','Water & fiber');$('build').textContent=T('ابنِ وجبتي القادمة','Build my next meal');$('weightT').textContent=T('متوسط الوزن الأسبوعي','Weekly weight average');$('log').textContent=T('تسجيل الوزن','Log weight');$('historyT').textContent=T('السجل','History');$('safe').textContent=T('الأرقام تقديرية وليست بديلاً عن مختص تغذية، ولا يتم تعديل السعرات تلقائياً بدون موافقتك.','Targets are estimates, not a substitute for a dietitian, and calories never change automatically without your approval.');$('dayType').textContent=localStorage.getItem('gymHeld')==='1'?T('يوم راحة','REST DAY'):T('يوم تدريب','TRAINING DAY');if(!P){$('stats').innerHTML='<button class="btn primary" onclick="setup()">'+T('ابدأ إعداد التغذية','Start nutrition setup')+'</button>';setTimeout(setup,250);return}let t=totals(),vals=[[T('السعرات','Calories'),t.cal,P.cal,'kcal'],[T('البروتين','Protein'),t.p,P.protein,'g'],[T('الكارب','Carbs'),t.c,P.carbs,'g'],[T('الدهون','Fat'),t.fat,P.fat,'g']];$('stats').innerHTML=vals.map(v=>`<div class="stat"><b>${v[0]}</b><div>${v[1]} / ${v[2]} ${v[3]}</div><div class="bar"><i style="width:${Math.min(100,v[1]/v[2]*100)}%"></i></div></div>`).join('');$('meals').innerHTML=D().foods.length?D().foods.map((f,i)=>`<div class="meal row"><div><b>${f.n}</b><div class="muted">${f.cal} kcal • P ${f.p} • C ${f.c} • F ${f.fat}</div></div><div><button class="btn" onclick="edit(${i})">✎</button> <button class="btn" onclick="del(${i})">×</button></div></div>`).join(''):'<p class="muted">'+T('ما سجلت وجبات للحين.','No meals logged yet.')+'</p>';$('hydration').innerHTML=`💧 ${D().water} ${T('أكواب مسجلة','cups logged')} • ${T('ألياف','Fiber')}: ${t.fiber}g`;$('coachH').textContent=T('قرارك القادم','Your next decision');let rem=P.cal-t.cal;$('coach').textContent=rem>0?T(`باقي تقريباً ${rem} سعرة. ركّز على إكمال البروتين بدون تجاوز الدهون بشكل كبير.`,`About ${rem} kcal remain. Prioritize remaining protein without heavily overshooting fat.`):T('وصلت هدف السعرات تقريباً. لا تحتاج تضيف وجبة فقط لإكمال رقم ماكرو.','You are around your calorie target. Do not force another meal just to hit a macro number.');let av=weekly();$('avg').textContent=av?av.toFixed(1)+' kg':'—';$('adjust').textContent=evaluate()||T('سجل وزنك عدة مرات بالأسبوع حتى يظهر الاتجاه الذكي.','Log weight several times per week to unlock trend guidance.');$('applyAdj').style.display=pending?'inline-block':'none';$('applyAdj').textContent=T('تطبيق التعديل المقترح','Apply suggested adjustment');$('history').innerHTML=Object.keys(days).sort().reverse().slice(0,7).map(d=>{let x=days[d].foods.reduce((s,f)=>s+f.cal,0);return `<div class="meal row"><span>${d}</span><b>${x} kcal</b></div>`}).join('')||'<p class="muted">—</p>'}render();</script></body></html>
